<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O-LEVEL COMMAND CENTER</title>
    <style>
        /* ---------- RESET & BASE ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --purple: #5b3b8c;
            --purple-light: #7e5db0;
            --purple-lighter: #e8e0f0;
            --lavender: #d4c8e8;
            --gold: #c9a84c;
            --gold-light: #f0e6c8;
            --bg: #f8f7fc;
            --card: #ffffff;
            --text: #1e1a2b;
            --text-secondary: #4a4560;
            --text-muted: #8a85a0;
            --border: #e4e0ec;
            --shadow: 0 2px 12px rgba(91, 59, 140, 0.08);
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --sidebar-width: 260px;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }
        a {
            color: var(--purple);
            text-decoration: none;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        input,
        textarea,
        select {
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.6rem 0.9rem;
            width: 100%;
            transition: var(--transition);
        }
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--purple);
            box-shadow: 0 0 0 3px rgba(91, 59, 140, 0.12);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        select {
            appearance: auto;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--lavender);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--purple-light);
        }

        /* ---------- SIDEBAR ---------- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            padding: 1.5rem 0.8rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        .sidebar-brand {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--purple);
            padding: 0 0.8rem 1.8rem 0.8rem;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .sidebar-brand span {
            background: var(--purple);
            color: #fff;
            font-size: 0.6rem;
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            letter-spacing: 0.3px;
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav .nav-item:hover {
            background: var(--purple-lighter);
            color: var(--purple);
        }
        .sidebar-nav .nav-item.active {
            background: var(--purple);
            color: #fff;
            box-shadow: 0 2px 8px rgba(91, 59, 140, 0.25);
        }
        .sidebar-nav .nav-item .icon {
            font-size: 1.15rem;
            width: 1.6rem;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav .nav-item .label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0.8rem;
        }

        /* ---------- MAIN CONTENT ---------- */
        .main {
            flex: 1;
            min-width: 0;
            padding: 1.8rem 2.2rem 3rem 2.2rem;
            max-width: calc(100vw - var(--sidebar-width));
            overflow-y: auto;
        }
        .page {
            display: none;
            animation: fadeUp 0.25s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ---------- TYPOGRAPHY & UTILITIES ---------- */
        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--purple-lighter);
            color: var(--purple);
        }
        .badge-gold {
            background: var(--gold-light);
            color: #8a7020;
        }
        .badge-green {
            background: #dff0e0;
            color: #1f6e2f;
        }
        .badge-red {
            background: #fce8e8;
            color: #b13a3a;
        }
        .badge-blue {
            background: #dce8f5;
            color: #1f4f8a;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.2rem;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1.2rem 1.4rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: 0 4px 20px rgba(91, 59, 140, 0.1);
        }
        .card-title {
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }
        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .card-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .flex {
            display: flex;
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .flex-center {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .gap-1 {
            gap: 0.5rem;
        }
        .gap-2 {
            gap: 1rem;
        }
        .gap-3 {
            gap: 1.5rem;
        }
        .mt-1 {
            margin-top: 0.5rem;
        }
        .mt-2 {
            margin-top: 1rem;
        }
        .mt-3 {
            margin-top: 1.5rem;
        }
        .mb-1 {
            margin-bottom: 0.5rem;
        }
        .mb-2 {
            margin-bottom: 1rem;
        }
        .mb-3 {
            margin-bottom: 1.5rem;
        }
        .w-full {
            width: 100%;
        }
        .text-center {
            text-align: center;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-sm {
            font-size: 0.85rem;
        }
        .text-xs {
            font-size: 0.75rem;
        }
        .font-bold {
            font-weight: 700;
        }
        .font-medium {
            font-weight: 500;
        }
        .truncate {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* ---------- BUTTONS ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            border: 1.5px solid transparent;
            background: var(--bg);
            color: var(--text-secondary);
        }
        .btn:hover {
            background: var(--border);
        }
        .btn-primary {
            background: var(--purple);
            color: #fff;
            border-color: var(--purple);
        }
        .btn-primary:hover {
            background: var(--purple-light);
            border-color: var(--purple-light);
            box-shadow: 0 2px 10px rgba(91, 59, 140, 0.25);
        }
        .btn-outline {
            background: transparent;
            border-color: var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--purple);
            color: var(--purple);
        }
        .btn-gold {
            background: var(--gold);
            color: #fff;
            border-color: var(--gold);
        }
        .btn-gold:hover {
            background: #b89430;
            border-color: #b89430;
        }
        .btn-sm {
            padding: 0.3rem 0.8rem;
            font-size: 0.75rem;
        }
        .btn-danger {
            background: #e74c4c;
            color: #fff;
            border-color: #e74c4c;
        }
        .btn-danger:hover {
            background: #c0392b;
            border-color: #c0392b;
        }
        .btn-success {
            background: #27ae60;
            color: #fff;
            border-color: #27ae60;
        }
        .btn-success:hover {
            background: #1e8449;
            border-color: #1e8449;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-ghost:hover {
            background: var(--bg);
        }

        /* ---------- DASHBOARD ---------- */
        .greeting {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.1rem;
        }
        .greeting-sub {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.2rem;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.8rem;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 0.9rem 1.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .stat-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-card .value {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* ---------- MISSION ---------- */
        .mission-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0.8rem;
            border-radius: var(--radius-sm);
            background: var(--bg);
            border-left: 4px solid var(--purple);
            margin-bottom: 0.4rem;
        }
        .mission-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .mission-item .dot.red {
            background: #e74c4c;
        }
        .mission-item .dot.yellow {
            background: #f1c40f;
        }
        .mission-item .dot.green {
            background: #27ae60;
        }
        .mission-item .info {
            flex: 1;
        }
        .mission-item .info .title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .mission-item .info .sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .mission-item .actions {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .mission-item .actions .tag {
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 500;
            background: var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .mission-item .actions .tag:hover {
            background: var(--purple);
            color: #fff;
        }

        /* ---------- SUBJECT LIST ---------- */
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .subject-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1rem 1.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
        }
        .subject-card:hover {
            border-color: var(--purple);
            box-shadow: 0 4px 16px rgba(91, 59, 140, 0.12);
        }
        .subject-card .name {
            font-weight: 600;
            font-size: 1rem;
        }
        .subject-card .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }
        .subject-card .progress {
            margin-top: 0.5rem;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .subject-card .progress .bar {
            height: 100%;
            background: var(--purple);
            border-radius: 4px;
            transition: width 0.4s ease;
        }

        /* ---------- MODAL ---------- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.8rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
            animation: modalIn 0.2s ease;
        }
        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }
        .modal .modal-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }
        .modal .form-group {
            margin-bottom: 1rem;
        }
        .modal .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
            color: var(--text-secondary);
        }
        .modal .form-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 1.2rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
        }

        /* ---------- TABLE ---------- */
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            text-align: left;
            padding: 0.6rem 1rem;
            background: var(--bg);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .table-actions {
            display: flex;
            gap: 0.3rem;
        }
        .table-actions button {
            padding: 0.15rem 0.5rem;
            font-size: 0.7rem;
            border-radius: 4px;
            background: var(--bg);
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .table-actions button:hover {
            background: var(--border);
        }

        /* ---------- MISC ---------- */
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
        }
        .empty-state .icon {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        .empty-state .title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }
        .empty-state .desc {
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }
        .pill {
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .pill.purple {
            background: var(--purple-lighter);
            color: var(--purple);
        }
        .pill.green {
            background: #dff0e0;
            color: #1f6e2f;
        }
        .pill.red {
            background: #fce8e8;
            color: #b13a3a;
        }
        .pill.gold {
            background: var(--gold-light);
            color: #8a7020;
        }
        .pill.blue {
            background: #dce8f5;
            color: #1f4f8a;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 0.3rem;
        }
        .status-dot.red {
            background: #e74c4c;
        }
        .status-dot.yellow {
            background: #f1c40f;
        }
        .status-dot.green {
            background: #27ae60;
        }
        .status-dot.gray {
            background: #b0aac0;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 1024px) {
            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }
            .grid-3 {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 820px) {
            .sidebar {
                width: 68px;
                padding: 1rem 0.4rem;
            }
            .sidebar-brand span {
                display: none;
            }
            .sidebar-brand {
                font-size: 0.9rem;
                justify-content: center;
                padding: 0 0 1.2rem 0;
            }
            .sidebar-nav .nav-item .label {
                display: none;
            }
            .sidebar-nav .nav-item {
                justify-content: center;
                padding: 0.6rem;
            }
            .sidebar-nav .nav-item .icon {
                font-size: 1.3rem;
                width: auto;
            }
            .sidebar-footer {
                display: none;
            }
            .main {
                padding: 1.2rem 1.2rem 2rem 1.2rem;
                max-width: calc(100vw - 68px);
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .grid-3 {
                grid-template-columns: 1fr 1fr;
            }
            .grid-4 {
                grid-template-columns: 1fr 1fr;
            }
            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .sidebar {
                width: 56px;
                padding: 0.6rem 0.2rem;
            }
            .sidebar-brand {
                font-size: 0.7rem;
                padding: 0 0 0.8rem 0;
            }
            .sidebar-nav .nav-item {
                padding: 0.5rem 0.3rem;
            }
            .sidebar-nav .nav-item .icon {
                font-size: 1.1rem;
            }
            .main {
                padding: 0.8rem 0.8rem 1.5rem 0.8rem;
                max-width: calc(100vw - 56px);
            }
            .page-title {
                font-size: 1.3rem;
            }
            .grid-3,
            .grid-4 {
                grid-template-columns: 1fr 1fr;
            }
            .stat-grid {
                grid-template-columns: 1fr 1fr;
            }
            .modal {
                padding: 1.2rem;
            }
            .mission-item {
                flex-wrap: wrap;
            }
            .mission-item .actions {
                width: 100%;
                margin-top: 0.2rem;
            }
            .subject-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ---------- TABS ---------- */
        .tabs {
            display: flex;
            gap: 0.1rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
        }
        .tabs .tab {
            padding: 0.5rem 1.2rem;
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
            cursor: pointer;
            transition: var(--transition);
        }
        .tabs .tab:hover {
            color: var(--text);
        }
        .tabs .tab.active {
            color: var(--purple);
            border-bottom-color: var(--purple);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }

        /* ---------- FOCUS TIMER ---------- */
        .timer-display {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            text-align: center;
            padding: 0.5rem 0;
        }
        .timer-controls {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        /* ---------- SYLLABUS TREE ---------- */
        .tree-item {
            padding: 0.3rem 0 0.3rem 1.2rem;
            border-left: 2px solid var(--border);
            margin-left: 0.8rem;
        }
        .tree-item .node {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .tree-item .node:hover {
            background: var(--bg);
        }
        .tree-item .node .mastery {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tree-item .node .mastery.red {
            background: #e74c4c;
        }
        .tree-item .node .mastery.orange {
            background: #e67e22;
        }
        .tree-item .node .mastery.yellow {
            background: #f1c40f;
        }
        .tree-item .node .mastery.blue {
            background: #3498db;
        }
        .tree-item .node .mastery.green {
            background: #27ae60;
        }

        /* ---------- MISTAKE BANK ---------- */
        .mistake-type {
            font-size: 0.65rem;
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            background: var(--border);
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* ---------- CALENDAR MINI ---------- */
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.8rem;
        }
        .cal-grid .cal-header {
            font-weight: 600;
            color: var(--text-muted);
            padding: 0.2rem 0;
            font-size: 0.7rem;
        }
        .cal-grid .cal-day {
            padding: 0.3rem 0;
            border-radius: 4px;
            background: var(--bg);
            cursor: default;
        }
        .cal-grid .cal-day.has-event {
            background: var(--purple-lighter);
            color: var(--purple);
            font-weight: 600;
        }
        .cal-grid .cal-day.other {
            color: var(--text-muted);
            opacity: 0.4;
        }
        .cal-grid .cal-day.today {
            background: var(--purple);
            color: #fff;
            font-weight: 700;
        }

        /* ---------- TOAST ---------- */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1.2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            border-left: 4px solid var(--purple);
            animation: slideIn 0.25s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .toast.success {
            border-left-color: #27ae60;
        }
        .toast.error {
            border-left-color: #e74c4c;
        }
        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateX(20px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .toast .close {
            margin-left: auto;
            cursor: pointer;
            opacity: 0.5;
            font-size: 1.1rem;
        }
        .toast .close:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- ============ SIDEBAR ============ -->
    <nav class="sidebar" id="sidebar" role="navigation" aria-label="Main navigation">
        <div class="sidebar-brand">
            ⚡ O-LEVEL <span>CC</span>
        </div>
        <div class="sidebar-nav" id="navContainer">
            <!-- Populated by JS -->
        </div>
        <div class="sidebar-footer">
            Maira · Grade 9
        </div>
    </nav>

    <!-- ============ MAIN ============ -->
    <main class="main" id="mainContent">
        <!-- Pages rendered by JS -->
    </main>

    <!-- ============ MODAL ============ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent">
            <!-- Populated by JS -->
        </div>
    </div>

    <!-- ============ TOAST ============ -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ================================================================
        //  DATA LAYER
        // ================================================================

        const DB_KEY = 'olevel_cc_data';

        function getDefaultData() {
            return {
                student: {
                    name: 'Maira',
                    grade: 'Grade 9',
                    currentYear: '2026-2027',
                    examYear: 'CIE 2027',
                },
                subjects: [
                    { id: 'subj1', name: 'Economics', grade: '9', color: '#5b3b8c', archived: false },
                    { id: 'subj2', name: 'Business', grade: '9', color: '#c9a84c', archived: false },
                    { id: 'subj3', name: 'Accounting', grade: '9', color: '#2d7d6f', archived: false },
                    { id: 'subj4', name: 'English', grade: '9', color: '#4a6fa5', archived: false },
                    { id: 'subj5', name: 'Mathematics', grade: '9', color: '#c0392b', archived: false },
                    { id: 'subj6', name: 'Urdu', grade: '9', color: '#8e44ad', archived: false },
                    { id: 'subj7', name: 'Islamiat', grade: '9', color: '#1a7a5a', archived: false },
                    { id: 'subj8', name: 'Pakistan Studies', grade: '9', color: '#2c3e50', archived: false },
                    { id: 'subj9', name: 'Global Perspectives', grade: '9', color: '#d35400', archived: false },
                ],
                syllabus: {}, // subjectId -> [{ id, unit, topics: [{ id, name, concepts: [{ id, name, mastery, notes }] }] }]
                notes: [], // [{ id, title, content, subjectId, topicId, conceptId, tags, pinned, archived, createdAt, updatedAt }]
                tasks: [], // [{ id, title, subjectId, topicId, priority, deadline, status, estimatedTime, recurrence, createdAt }]
                mistakes: [], // [{ id, subjectId, topicId, question, myAnswer, correctAnswer, whyWrong, type, date, difficulty, reviewed, correctedUnderstanding }]
                activities: [], // [{ id, name, category, organization, role, startDate, endDate, status, hours, grade, level, description, achievements, impact, evidence, reflection }]
                goals: [], // [{ id, title, category, deadline, milestones, progress, reflection, createdAt }]
                skills: [], // [{ id, name, level, projects, courses, certificates, hours, evidence }]
                stories: [], // [{ id, title, date, situation, whatHappened, actions, emotions, challenge, outcome, lesson, growth, values, relatedActivity, tags }]
                universities: [], // [{ id, name, country, location, website, programs, majors, applicationSystem, deadlines, requirements, testing, essays, recommendations, financialAid, scholarships, notes, fit, classification }]
                essays: [], // [{ id, title, type, prompt, wordLimit, deadline, drafts, notes, feedback, finalVersion, universityId }]
                books: [], // [{ id, title, author, subject, description, source, url, notes }]
                videos: [], // [{ id, title, url, subject, topic, concept, duration, watched, rating, notes }]
                flashcards: [], // [{ id, front, back, subject, topic, concept, difficulty, confidence, reviewDate, correct, incorrect, lastReviewed }]
                pastPapers: [], // [{ id, subject, board, code, year, session, paper, questions: [{ id, topic, concept, marks, difficulty, type, markScheme, myAnswer, score, mistake }] }]
                mockExams: [], // [{ id, subject, paperId, date, score, percentage, weaknesses, timeManagement, notes }]
                formulas: [], // [{ id, name, formula, variables, explanation, example, subject, topics }]
                glossary: [], // [{ id, term, definition, subject, topic, example, related }]
                diagrams: [], // [{ id, title, subject, topic, concept, image, description, labels }]
                examTechniques: [], // [{ id, title, content, subject }]
                events: [], // [{ id, title, date, type, subject, description, completed }]
                recommendations: [], // [{ id, name, subject, relationship, grade, requested, status, deadline, submitted, materials }]
                scholarships: [], // [{ id, name, organization, amount, deadline, eligibility, requirements, essay, documents, status, url, notes }]
                evidence: [], // [{ id, name, type, date, category, linkedId, file, notes }]
                projects: [], // [{ id, name, description, problem, solution, technologies, role, startDate, endDate, status, users, impact, github, website, screenshots, documentation, lessons }]
                awards: [], // [{ id, name, organization, date, level, category, result, description, relatedActivity, evidence }]
                reflections: [], // [{ id, date, title, content, tags, mood, relatedId }]
                studySessions: [], // [{ id, subject, topic, date, duration, pomodoros }]
                settings: {
                    theme: 'light',
                    notifications: true,
                    aiEnabled: true,
                },
                version: 1,
            };
        }

        let data = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    // ensure all keys exist
                    const def = getDefaultData();
                    for (const k in def) {
                        if (!(k in parsed)) parsed[k] = def[k];
                    }
                    return parsed;
                }
            } catch (_) { /* ignore */ }
            return getDefaultData();
        }

        function saveData() {
            localStorage.setItem(DB_KEY, JSON.stringify(data));
        }

        function genId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
        }

        function getSubject(id) {
            return data.subjects.find(s => s.id === id);
        }

        function getSubjectName(id) {
            const s = getSubject(id);
            return s ? s.name : 'Unknown';
        }

        function getGradeLabel(g) {
            return `Grade ${g}`;
        }

        // ================================================================
        //  TOAST SYSTEM
        // ================================================================

        function toast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML = `
            <span>${msg}</span>
            <span class="close" onclick="this.parentElement.remove()">✕</span>
          `;
            container.appendChild(el);
            setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
        }

        // ================================================================
        //  MODAL SYSTEM
        // ================================================================

        function openModal(html) {
            const overlay = document.getElementById('modalOverlay');
            document.getElementById('modalContent').innerHTML = html;
            overlay.classList.add('open');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('open');
        }
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ================================================================
        //  NAVIGATION
        // ================================================================

        const NAV_ITEMS = [
            { id: 'dashboard', icon: '🏠', label: 'Dashboard' },
            { id: 'academics', icon: '📚', label: 'Academics' },
            { id: 'subjects', icon: '📖', label: 'Subjects' },
            { id: 'syllabus', icon: '🗂️', label: 'Syllabus' },
            { id: 'notes', icon: '📝', label: 'Notes' },
            { id: 'tasks', icon: '✅', label: 'Tasks' },
            { id: 'mistakes', icon: '❌', label: 'Mistake Bank' },
            { id: 'flashcards', icon: '🃏', label: 'Flashcards' },
            { id: 'pastpapers', icon: '📄', label: 'Past Papers' },
            { id: 'timer', icon: '⏱️', label: 'Focus Timer' },
            { id: 'calendar', icon: '📅', label: 'Calendar' },
            { id: 'activities', icon: '🏆', label: 'ECC & Co-Curricular' },
            { id: 'goals', icon: '🎯', label: 'Goals' },
            { id: 'stories', icon: '📖', label: 'Story Bank' },
            { id: 'college', icon: '🎓', label: 'College Prep' },
            { id: 'universities', icon: '🏛️', label: 'Universities' },
            { id: 'essays', icon: '✍️', label: 'Essays' },
            { id: 'settings', icon: '⚙️', label: 'Settings' },
        ];

        let currentPage = 'dashboard';

        function renderNav() {
            const container = document.getElementById('navContainer');
            container.innerHTML = NAV_ITEMS.map(item => `
            <button class="nav-item ${item.id === currentPage ? 'active' : ''}"
                    data-page="${item.id}"
                    aria-current="${item.id === currentPage ? 'page' : 'false'}">
              <span class="icon">${item.icon}</span>
              <span class="label">${item.label}</span>
            </button>
          `).join('');
            container.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    navigate(btn.dataset.page);
                });
            });
        }

        function navigate(page) {
            currentPage = page;
            renderNav();
            renderPage(page);
            // scroll to top
            document.getElementById('mainContent').scrollTop = 0;
        }

        // ================================================================
        //  PAGE RENDERER
        // ================================================================

        function renderPage(page) {
            const main = document.getElementById('mainContent');
            const pages = main.querySelectorAll('.page');
            pages.forEach(p => p.remove());

            const container = document.createElement('div');
            container.className = 'page active';
            container.id = `page-${page}`;

            switch (page) {
                case 'dashboard':
                    container.innerHTML = renderDashboard();
                    break;
                case 'subjects':
                    container.innerHTML = renderSubjects();
                    break;
                case 'syllabus':
                    container.innerHTML = renderSyllabus();
                    break;
                case 'notes':
                    container.innerHTML = renderNotes();
                    break;
                case 'tasks':
                    container.innerHTML = renderTasks();
                    break;
                case 'mistakes':
                    container.innerHTML = renderMistakes();
                    break;
                case 'flashcards':
                    container.innerHTML = renderFlashcards();
                    break;
                case 'pastpapers':
                    container.innerHTML = renderPastPapers();
                    break;
                case 'timer':
                    container.innerHTML = renderTimer();
                    break;
                case 'calendar':
                    container.innerHTML = renderCalendar();
                    break;
                case 'activities':
                    container.innerHTML = renderActivities();
                    break;
                case 'goals':
                    container.innerHTML = renderGoals();
                    break;
                case 'stories':
                    container.innerHTML = renderStories();
                    break;
                case 'college':
                    container.innerHTML = renderCollege();
                    break;
                case 'universities':
                    container.innerHTML = renderUniversities();
                    break;
                case 'essays':
                    container.innerHTML = renderEssays();
                    break;
                case 'settings':
                    container.innerHTML = renderSettings();
                    break;
                default:
                    container.innerHTML = `<div class="page-title">📄 ${page}</div><p class="text-muted">Page content coming soon.</p>`;
            }

            main.appendChild(container);

            // post-render init
            if (page === 'timer') initTimer();
            if (page === 'calendar') initCalendar();
        }

        // ================================================================
        //  DASHBOARD
        // ================================================================

        function renderDashboard() {
            const name = data.student.name || 'Maira';
            const grade = data.student.grade || 'Grade 9';
            const examYear = data.student.examYear || 'CIE 2027';
            const now = new Date();
            const day = now.toLocaleDateString('en-US', { weekday: 'long' });

            // count subjects
            const totalSubjects = data.subjects.filter(s => !s.archived).length;
            const totalTasks = data.tasks.length;
            const pendingTasks = data.tasks.filter(t => t.status !== 'Completed').length;
            const totalMistakes = data.mistakes.length;
            const totalNotes = data.notes.length;

            // study streak - simple heuristic
            const streak = Math.floor(Math.random() * 12) + 4; // placeholder

            // mission - highest priority tasks
            const missionTasks = data.tasks
                .filter(t => t.status !== 'Completed')
                .sort((a, b) => {
                    const pri = { high: 0, medium: 1, low: 2 };
                    return (pri[a.priority] || 1) - (pri[b.priority] || 1);
                })
                .slice(0, 5);

            // upcoming exams - from events
            const upcomingExams = data.events
                .filter(e => e.type === 'exam' && new Date(e.date) >= now)
                .sort((a, b) => new Date(a.date) - new Date(b.date))
                .slice(0, 3);

            const daysUntilExam = upcomingExams.length > 0 ?
                Math.ceil((new Date(upcomingExams[0].date) - now) / (1000 * 60 * 60 * 24)) :
                '—';

            // recent mistakes
            const recentMistakes = data.mistakes.slice(-3).reverse();

            return `
            <div class="greeting">Good ${now.getHours() < 12 ? 'morning' : now.getHours() < 17 ? 'afternoon' : 'evening'}, ${name} 👋</div>
            <div class="greeting-sub">${day} · ${grade} · ${examYear}</div>

            <div class="stat-grid">
              <div class="stat-card"><div class="label">Grade</div><div class="value">${grade}</div></div>
              <div class="stat-card"><div class="label">Exam Year</div><div class="value">${examYear}</div></div>
              <div class="stat-card"><div class="label">Days to Next Exam</div><div class="value">${daysUntilExam}</div></div>
              <div class="stat-card"><div class="label">Study Streak</div><div class="value">🔥 ${streak} days</div></div>
            </div>

            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.8rem;flex-wrap:wrap;gap:0.5rem;">
              <h2 style="font-size:1.2rem;font-weight:700;">🎯 Today's Mission</h2>
              <button class="btn btn-sm btn-primary" onclick="navigate('tasks')">View All Tasks →</button>
            </div>

            ${missionTasks.length === 0 ? `
              <div class="empty-state">
                <div class="icon">✅</div>
                <div class="title">All caught up!</div>
                <div class="desc">No pending tasks for today.</div>
              </div>
            ` : `
              ${missionTasks.map(t => {
                const color = t.priority === 'high' ? 'red' : t.priority === 'medium' ? 'yellow' : 'green';
                return `
                  <div class="mission-item">
                    <span class="dot ${color}"></span>
                    <div class="info">
                      <div class="title">${t.title}</div>
                      <div class="sub">${t.subject ? getSubjectName(t.subject) : 'General'} · ${t.priority || 'medium'} priority</div>
                    </div>
                    <div class="actions">
                      <span class="tag" onclick="quickAction('learn','${t.id}')">Learn</span>
                      <span class="tag" onclick="quickAction('notes','${t.id}')">Notes</span>
                      <span class="tag" onclick="quickAction('practice','${t.id}')">Practice</span>
                      <span class="tag" onclick="quickAction('review','${t.id}')">Review</span>
                    </div>
                  </div>
                `;
              }).join('')}
            `}

            <div class="grid-3 mt-3">
              <div class="card">
                <div class="card-title">📚 Subjects</div>
                <div class="card-value">${totalSubjects}</div>
                <div class="card-label">Active subjects</div>
              </div>
              <div class="card">
                <div class="card-title">✅ Tasks</div>
                <div class="card-value">${pendingTasks}/${totalTasks}</div>
                <div class="card-label">Pending / Total</div>
              </div>
              <div class="card">
                <div class="card-title">📝 Notes</div>
                <div class="card-value">${totalNotes}</div>
                <div class="card-label">Total notes</div>
              </div>
            </div>

            ${recentMistakes.length > 0 ? `
              <div class="mt-3">
                <h3 style="font-weight:600;font-size:1rem;margin-bottom:0.4rem;">⚠️ Recent Mistakes</h3>
                ${recentMistakes.map(m => `
                  <div class="mission-item" style="border-left-color:#e74c4c;">
                    <span class="dot red"></span>
                    <div class="info">
                      <div class="title">${m.question || 'Mistake'}</div>
                      <div class="sub">${getSubjectName(m.subjectId)} · ${m.type || 'Other'} · ${new Date(m.date).toLocaleDateString()}</div>
                    </div>
                    <span class="pill red">${m.type || 'Other'}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          `;
        }

        function quickAction(action, taskId) {
            toast(`📌 ${action} action on task #${taskId.slice(0,6)}`, 'info');
        }

        // ================================================================
        //  SUBJECTS
        // ================================================================

        function renderSubjects() {
            const active = data.subjects.filter(s => !s.archived);
            const archived = data.subjects.filter(s => s.archived);

            return `
            <div class="flex-between">
              <div><div class="page-title">📖 Subjects</div>
              <div class="page-subtitle">Manage your O-Level subjects across grades.</div></div>
              <button class="btn btn-primary" onclick="showAddSubject()">+ Add Subject</button>
            </div>

            <div style="margin-top:0.5rem;">
              <div class="card">
                <div style="font-weight:600;margin-bottom:0.5rem;">Grade 9</div>
                <div class="subject-grid">
                  ${active.filter(s => s.grade === '9').map(s => subjectCardHtml(s)).join('')}
                </div>
              </div>
              <div class="card mt-2">
                <div style="font-weight:600;margin-bottom:0.5rem;">Grade 10 & 11</div>
                <div class="subject-grid">
                  ${active.filter(s => s.grade !== '9').map(s => subjectCardHtml(s)).join('')}
                  ${active.filter(s => s.grade !== '9').length === 0 ? '<div class="text-muted text-sm">No subjects assigned to Grade 10 or 11 yet.</div>' : ''}
                </div>
              </div>
              ${archived.length > 0 ? `
                <div class="card mt-2" style="opacity:0.6;">
                  <div style="font-weight:600;margin-bottom:0.5rem;">Archived</div>
                  <div class="subject-grid">
                    ${archived.map(s => subjectCardHtml(s, true)).join('')}
                  </div>
                </div>
              ` : ''}
            </div>
          `;
        }

        function subjectCardHtml(s, archived = false) {
            const count = data.notes.filter(n => n.subjectId === s.id).length +
                data.tasks.filter(t => t.subjectId === s.id).length;
            return `
            <div class="subject-card" style="border-left:4px solid ${s.color || '#5b3b8c'}">
              <div class="name">${s.name}</div>
              <div class="meta">${getGradeLabel(s.grade)} · ${archived ? 'Archived' : ''} · ${count} items</div>
              <div class="progress"><div class="bar" style="width:${Math.min(30 + Math.random()*50, 85)}%"></div></div>
              <div style="display:flex;gap:0.3rem;margin-top:0.4rem;flex-wrap:wrap;">
                <button class="btn btn-sm btn-ghost" onclick="editSubject('${s.id}')">✏️</button>
                <button class="btn btn-sm btn-ghost" onclick="archiveSubject('${s.id}')">${archived ? 'Unarchive' : 'Archive'}</button>
                <button class="btn btn-sm btn-danger" onclick="deleteSubject('${s.id}')">🗑️</button>
              </div>
            </div>
          `;
        }

        function showAddSubject() {
            const grades = ['9', '10', '11'];
            openModal(`
            <div class="modal-title">➕ Add Subject</div>
            <div class="modal-sub">Add a new subject to your academic plan.</div>
            <div class="form-group">
              <label>Subject Name</label>
              <input id="modalSubName" placeholder="e.g. Computer Science" />
            </div>
            <div class="form-group">
              <label>Grade</label>
              <select id="modalSubGrade">
                ${grades.map(g => `<option value="${g}">Grade ${g}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Color</label>
              <input id="modalSubColor" type="color" value="#5b3b8c" style="width:60px;height:40px;padding:2px;" />
            </div>
            <div class="form-actions">
              <button class="btn" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="addSubject()">Add Subject</button>
            </div>
          `);
        }

        function addSubject() {
            const name = document.getElementById('modalSubName').value.trim();
            const grade = document.getElementById('modalSubGrade').value;
            const color = document.getElementById('modalSubColor').value;
            if (!name) { toast('Please enter a subject name.', 'error'); return; }
            data.subjects.push({
                id: genId(),
                name,
                grade,
                color,
                archived: false,
            });
            saveData();
            closeModal();
            toast(`✅ Added ${name}`, 'success');
            renderPage('subjects');
        }

        function editSubject(id) {
            const s = getSubject(id);
            if (!s) return;
            openModal(`
            <div class="modal-title">✏️ Edit Subject</div>
            <div class="form-group">
              <label>Subject Name</label>
              <input id="editSubName" value="${s.name}" />
            </div>
            <div class="form-group">
              <label>Grade</label>
              <select id="editSubGrade">
                ${['9','10','11'].map(g => `<option value="${g}" ${g===s.grade?'selected':''}>Grade ${g}</option>`).join('')}
              </select>
            </div>

        // ================================================================
        //  SYLLABUS
        // ================================================================

        function renderSyllabus() {
            const subjects = data.subjects.filter(s => !s.archived);
            if (subjects.length === 0) {
                return `
              <div class="page-title">🗂️ Syllabus</div>
              <div class="page-subtitle">Track your syllabus progress by subject.</div>
              <div class="empty-state">
                <div class="icon">📚</div>
                <div class="title">No subjects yet</div>
                <div class="desc">Add a subject first to start building your syllabus.</div>
                <button class="btn btn-primary mt-2" onclick="navigate('subjects')">Go to Subjects</button>
              </div>
            `;
            }

            let html = `
            <div class="page-title">🗂️ Syllabus</div>
            <div class="page-subtitle">Break down each subject into units, topics, and concepts.</div>
          `;

            subjects.forEach(sub => {
                const syllabus = data.syllabus[sub.id] || [];
                const totalConcepts = syllabus.reduce((acc, u) => acc + u.topics.reduce((a, t) => a + (t.concepts ? t.concepts
                    .length : 0), 0), 0);
                const mastered = syllabus.reduce((acc, u) => acc + u.topics.reduce((a, t) => a + (t.concepts ? t.concepts
                    .filter(c => c.mastery === 'mastered').length : 0), 0), 0);
                const pct = totalConcepts > 0 ? Math.round(mastered / totalConcepts * 100) : 0;

                html += `
              <div class="card mt-2">
                <div class="flex-between">
                  <div>
                    <span style="font-weight:700;font-size:1.1rem;">${sub.name}</span>
                    <span class="badge ml-1">${pct}% complete</span>
                  </div>
                  <button class="btn btn-sm btn-primary" onclick="addSyllabusUnit('${sub.id}')">+ Add Unit</button>
                </div>
                <div class="mt-1">
                  ${syllabus.length === 0 ? '<div class="text-muted text-sm">No units added yet.</div>' : ''}
                  ${syllabus.map((unit, ui) => `
                    <div style="margin-top:0.3rem;padding:0.3rem 0.5rem;background:var(--bg);border-radius:var(--radius-sm);">
                      <div class="flex-between">
                        <span style="font-weight:600;">${unit.name}</span>
                        <div>
                          <button class="btn btn-sm btn-ghost" onclick="addSyllabusTopic('${sub.id}',${ui})">+ Topic</button>
                          <button class="btn btn-sm btn-ghost" onclick="editSyllabusUnit('${sub.id}',${ui})">✏️</button>
                          <button class="btn btn-sm btn-ghost" onclick="deleteSyllabusUnit('${sub.id}',${ui})">🗑️</button>
                        </div>
                      </div>
                      ${unit.topics && unit.topics.length > 0 ? unit.topics.map((topic, ti) => `
                        <div class="tree-item">
                          <div class="node">
                            <span>📌</span>
                            <span style="font-weight:500;">${topic.name}</span>
                            <span style="font-size:0.7rem;color:var(--text-muted);">${topic.concepts ? topic.concepts.length : 0} concepts</span>
                            <button class="btn btn-sm btn-ghost" onclick="addSyllabusConcept('${sub.id}',${ui},${ti})" style="margin-left:auto;">+ Concept</button>
                            <button class="btn btn-sm btn-ghost" onclick="editSyllabusTopic('${sub.id}',${ui},${ti})">✏️</button>
                            <button class="btn btn-sm btn-ghost" onclick="deleteSyllabusTopic('${sub.id}',${ui},${ti})">🗑️</button>
                          </div>
                          ${topic.concepts && topic.concepts.length > 0 ? topic.concepts.map((concept, ci) => `
                            <div class="tree-item">
                              <div class="node">
                                <span class="mastery ${concept.mastery || 'red'}"></span>
                                <span>${concept.name}</span>
                                <span class="pill ${concept.mastery || 'red'}">${concept.mastery || 'Not Started'}</span>
                                <button class="btn btn-sm btn-ghost" onclick="editSyllabusConcept('${sub.id}',${ui},${ti},${ci})" style="margin-left:auto;">✏️</button>
                                <button class="btn btn-sm btn-ghost" onclick="deleteSyllabusConcept('${sub.id}',${ui},${ti},${ci})">🗑️</button>
                              </div>
                            </div>
                          `).join('') : '<div class="text-muted text-xs" style="padding-left:1.2rem;">No concepts yet.</div>'}
                        </div>
                      `).join('') : '<div class="text-muted text-xs" style="padding-left:0.8rem;">No topics yet.</div>'}
                    </div>
                  `).join('')}
                </div>
              </div>
            `;
            });

            return html;
        }

        // Syllabus helpers
        function getSyllabus(subId) {
            if (!data.syllabus[subId]) data.syllabus[subId] = [];
            return data.syllabus[subId];
        }

            <div class="form-group">

              <input id="sylUnitName" placeholder="e.g. Microeconomics" />
            </div>
            <div class="form-actions">

            </div>
          `);

        function saveSyllabusUnit(subId) {
            const name = document.getElementById('sylUnitName').value.trim();

            const syllabus = getSyllabus(subId);
            syllabus.push({ id: genId(), name, topics: [] });
            data.syllabus[subId] = syllabus;
            saveData();
            closeModal();
            toast('✅ Unit added', 'success');
            renderPage('syllabus');
        }

              </select>

            <div class="form-actions">
              <button class="btn" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="saveSyllabusConcept('${subId}',${ui},${ti})">Add Concept</button>
            </div>
          `);

        function saveSyllabusConcept(subId, ui, ti) {
            const name = document.getElementById('sylConceptName').value.trim();

              <label>Notes</label>
              <textarea id="editSylConceptNotes" rows="2">${concept.notes || ''}</textarea>

            <div class="form-actions">

              <button class="btn btn-primary" onclick="saveEditSyllabusConcept('${subId}',${ui},${ti},${ci})">Save</button>
            </div>
          `);
        }

        function saveEditSyllabusConcept(subId, ui, ti, ci) {
            const syllabus = getSyllabus(subId);
            const concept = syllabus[ui].topics[ti].concepts[ci];
            const name = document.getElementById('editSylConcept').value.trim();
            const mastery = document.getElementById('editSylConceptMastery').value;

            data.syllabus[subId] = syllabus;
            saveData();
            toast('🗑️ Concept deleted', 'info');
            renderPage('syllabus');
        }

        // ================================================================
        //  NOTES
        // ================================================================

        function renderNotes() {
            const subjects = data.subjects.filter(s => !s.archived);
            let html = `
            <div class="flex-between">
              <div><div class="page-title">📝 Notes</div>
              <div class="page-subtitle">Your personal knowledge base.</div></div>
              <button class="btn btn-primary" onclick="showAddNote()">+ New Note</button>
            </div>
          `;

            const notes = data.notes.filter(n => !n.archived).sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a
                .createdAt));
            if (notes.length === 0) {
                html += `
              <div class="empty-state">
                <div class="icon">📝</div>
                <div class="title">No notes yet</div>
                <div class="desc">Start capturing your knowledge.</div>
              </div>
            `;
            } else {
                html += `<div class="grid-2 mt-2">`;
                notes.forEach(n => {
                    const subName = n.subjectId ? getSubjectName(n.subjectId) : 'General';
                    html += `
                <div class="card">
                  <div class="flex-between">
                    <span style="font-weight:600;">${n.title || 'Untitled'}</span>
                    <span class="badge">${subName}</span>
                  </div>
                  <div class="text-sm text-muted mt-1">${n.content ? n.content.slice(0,120) + (n.content.length>120?'...':'') : 'No content'}</div>
                  <div style="display:flex;gap:0.3rem;margin-top:0.5rem;flex-wrap:wrap;">
                    <span class="pill purple">${n.tags ? n.tags.join(', ') : 'untagged'}</span>
                    <button class="btn btn-sm btn-ghost" onclick="editNote('${n.id}')">✏️</button>
                    <button class="btn btn-sm btn-ghost" onclick="archiveNote('${n.id}')">📦</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteNote('${n.id}')">🗑️</button>
                  </div>
                </div>
              `;
                });
                html += `</div>`;
            }

            // Archived notes
            const archived = data.notes.filter(n => n.archived);
            if (archived.length > 0) {
                html += `
              <div class="mt-3">
                <details>
                  <summary style="cursor:pointer;font-weight:600;color:var(--text-muted);">📦 Archived Notes (${archived.length})</summary>
                  <div class="grid-2 mt-1">
                    ${archived.map(n => `
                      <div class="card" style="opacity:0.6;">
                        <div class="flex-between">
                          <span style="font-weight:600;">${n.title || 'Untitled'}</span>
                          <button class="btn btn-sm btn-ghost" onclick="unarchiveNote('${n.id}')">↩️</button>
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </details>
              </div>
            `;
            }

            return html;
        }

        function showAddNote() {
            const subjects = data.subjects.filter(s => !s.archived);
            openModal(`
            <div class="modal-title">📝 New Note</div>
            <div class="form-group">
              <label>Title</label>
              <input id="noteTitle" placeholder="Note title" />
            </div>
            <div class="form-group">
              <label>Subject</label>
              <select id="noteSubject">
                <option value="">General</option>
                ${subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Content</label>
              <textarea id="noteContent" rows="5" placeholder="Write your notes here..."></textarea>
            </div>
            <div class="form-group">
              <label>Tags (comma separated)</label>
              <input id="noteTags" placeholder="e.g. economics, elasticity" />
            </div>
            <div class="form-actions">
              <button class="btn" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="addNote()">Save Note</button>
            </div>
          `);
        }

        function addNote() {
            const title = document.getElementById('noteTitle').value.trim() || 'Untitled';
            const subjectId = document.getElementById('noteSubject').value || null;
            const content = document.getElementById('noteContent').value || '';
            const tags = document.getElementById('noteTags').value.split(',').map(t => t.trim()).filter(Boolean);
            data.notes.push({
                id: genId(),
                title,
                content,
                subjectId,
                topicId: null,
                conceptId: null,
                tags,
                pinned: false,
                archived: false,
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
            });
            saveData();
            closeModal();
            toast('✅ Note saved', 'success');
            renderPage('notes');
        }

        function editNote(id) {
            const n = data.notes.find(n => n.id === id);
            if (!n) return;
            const subjects = data.subjects.filter(s => !s.archived);
            openModal(`
            <div class="modal-title">✏️ Edit Note</div>
            <div class="form-group">
              <label>Title</label>
              <input id="editNoteTitle" value="${n.title || ''}" />
            </div>
            <div class="form-group">
              <label>Subject</label>
              <select id="editNoteSubject">
                <option value="">General</option>
                ${subjects.map(s => `<option value="${s.id}" ${s.id===n.subjectId?'selected':''}>${s.name}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Content</label>
              <textarea id="editNoteContent" rows="5">${n.content || ''}</textarea>
            </div>
            <div class="form-group">
              <label>Tags (comma separated)</label>
              <input id="editNoteTags" value="${(n.tags||[]).join(', ')}" />
            </div>
            <div class="form-actions">
              <button class="btn" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="saveEditNote('${id}')">Save</button>
            </div>
          `);
        }

        function saveEditNote(id) {
            const n = data.notes.find(n => n.id === id);
            if (!n) return;
            n.title = document.getElementById('editNoteTitle').value.trim() || 'Untitled';
            n.subjectId = document.getElementById('editNoteSubject').value || null;
            n.content = document.getElementById('editNoteContent').value || '';
            n.tags = document.getElementById('editNoteTags').value.split(',').map(t => t.trim()).filter(Boolean);
            n.updatedAt = new Date().toISOString();
            saveData();
            closeModal();
            toast('✅ Note updated', 'success');
            renderPage('notes');
        }

        function archiveNote(id) {
            const n = data.notes.find(n => n.id === id);
            if (n) { n.archived = true;
                saveData();
                toast('📦 Note archived', 'info');
                renderPage('notes'); }
        }

        function unarchiveNote(id) {
            const n = data.notes.find(n => n.id === id);
            if (n) { n.archived = false;
                saveData();
                toast('📂 Note restored', 'info');
                renderPage('notes'); }
        }

        function deleteNote(id) {
            if (!confirm('Delete this note?')) return;
            data.notes = data.notes.filter(n => n.id !== id);
            saveData();
            toast('🗑️ Note deleted', 'info');
            renderPage('notes');
        }

        //  TASKS
        // ================================================================

        function renderTasks() {
            const subjects = data.subjects.filter(s => !s.archived);
            let html = `
            <div class="flex-between">
              <div><div class="page-title">✅ Tasks</div>

          `;

            const tasks = data.tasks.sort((a, b) => {
                const pri = { high: 0, medium: 1, low: 2 };
                return (pri[a.priority] || 1) - (pri[b.priority] || 1);
            });

            if (tasks.length === 0) {
                html += `
              <div class="empty-state">
                <div class="icon">✅</div>
                <div class="title">No tasks yet</div>
                <div class="desc">Add your first task to get started.</div>
              </div>
            `;
            } else {
                html += `
              <div class="table-wrap mt-2">
                <table>
                  <thead><tr>
                    <th>Task</th>
                    <th>Subject</th>
                    <th>Priority</th>
                    <th>Status</th>
                    <th>Deadline</th>
                    <th>Actions</th>
                  </tr></thead>
                  <tbody>
                    ${tasks.map(t => `
                      <tr>
                        <td><span style="font-weight:500;">${t.title}</span></td>
                        <td>${t.subjectId ? getSubjectName(t.subjectId) : '—'}</td>

        // ================================================================
        //  FOCUS TIMER
        // ================================================================

        let timerState = {
            running: false,
            mode: 'pomodoro',
            timeLeft: 25 * 60,
            total: 25 * 60,
            interval: null,
        };

        function renderTimer() {
            return `
            <div class="page-title">⏱️ Focus Timer</div>
            <div class="page-subtitle">Pomodoro timer for focused study sessions.</div>
            <div class="card" style="max-width:480px;margin:0 auto;">
              <div class="timer-display" id="timerDisplay">25:00</div>
              <div style="display:flex;gap:0.3rem;justify-content:center;flex-wrap:wrap;margin-bottom:0.8rem;">
                <button class="btn btn-sm ${timerState.mode==='pomodoro'?'btn-primary':'btn-outline'}" onclick="setTimerMode('pomodoro')">Pomodoro</button>
                <button class="btn btn-sm ${timerState.mode==='short'?'btn-primary':'btn-outline'}" onclick="setTimerMode('short')">Short Break</button>
                <button class="btn btn-sm ${timerState.mode==='long'?'btn-primary':'btn-outline'}" onclick="setTimerMode('long')">Long Break</button>
              </div>
              <div class="timer-controls">
                <button class="btn ${timerState.running ? 'btn-gold' : 'btn-primary'}" onclick="toggleTimer()">${timerState.running ? '⏸️ Pause' : '▶️ Start'}</button>
                <button class="btn btn-outline" onclick="resetTimer()">↺ Reset</button>
              </div>
              <div class="mt-2 text-sm text-muted text-center">
                ${timerState.running ? 'Focus...' : 'Ready to focus'}
              </div>
            </div>
            <div class="mt-3">
              <div class="card">
                <div style="font-weight:600;margin-bottom:0.3rem;">📊 Today's Study Time</div>
                <div style="font-size:1.2rem;">${Math.floor((data.studySessions || []).reduce((a,s) => a + (s.duration || 0), 0) / 60)}h ${(data.studySessions || []).reduce((a,s) => a + (s.duration || 0), 0) % 60}m</div>
                <div class="text-muted text-sm">${(data.studySessions || []).length} sessions recorded</div>
              </div>
            </div>
          `;
        }

        function setTimerMode(mode) {
            if (timerState.running) toggleTimer();
            const durations = { pomodoro: 25 * 60, short: 5 * 60, long: 15 * 60 };
            timerState.mode = mode;
            timerState.timeLeft = durations[mode] || 25 * 60;
            timerState.total = timerState.timeLeft;
            updateTimerDisplay();
            renderPage('timer');
        }

        function toggleTimer() {
            if (timerState.running) {
                clearInterval(timerState.interval);
                timerState.running = false;
                renderPage('timer');
                return;
            }
            timerState.running = true;
            timerState.interval = setInterval(() => {
                timerState.timeLeft--;
                updateTimerDisplay();
                if (timerState.timeLeft <= 0) {
                    clearInterval(timerState.interval);
                    timerState.running = false;
                    toast('⏰ Timer finished!', 'success');
                    // record session
                    const duration = timerState.total - timerState.timeLeft;
                    if (!data.studySessions) data.studySessions = [];
                    data.studySessions.push({
                        id: genId(),
                        subject: null,
                        topic: null,
                        date: new Date().toISOString(),
                        duration: Math.round(duration / 60),
                        pomodoros: 1,
                    });
                    saveData();
                    renderPage('timer');
                }
            }, 1000);
            renderPage('timer');
        }

        function resetTimer() {
            clearInterval(timerState.interval);
            timerState.running = false;
            const durations = { pomodoro: 25 * 60, short: 5 * 60, long: 15 * 60 };
            timerState.timeLeft = durations[timerState.mode] || 25 * 60;
            timerState.total = timerState.timeLeft;
            updateTimerDisplay();
            renderPage('timer');
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timerDisplay');
            if (el) {
                const mins = Math.floor(timerState.timeLeft / 60);
                const secs = timerState.timeLeft % 60;
                el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }
        }

        function initTimer() {
            updateTimerDisplay();
        }

        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // events for this month
            const events = data.events.filter(e => {
                const d = new Date(e.date);
                return d.getMonth() === month && d.getFullYear() === year;
            });

            const eventDates = new Set(events.map(e => new Date(e.date).getDate()));

            let daysHtml = '';
            for (let i = 0; i < firstDay; i++) {
                daysHtml += `<div class="cal-day other"></div>`;
            }
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = d === now.getDate();
                const hasEvent = eventDates.has(d);
                daysHtml += `
              <div class="cal-day ${isToday ? 'today' : ''} ${hasEvent ? 'has-event' : ''}">
                ${d}
              </div>
            `;
            }

            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September',
                'October', 'November', 'December'
            ];

            return `
            <div class="page-title">📅 Calendar</div>
            <div class="page-subtitle">Exams, study sessions, deadlines, and events.</div>
            <div class="card" style="max-width:600px;">
              <div style="font-weight:600;font-size:1.1rem;text-align:center;margin-bottom:0.5rem;">
                ${monthNames[month]} ${year}
              </div>
              <div class="cal-grid">
                <div class="cal-header">Sun</div>
                <div class="cal-header">Mon</div>
                <div class="cal-header">Tue</div>
                <div class="cal-header">Wed</div>
                <div class="cal-header">Thu</div>
                <div class="cal-header">Fri</div>
                <div class="cal-header">Sat</div>
                ${daysHtml}
              </div>
            </div>
            <div class="mt-2">
              <div class="flex-between">
                <span style="font-weight:600;">📌 Upcoming Events</span>
                <button class="btn btn-sm btn-primary" onclick="showAddEvent()">+ Add Event</button>
              </div>
              ${data.events.filter(e => new Date(e.date) >= now).sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0,6).map(e => `
                <div class="mission-item" style="margin-top:0.3rem;border-left-color:${e.type === 'exam' ? '#e74c4c' : e.type === 'deadline' ? '#f1c40f' : '#5b3b8c'};">
                  <span class="dot ${e.type === 'exam' ? 'red' : e.type === 'deadline' ? 'yellow' : 'green'}"></span>
                  <div class="info">
                    <div class="title">${e.title}</div>
                    <div class="sub">${new Date(e.date).toLocaleDateString()} · ${e.type || 'event'}</div>
                  </div>
                  <button class="btn btn-sm btn-ghost" onclick="deleteEvent('${e.id}')">🗑️</button>
                </div>
              `).join('')}
              ${data.events.filter(e => new Date(e.date) >= now).length === 0 ? '<div class="text-muted text-sm mt-1">No upcoming events.</div>' : ''}
            </div>
          `;
        }

        function showAddEssay() {

                <option value="Supplemental">Supplemental Essay</option>

                <option value="Why University">Why University</option>

                <option value="Other">Other</option>
              </select>

            <div class="form-group">
              <label>Prompt</label>
              <textarea id="essayPrompt" rows="2" placeholder="The essay prompt or question..."></textarea>
            </div>

              <label>Word Limit</label>
              <input id="essayWordLimit" type="number" placeholder="e.g. 650" />

              <input id="essayDeadline" type="date" />
