<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O‑LEVEL COMMAND CENTER — ULTIMATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <style>
        /* ===== ROYAL THEME — ULTIMATE ===== */
        :root {
            --royal-purple: #4a2c6e;
            --royal-purple-light: #7a4ba8;
            --royal-purple-gradient: linear-gradient(135deg, #4a2c6e, #8a5fc4);
            --royal-gold: #c9a84c;
            --royal-gold-light: #f3edd6;
            --royal-gold-gradient: linear-gradient(135deg, #b89430, #e8c95a);
            --bg: #f8f6fc;
            --card: #ffffff;
            --text: #1d1b2a;
            --text-secondary: #4f4a6b;
            --text-muted: #8f8aa8;
            --border: #e4dfee;
            --shadow: 0 4px 24px rgba(74, 44, 110, 0.10);
            --shadow-hover: 0 8px 36px rgba(74, 44, 110, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.2, 0, 0, 1);
            --sidebar-width: 260px;
            --font: 'Inter', -apple-system, system-ui, sans-serif;
            --font-serif: 'Playfair Display', serif;
        }
        .dark {
            --bg: #181625;
            --card: #24203a;
            --text: #ece8f5;
            --text-secondary: #b8b0d0;
            --text-muted: #8f8aa8;
            --border: #3d3560;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 8px 36px rgba(0, 0, 0, 0.5);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        a {
            color: var(--royal-purple);
            text-decoration: none;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        input,
        textarea,
        select {
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.9rem;
            width: 100%;
            transition: var(--transition);
        }
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--royal-purple);
            box-shadow: 0 0 0 3px rgba(74, 44, 110, 0.12);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: #d4c8e0;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--royal-purple-light);
        }
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            padding: 1.6rem 0.8rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: background 0.3s, border-color 0.3s;
        }
        .sidebar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--royal-purple);
            padding: 0 0.8rem 1.8rem 0.8rem;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-serif);
            font-style: italic;
        }
        .sidebar-brand span {
            background: var(--royal-purple-gradient);
            color: #fff;
            font-size: 0.6rem;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            letter-spacing: 0.3px;
            font-style: normal;
            font-family: var(--font);
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav .nav-item:hover {
            background: var(--royal-gold-light);
            color: var(--royal-purple);
        }
        .sidebar-nav .nav-item.active {
            background: var(--royal-purple-gradient);
            color: #fff;
            box-shadow: 0 2px 12px rgba(74, 44, 110, 0.3);
        }
        .sidebar-nav .nav-item .icon {
            font-size: 1.15rem;
            width: 1.6rem;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav .nav-item .label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0.8rem;
            display: flex;
            justify-content: space-between;
            transition: border-color 0.3s;
        }
        .main {
            flex: 1;
            min-width: 0;
            padding: 1.8rem 2.4rem 3rem 2.4rem;
            max-width: calc(100vw - var(--sidebar-width));
            overflow-y: auto;
            position: relative;
            transition: background 0.3s;
        }
        .page {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page-title {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--royal-purple);
        }
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--royal-gold-light);
            color: #8a7020;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.2rem;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.2rem;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1.2rem 1.4rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }
        .card-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .card-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mt-1 {
            margin-top: 0.5rem;
        }
        .mt-2 {
            margin-top: 1rem;
        }
        .mt-3 {
            margin-top: 1.5rem;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-sm {
            font-size: 0.85rem;
        }
        .text-xs {
            font-size: 0.75rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            border: 1.5px solid transparent;
            background: var(--bg);
            color: var(--text-secondary);
        }
        .btn:hover {
            background: var(--border);
        }
        .btn-primary {
            background: var(--royal-purple-gradient);
            color: #fff;
            border-color: transparent;
        }
        .btn-primary:hover {
            box-shadow: 0 4px 16px rgba(74, 44, 110, 0.35);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border-color: var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--royal-purple);
            color: var(--royal-purple);
        }
        .btn-gold {
            background: var(--royal-gold-gradient);
            color: #fff;
            border-color: transparent;
        }
        .btn-sm {
            padding: 0.25rem 0.8rem;
            font-size: 0.75rem;
        }
        .btn-danger {
            background: #e74c4c;
            color: #fff;
            border-color: #e74c4c;
        }
        .btn-danger:hover {
            background: #c0392b;
            border-color: #c0392b;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-ghost:hover {
            background: var(--bg);
        }
        .greeting {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.1rem;
        }
        .greeting-sub {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.4rem;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.8rem;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 0.9rem 1.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .stat-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-card .value {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .mission-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm);
            background: var(--bg);
            border-left: 4px solid var(--royal-purple);
            margin-bottom: 0.5rem;
            transition: var(--transition);
        }
        .mission-item:hover {
            background: var(--royal-gold-light);
        }
        .mission-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .mission-item .dot.red {
            background: #e74c4c;
        }
        .mission-item .dot.yellow {
            background: #f1c40f;
        }
        .mission-item .dot.green {
            background: #27ae60;
        }
        .mission-item .info {
            flex: 1;
        }
        .mission-item .info .title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .mission-item .info .sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .mission-item .actions {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .mission-item .actions .tag {
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 500;
            background: var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .mission-item .actions .tag:hover {
            background: var(--royal-purple);
            color: #fff;
        }
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .subject-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1rem 1.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .subject-card:hover {
            border-color: var(--royal-purple);
            box-shadow: var(--shadow-hover);
        }
        .subject-card .color-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }
        .subject-card .name {
            font-weight: 600;
            font-size: 1rem;
            margin-top: 4px;
        }
        .subject-card .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }
        .subject-card .progress {
            margin-top: 0.5rem;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .subject-card .progress .bar {
            height: 100%;
            background: var(--royal-purple-gradient);
            border-radius: 4px;
            transition: width 0.6s ease;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.8rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--royal-purple);
        }
        .modal .modal-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }
        .modal .form-group {
            margin-bottom: 1rem;
        }
        .modal .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
            color: var(--text-secondary);
        }
        .modal .form-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 1.2rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            text-align: left;
            padding: 0.6rem 1rem;
            background: var(--bg);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
        }
        .empty-state .icon {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }
        .empty-state .title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }
        .empty-state .desc {
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }
        .pill {
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .pill.purple {
            background: #ede6f6;
            color: var(--royal-purple);
        }
        .pill.green {
            background: #dff0e0;
            color: #1f6e2f;
        }
        .pill.red {
            background: #fce8e8;
            color: #b13a3a;
        }
        .pill.gold {
            background: var(--royal-gold-light);
            color: #8a7020;
        }
        .pill.blue {
            background: #dce8f5;
            color: #1f4f8a;
        }
        .timer-display {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            text-align: center;
            padding: 0.5rem 0;
            color: var(--royal-purple);
        }
        .timer-controls {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tree-item {
            padding: 0.3rem 0 0.3rem 1.2rem;
            border-left: 2px solid var(--border);
            margin-left: 0.8rem;
        }
        .tree-item .node {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .tree-item .node:hover {
            background: var(--bg);
        }
        .tree-item .node .mastery {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tree-item .node .mastery.not_started {
            background: #e74c4c;
        }
        .tree-item .node .mastery.learning {
            background: #e67e22;
        }
        .tree-item .node .mastery.understanding {
            background: #f1c40f;
        }
        .tree-item .node .mastery.exam_ready {
            background: #3498db;
        }
        .tree-item .node .mastery.mastered {
            background: #27ae60;
        }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.8rem;
        }
        .cal-grid .cal-header {
            font-weight: 600;
            color: var(--text-muted);
            padding: 0.2rem 0;
            font-size: 0.7rem;
        }
        .cal-grid .cal-day {
            padding: 0.3rem 0;
            border-radius: 4px;
            background: var(--bg);
            cursor: default;
        }
        .cal-grid .cal-day.has-event {
            background: var(--royal-gold-light);
            color: #8a7020;
            font-weight: 600;
        }
        .cal-grid .cal-day.other {
            color: var(--text-muted);
            opacity: 0.4;
        }
        .cal-grid .cal-day.today {
            background: var(--royal-purple);
            color: #fff;
            font-weight: 700;
        }
        .cal-grid .cal-day.attended {
            background: #27ae60;
            color: #fff;
        }
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--royal-purple-gradient);
            color: #fff;
            font-size: 2rem;
            box-shadow: 0 6px 24px rgba(74, 44, 110, 0.4);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .fab:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 32px rgba(74, 44, 110, 0.5);
        }
        .file-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .file-card .file-icon {
            font-size: 1.8rem;
            color: var(--royal-purple);
        }
        .file-card .file-info {
            flex: 1;
        }
        .file-card .file-info .name {
            font-weight: 600;
        }
        .file-card .file-info .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .file-card .file-actions {
            display: flex;
            gap: 0.4rem;
        }
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1.2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            border-left: 4px solid var(--royal-purple);
            animation: slideIn 0.25s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .toast.success {
            border-left-color: #27ae60;
        }
        .toast.error {
            border-left-color: #e74c4c;
        }
        .toast.warning {

        function loadData() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const def = getDefaultData();
                    for (const k in def) {
                        if (!(k in parsed)) parsed[k] = def[k];
                    }
                    ['subjects', 'notes', 'tasks', 'mistakes', 'flashcards', 'pastPapers', 'videos', 'documents',
                        'projects', 'skills', 'recommendations', 'scholarships', 'evidence', 'activities', 'goals',
                        'stories', 'universities', 'essays', 'events', 'studySessions', 'timetable', 'habits',
                        'moodLog', 'bookmarks', 'dailyQuotes'
                    ].forEach(arr => {
                        if (!Array.isArray(parsed[arr])) parsed[arr] = [];
                    });
                    if (!parsed.attendance) parsed.attendance = {};
                    if (!parsed.gradeCalculator) parsed.gradeCalculator = { courses: [] };
                    if (!parsed.settings) parsed.settings = { darkMode: false };
                    if (!parsed.profile) parsed.profile = { interests: '', passions: '', values: '', motivations: '',

                        changedMind: '', experiences: '' };
                    return parsed;
                }
            } catch (e) { console.warn('Load error, using defaults', e); }
            return getDefaultData();

        function saveData() {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(data));
                return true;
            } catch (e) {

                    toast('⚠️ Storage quota exceeded! Please delete some data in Settings.', 'error');
                } else {
                    toast('Error saving: ' + e.message, 'error');
                }
                return false;

        function getSubjectName(id) { const s = getSubject(id); return s ? s.name : 'Unknown'; }

        // ================================================================
        //  INDEXEDDB — Unlimited File Storage
        // ================================================================

        const DB_NAME = 'olevel_files_db';
        const STORE_NAME = 'files';

        function openFileDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveFile(id, fileData, metadata) {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ id, fileData, metadata, uploadedAt: new Date().toISOString() });
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getFile(id) {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteFile(id) {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getAllFiles() {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.getAll();
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        // ================================================================
        //  ATTENDANCE — Daily Check-in
        // ================================================================

        function renderAttendance() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const todayChecked = data.attendance[dateStr] || false;

            // Get last 30 days
            const days = [];
            for (let i = 29; i >= 0; i--) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const ds = d.toISOString().split('T')[0];
                days.push({ date: ds, day: d.getDate(), month: d.toLocaleString('en', { month: 'short' }),
                    present: data.attendance[ds] || false });
            }

            const totalPresent = Object.values(data.attendance).filter(v => v === true).length;
            const totalDays = Object.keys(data.attendance).length;
            const pct = totalDays > 0 ? Math.round((totalPresent / totalDays) * 100) : 0;

            return `
            <div class="flex-between">
              <div><div class="page-title">📋 Attendance</div><div class="page-subtitle">Check in daily to track your consistency.</div></div>
              <button class="btn ${todayChecked?'btn-gold':'btn-primary'}" onclick="toggleAttendance()">${todayChecked?'✅ Checked In':'☑️ Check In Today'}</button>
            </div>

            <div class="grid-3 mt-2">
              <div class="card"><div class="card-title">Total Check-ins</div><div class="card-value">${totalPresent}</div><div class="card-label">Days present</div></div>
              <div class="card"><div class="card-title">Attendance Rate</div><div class="card-value">${pct}%</div><div class="card-label">${totalDays} total days</div></div>
              <div class="card"><div class="card-title">Current Streak</div><div class="card-value">🔥 ${calculateStreak()}</div><div class="card-label">Consecutive days</div></div>
            </div>

            <div class="card mt-2">
              <div style="font-weight:600;margin-bottom:0.5rem;">Last 30 Days</div>
              <div class="attendance-heatmap">
                ${days.map(d => `<div class="day ${d.present?'present':'absent'}" title="${d.date}">${d.day}</div>`).join('')}
              </div>
              <div class="text-xs text-muted mt-1">🟢 Present · 🔴 Absent</div>
            </div>

            <div class="card mt-2">
              <div style="font-weight:600;margin-bottom:0.5rem;">📊 Monthly Summary</div>
              <div class="text-sm">${now.toLocaleString('en', { month: 'long', year: 'numeric' })}</div>
              <div class="text-sm text-muted">${totalPresent} check-ins this month</div>
            </div>
          `;
        }

        function toggleAttendance() {
            const dateStr = new Date().toISOString().split('T')[0];
            data.attendance[dateStr] = !data.attendance[dateStr];
            if (saveData()) {
                toast(data.attendance[dateStr] ? '✅ Checked in! Keep it up!' : '⏳ Check-in removed.', 'info');
                renderPage('attendance');
            }
        }

        function calculateStreak() {
            const now = new Date();
            let streak = 0;
            for (let i = 0; i < 365; i++) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const ds = d.toISOString().split('T')[0];
                if (data.attendance[ds]) {
                    streak++;
                } else if (i > 0) {
                    break;
                }
            }
            return streak;
        }

                    </div>
                    <button class="btn btn-sm btn-ghost" onclick="editTimetableSlot('${t.id}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteTimetableSlot('${t.id}')">🗑️</button>

                        ${row.slots.map(s => `<td>${s ? `<div style="font-size:0.8rem;font-weight:500;">${s.subject}</div><div style="font-size:0.65rem;color:var(--text-muted);">${s.method||''}</div>` : '—'}</td>`).join('')}

          `;
            return html;

        function getTimetableRows() {
            const times = [...new Set(data.timetable.map(t => t.time))].sort();
            const days = [0, 1, 2, 3, 4, 5, 6];
            return times.map(time => {
                const slots = days.map(day => {
                    const slot = data.timetable.find(t => t.day === day && t.time === time);
                    return slot || null;
                });
                return { time, slots };
            });
        }

        function toggleTimetableSlot(id) {
            const slot = data.timetable.find(t => t.id === id);
            if (!slot) return;
            const dateStr = new Date().toISOString().split('T')[0];
            if (!slot.checked) slot.checked = {};
            slot.checked[dateStr] = !slot.checked[dateStr];
            if (saveData()) {
                renderPage('timetable');
                toast(slot.checked[dateStr] ? '✅ Slot done!' : '⏳ Slot unchecked', 'info');
            }
        }

        function checkAllTimetable() {
            const dateStr = new Date().toISOString().split('T')[0];
            data.timetable.forEach(t => {
                if (t.day === new Date().getDay()) {
                    if (!t.checked) t.checked = {};
                    t.checked[dateStr] = true;
                }
            });
            if (saveData()) { toast('✅ All slots checked!', 'success');
                renderPage('timetable'); }
        }

        function uncheckAllTimetable() {
            const dateStr = new Date().toISOString().split('T')[0];
            data.timetable.forEach(t => {
                if (t.day === new Date().getDay() && t.checked) {
                    t.checked[dateStr] = false;
                }
            });
            if (saveData()) { toast('⬜ All slots unchecked', 'info');
                renderPage('timetable'); }
        }

        function showAddTimetableSlot() {
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            openModal(`
            <div class="modal-title">📅 Add Timetable Slot</div>
            <div class="form-group"><label>Day</label><select id="ttDay">${days.map((d,i)=>`<option value="${i}" ${i===new Date().getDay()?'selected':''}>${d}</option>`).join('')}</select></div>
            <div class="form-group"><label>Time</label><input id="ttTime" placeholder="e.g. 09:00-10:00" /></div>
            <div class="form-group"><label>Subject</label><input id="ttSubject" placeholder="e.g. Mathematics" /></div>
            <div class="form-group"><label>Study Method</label><input id="ttMethod" placeholder="e.g. Past Papers, Notes, Revision" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addTimetableSlot()">Add Slot</button></div>
          `);

        function addTimetableSlot() {
            const day = parseInt(document.getElementById('ttDay').value);
            const time = document.getElementById('ttTime').value.trim();
            const subject = document.getElementById('ttSubject').value.trim();
            const method = document.getElementById('ttMethod').value.trim();
            if (!time || !subject) { toast('Time and subject required.', 'error'); return; }
            data.timetable.push({ id: genId(), day, time, subject, method, checked: {} });
            if (saveData()) { closeModal();
                toast('✅ Slot added', 'success');
                renderPage('timetable'); }

        function editTimetableSlot(id) {
            const slot = data.timetable.find(t => t.id === id);
            if (!slot) return;
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            openModal(`
            <div class="modal-title">✏️ Edit Slot</div>
            <div class="form-group"><label>Day</label><select id="editTtDay">${days.map((d,i)=>`<option value="${i}" ${i===slot.day?'selected':''}>${d}</option>`).join('')}</select></div>
            <div class="form-group"><label>Time</label><input id="editTtTime" value="${slot.time}" /></div>
            <div class="form-group"><label>Subject</label><input id="editTtSubject" value="${slot.subject}" /></div>

          `);

            const slot = data.timetable.find(t => t.id === id);
            if (!slot) return;
            slot.day = parseInt(document.getElementById('editTtDay').value);
            slot.time = document.getElementById('editTtTime').value.trim();
            slot.subject = document.getElementById('editTtSubject').value.trim();
            slot.method = document.getElementById('editTtMethod').value.trim();
            if (!slot.time || !slot.subject) { toast('Time and subject required.', 'error'); return; }

                toast('✅ Slot updated', 'success');
                renderPage('timetable'); }

        function deleteTimetableSlot(id) {
            if (!confirm('Delete this slot?')) return;
            data.timetable = data.timetable.filter(t => t.id !== id);
            if (saveData()) { toast('🗑️ Slot deleted', 'info');
                renderPage('timetable'); }
        }

        function showAddHabit() {
            openModal(`
            <div class="modal-title">🔄 New Habit</div>
            <div class="form-group"><label>Habit Name</label><input id="habitName" placeholder="e.g. Read 20 pages" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addHabit()">Add Habit</button></div>
          `);
        }

        function addHabit() {
            const name = document.getElementById('habitName').value.trim();
            if (!name) { toast('Habit name required.', 'error'); return; }
            data.habits.push({ id: genId(), name, streak: 0, lastChecked: null });
            if (saveData()) { closeModal();
                toast('✅ Habit added', 'success');
                renderPage('habits'); }
        }

        function toggleHabit(id) {
            const h = data.habits.find(h => h.id === id);
            if (!h) return;
            const today = new Date().toISOString().split('T')[0];
            if (h.lastChecked === today) {
                h.lastChecked = null;
                h.streak = 0;
            } else {
                const yesterday = new Date();
                yesterday.setDate(yesterday.getDate() - 1);
                const yStr = yesterday.toISOString().split('T')[0];
                if (h.lastChecked === yStr || !h.lastChecked) {
                    h.streak = (h.streak || 0) + 1;
                } else {
                    h.streak = 1;
                }
                h.lastChecked = today;
            }
            if (saveData()) { toast(h.lastChecked === today ? '✅ Habit done!' : '⏳ Habit unchecked', 'info');
                renderPage('habits'); }
        }

        function deleteHabit(id) {
            if (!confirm('Delete this habit?')) return;
            data.habits = data.habits.filter(h => h.id !== id);
            if (saveData()) { toast('🗑️ Habit deleted', 'info');
                renderPage('habits'); }
        }

        // ================================================================
        //  GRADE CALCULATOR
        // ================================================================

        function renderGradeCalc() {
            let html =
                `<div class="flex-between"><div><div class="page-title">📊 Grade Calculator</div><div class="page-subtitle">Calculate your weighted average.</div></div><button class="btn btn-primary" onclick="showAddCourse()">+ Add Course</button></div>`;
            const courses = data.gradeCalculator.courses || [];
            if (!courses.length) {
                html +=
                    `<div class="empty-state"><div class="icon">📊</div><div class="title">No courses</div><div class="desc">Add your courses to calculate your GPA.</div></div>`;
            } else {
                let totalWeight = 0,
                    totalScore = 0;
                courses.forEach(c => { totalWeight += c.weight;
                    totalScore += c.score * c.weight; });
                const avg = totalWeight > 0 ? (totalScore / totalWeight).toFixed(1) : 0;
                html += `<div class="card mt-2"><div style="font-size:1.5rem;font-weight:700;">${avg}%</div><div class="text-muted">Weighted Average</div></div>`;
                html += `<div class="table-wrap mt-2"><table><thead><tr><th>Course</th><th>Score</th><th>Weight</th><th>Actions</th></tr></thead><tbody>`;
                courses.forEach(c => {
                    html +=
                        `<tr><td>${c.name}</td><td>${c.score}%</td><td>${c.weight}</td><td><button class="btn btn-sm btn-danger" onclick="deleteCourse('${c.id}')">🗑️</button></td></tr>`;
                });
                html += `</tbody></table></div>`;
            }
            return html;
        }

        function showAddCourse() {
            openModal(`
            <div class="modal-title">📊 Add Course</div>
            <div class="form-group"><label>Course Name</label><input id="gcName" /></div>
            <div class="form-group"><label>Score (%)</label><input id="gcScore" type="number" min="0" max="100" /></div>
            <div class="form-group"><label>Weight</label><input id="gcWeight" type="number" min="0" step="0.5" placeholder="e.g. 1.0" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addCourse()">Add Course</button></div>
          `);

        function addCourse() {

            const score = parseFloat(document.getElementById('gcScore').value);
            const weight = parseFloat(document.getElementById('gcWeight').value);
            if (!name || isNaN(score) || isNaN(weight)) { toast('All fields required.', 'error'); return; }
            if (!data.gradeCalculator.courses) data.gradeCalculator.courses = [];
            data.gradeCalculator.courses.push({ id: genId(), name, score, weight });

                toast('✅ Course added', 'success');
                renderPage('gradecalc'); }

        function deleteCourse(id) {
            if (!confirm('Delete this course?')) return;
            data.gradeCalculator.courses = data.gradeCalculator.courses.filter(c => c.id !== id);
            if (saveData()) { toast('🗑️ Course deleted', 'info');
                renderPage('gradecalc'); }

        // ================================================================
        //  GLOBAL SEARCH & DARK MODE
        // ================================================================

        function showGlobalSearch() {
            openModal(`
            <div class="modal-title">🔍 Global Search</div>
            <div class="modal-sub">Search across all your data.</div>
            <div class="form-group"><input id="globalSearchInput" placeholder="Type to search..." oninput="performGlobalSearch()" autofocus /></div>
            <div id="globalSearchResults" class="search-results"></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Close</button></div>
          `);
            document.getElementById('globalSearchInput').focus();
        }

        function performGlobalSearch() {
            const query = document.getElementById('globalSearchInput').value.toLowerCase().trim();
            const results = document.getElementById('globalSearchResults');
            if (!query) { results.innerHTML = '<div class="text-muted text-sm">Start typing...</div>'; return; }
            const items = [];
            data.notes.forEach(n => { if (n.title.toLowerCase().includes(query) || (n.content || '').toLowerCase().includes(
                    query)) items.push({ type: 'Note', title: n.title || 'Untitled', id: n.id, page: 'notes' }); });
            data.tasks.forEach(t => { if (t.title.toLowerCase().includes(query)) items.push({ type: 'Task', title: t
                        .title, id: t.id, page: 'tasks' }); });
            data.mistakes.forEach(m => { if ((m.question || '').toLowerCase().includes(query)) items.push({ type: 'Mistake',
                        title: m.question || 'Mistake', id: m.id, page: 'mistakes' }); });
            data.flashcards.forEach(f => { if ((f.front || '').toLowerCase().includes(query) || (f.back || '')
                    .toLowerCase().includes(query)) items.push({ type: 'Flashcard', title: f.front || 'Card', id: f
                        .id, page: 'flashcards' }); });
            data.pastPapers.forEach(p => { if ((p.title || '').toLowerCase().includes(query) || (p.fileName || '')
                    .toLowerCase().includes(query)) items.push({ type: 'Past Paper', title: p.title || p.fileName ||
                        'Paper', id: p.id, page: 'pastpapers' }); });
            data.videos.forEach(v => { if ((v.title || '').toLowerCase().includes(query)) items.push({ type: 'Video',
                        title: v.title || 'Video', id: v.id, page: 'videos' }); });
            data.documents.forEach(d => { if ((d.title || '').toLowerCase().includes(query) || (d.fileName || '')
                    .toLowerCase().includes(query)) items.push({ type: 'Document', title: d.title || d.fileName ||
                        'Doc', id: d.id, page: 'documents' }); });
            data.activities.forEach(a => { if ((a.name || '').toLowerCase().includes(query)) items.push({ type: 'Activity',
                        title: a.name, id: a.id, page: 'activities' }); });
            data.projects.forEach(p => { if ((p.name || '').toLowerCase().includes(query)) items.push({ type: 'Project',
                        title: p.name, id: p.id, page: 'projects' }); });
            data.universities.forEach(u => { if ((u.name || '').toLowerCase().includes(query)) items.push({ type: 'University',
                        title: u.name, id: u.id, page: 'universities' }); });
            data.essays.forEach(e => { if ((e.title || '').toLowerCase().includes(query)) items.push({ type: 'Essay',
                        title: e.title, id: e.id, page: 'essays' }); });
            data.bookmarks.forEach(b => { if ((b.title || '').toLowerCase().includes(query) || (b.tags || '')
                    .toLowerCase().includes(query)) items.push({ type: 'Bookmark', title: b.title, id: b.id,
                        page: 'bookmarks' }); });
            if (items.length === 0) { results.innerHTML =
                '<div class="text-muted text-sm">No results found.</div>'; return; }
            results.innerHTML = items.map(item =>
                `<div class="search-result-item" onclick="closeModal();navigate('${item.page}')">
              <div class="result-title">${item.type}: ${item.title}</div>
              <div class="result-meta">${item.page}</div>
            </div>`
            ).join('');
        }

        function toggleDarkMode() {
            data.settings.darkMode = !data.settings.darkMode;
            saveData();
            applyDarkMode();
            toast(data.settings.darkMode ? '🌙 Dark mode on' : '☀️ Light mode on', 'info');
        }

        function applyDarkMode() {
            if (data.settings.darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }

        // ================================================================
        //  SETTINGS — with Storage Manager
        // ================================================================

        function renderSettings() {
            const usage = getStorageUsage();
            const quota = getQuota();
            const pct = Math.min(100, (usage / quota) * 100);
            const pctRounded = Math.round(pct);
            const colorClass = pct > 90 ? 'danger' : pct > 70 ? 'warning' : '';

            return `
            <div class="page-title">⚙️ Settings</div>
            <div class="page-subtitle">Manage profile, data, and preferences.</div>

            <div class="card"><div style="font-weight:600;margin-bottom:0.5rem;">👤 Student Profile</div>
              <div class="form-group"><label>Name</label><input id="settingsName" value="${data.student.name||'Maira'}" /></div>
              <div class="form-group"><label>Grade</label><input id="settingsGrade" value="${data.student.grade||'Grade 9'}" /></div>
              <div class="form-group"><label>Academic Year</label><input id="settingsYear" value="${data.student.currentYear||'2026-2027'}" /></div>
              <div class="form-group"><label>Exam Year</label><input id="settingsExamYear" value="${data.student.examYear||'CIE 2027'}" /></div>
              <button class="btn btn-primary" onclick="saveSettings()">Save Profile</button>
            </div>

            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">🎨 Appearance</div>
              <div class="flex-between"><span>Dark Mode</span>
                <button class="btn ${data.settings.darkMode?'btn-gold':'btn-primary'}" onclick="toggleDarkMode()">${data.settings.darkMode?'☀️ Light':'🌙 Dark'}</button>
              </div>
            </div>

            <div class="card mt-2">
              <div style="font-weight:600;margin-bottom:0.5rem;">💾 Storage Manager</div>
              <div class="text-sm text-muted">Total usage: ${formatSize(usage)} of ~${formatSize(quota)} (${pctRounded}%)</div>
              <div class="storage-bar"><div class="fill ${colorClass}" style="width:${pct}%;"></div></div>
              ${pct > 80 ? `<div class="storage-warning">⚠️ Storage is ${pctRounded}% full. Delete old files to free up space.</div>` : ''}
              <div style="margin-top:0.5rem;">
                <button class="btn btn-sm btn-danger" onclick="if(confirm('Delete ALL file data?')){clearAllFiles();}">🗑️ Clear All Files</button>
                <button class="btn btn-sm btn-outline" onclick="exportData()">📤 Export Backup</button>
                <button class="btn btn-sm btn-outline" onclick="document.getElementById('importInput').click()">📥 Import Backup</button>
                <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importData(event)" />
              </div>
            </div>

            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">📊 Stats</div>
              <div class="text-sm text-muted">Subjects: ${data.subjects.length} · Notes: ${data.notes.length} · Tasks: ${data.tasks.length} · Mistakes: ${data.mistakes.length} · Flashcards: ${data.flashcards.length} · Past Papers: ${data.pastPapers.length} · Videos: ${data.videos.length} · Documents: ${data.documents.length} · Projects: ${data.projects.length} · Skills: ${data.skills.length} · Activities: ${data.activities.length} · Goals: ${data.goals.length} · Stories: ${data.stories.length} · Universities: ${data.universities.length} · Essays: ${data.essays.length} · Recommendations: ${data.recommendations.length} · Scholarships: ${data.scholarships.length} · Evidence: ${data.evidence.length} · Habits: ${data.habits.length} · Bookmarks: ${data.bookmarks.length}</div>
              <div class="text-xs text-muted mt-1">Last saved: ${new Date().toLocaleString()}</div>
            </div>
          `;
        }

        function saveSettings() {
            data.student.name = document.getElementById('settingsName').value.trim() || 'Maira';
            data.student.grade = document.getElementById('settingsGrade').value.trim() || 'Grade 9';
            data.student.currentYear = document.getElementById('settingsYear').value.trim() || '2026-2027';
            data.student.examYear = document.getElementById('settingsExamYear').value.trim() || 'CIE 2027';
            if (saveData()) { toast('✅ Settings saved', 'success');
                renderPage('settings'); }
        }

        function getStorageUsage() {
            let total = 0;
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                const val = localStorage.getItem(key);
                total += (key.length + (val ? val.length : 0)) * 2;
            }
            return total;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(1) + ' GB';
        }

        function getQuota() { return 5 * 1024 * 1024; }

        function clearAllFiles() {
            data.pastPapers.forEach(p => { delete p.fileData; });
            data.documents.forEach(d => { delete d.fileData; });
            data.evidence.forEach(e => { delete e.fileData; });
            if (saveData()) { toast('🗑️ All file data cleared.', 'info');
                renderPage('settings'); }
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `olevel_cc_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            toast('📤 Exported', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { try { const imported = JSON.parse(e.target.result); if (imported.subjects) { data =
                            imported;
                        saveData();
                        toast('✅ Imported', 'success');
                        renderPage('settings');
                        navigate('dashboard'); } else { toast('Invalid file.', 'error'); } } catch (_) { toast(
                            'Error reading file.', 'error'); } };
            reader.readAsText(file);
            event.target.value = '';
        }

        // ================================================================
        //  SUBJECTS, SYLLABUS, NOTES, TASKS, MISTAKES, FLASHCARDS, PAST PAPERS, VIDEOS, DOCUMENTS
        //  TIMER, CALENDAR, ACTIVITIES, PROJECTS, SKILLS, PROFILE, GOALS, STORIES, UNIVERSITIES, ESSAYS
        //  RECOMMENDATIONS, SCHOLARSHIPS, EVIDENCE — All from previous version, compacted.
        // ================================================================

        // I'll include compact versions of all these functions to keep the code complete.

        function renderSubjects() {
            const active = data.subjects.filter(s => !s.archived);
            const archived = data.subjects.filter(s => s.archived);
            return `
            <div class="flex-between"><div><div class="page-title">📖 Subjects</div><div class="page-subtitle">Manage subjects across grades.</div></div><button class="btn btn-primary" onclick="showAddSubject()">+ Add Subject</button></div>
            <div class="mt-2"><div class="card"><div style="font-weight:600;margin-bottom:0.5rem;">Grade 9</div><div class="subject-grid">${active.filter(s=>s.grade==='9').map(s=>subjectCardHtml(s)).join('')}</div></div>
            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">Grade 10 & 11</div><div class="subject-grid">${active.filter(s=>s.grade!=='9').map(s=>subjectCardHtml(s)).join('')||'<div class="text-muted text-sm">No subjects assigned to Grade 10 or 11 yet.</div>'}</div></div>
            ${archived.length?`<div class="card mt-2" style="opacity:0.6;"><div style="font-weight:600;margin-bottom:0.5rem;">Archived</div><div class="subject-grid">${archived.map(s=>subjectCardHtml(s,true)).join('')}</div></div>`:''}
          `;
        }

        function subjectCardHtml(s, archived = false) {
            const count = data.notes.filter(n => n.subjectId === s.id).length + data.tasks.filter(t => t.subjectId === s.id)
                .length;
            return `<div class="subject-card"><div class="color-bar" style="background:${s.color||'#6c3b9a'}"></div><div class="name">${s.name}</div><div class="meta">${s.grade?'Grade '+s.grade:''} · ${archived?'Archived':''} · ${count} items</div><div class="progress"><div class="bar" style="width:${Math.min(30+Math.random()*50,85)}%"></div></div><div style="display:flex;gap:0.3rem;margin-top:0.4rem;flex-wrap:wrap;"><button class="btn btn-sm btn-ghost" onclick="editSubject('${s.id}')">✏️</button><button class="btn btn-sm btn-ghost" onclick="archiveSubject('${s.id}')">${archived?'Unarchive':'Archive'}</button><button class="btn btn-sm btn-danger" onclick="deleteSubject('${s.id}')">🗑️</button></div></div>`;
        }

        function showAddSubject() {
            openModal(`
            <div class="modal-title">➕ Add Subject</div>
            <div class="form-group"><label>Name</label><input id="subName" placeholder="e.g. Computer Science" /></div>
            <div class="form-group"><label>Grade</label><select id="subGrade">${['9','10','11'].map(g=>`<option value="${g}">Grade ${g}</option>`).join('')}</select></div>
            <div class="form-group"><label>Color</label><input id="subColor" type="color" value="#6c3b9a" style="width:60px;height:40px;padding:2px;" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addSubject()">Add</button></div>
          `);
        }

        function addSubject() {
            const name = document.getElementById('subName').value.trim();
            if (!name) { toast('Name required.', 'error'); return; }
            data.subjects.push({ id: genId(), name, grade: document.getElementById('subGrade').value, color: document
                    .getElementById('subColor').value, archived: false });
            if (saveData()) { closeModal();
                toast('✅ Subject added', 'success');
                renderPage('subjects'); }
        }

        function editSubject(id) {
            const s = getSubject(id);
            if (!s) return;
            openModal(`
            <div class="modal-title">✏️ Edit Subject</div>
            <div class="form-group"><label>Name</label><input id="editSubName" value="${s.name}" /></div>
            <div class="form-group"><label>Grade</label><select id="editSubGrade">${['9','10','11'].map(g=>`<option value="${g}" ${g===s.grade?'selected':''}>Grade ${g}</option>`).join('')}</select></div>
            <div class="form-group"><label>Color</label><input id="editSubColor" type="color" value="${s.color||'#6c3b9a'}" style="width:60px;height:40px;padding:2px;" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditSubject('${id}')">Save</button></div>
          `);
        }

        function saveEditSubject(id) {
            const s = getSubject(id);
            if (!s) return;
            s.name = document.getElementById('editSubName').value.trim() || 'Subject';
            s.grade = document.getElementById('editSubGrade').value;
            s.color = document.getElementById('editSubColor').value;
            if (saveData()) { closeModal();
                toast('✅ Subject updated', 'success');
                renderPage('subjects'); }
        }

        function archiveSubject(id) {
            const s = getSubject(id);

                saveData();
                toast(s.archived ? '📦 Archived' : '📂 Unarchived', 'info');
                renderPage('subjects'); }
        }

        function deleteSubject(id) {
            if (!confirm('Delete this subject?')) return;
            data.subjects = data.subjects.filter(s => s.id !== id);
            data.notes = data.notes.filter(n => n.subjectId !== id);
            data.tasks = data.tasks.filter(t => t.subjectId !== id);
            data.mistakes = data.mistakes.filter(m => m.subjectId !== id);
            delete data.syllabus[id];
            if (saveData()) { toast('🗑️ Subject deleted', 'info');
                renderPage('subjects'); }
        }

        // ===== SYLLABUS (compact) =====
        function renderSyllabus() {
            const subjects = data.subjects.filter(s => !s.archived);
            if (!subjects.length) return `<div class="page-title">🗂️ Syllabus</div><div class="empty-state"><div class="icon">📚</div><div class="title">No subjects</div><div class="desc">Add a subject first.</div></div>`;
            let html = `<div class="page-title">🗂️ Syllabus</div><div class="page-subtitle">Break down subjects into units, topics, and concepts.</div>`;
            subjects.forEach(sub => {
                const syllabus = data.syllabus[sub.id] || [];
                html += `<div class="card mt-2"><div class="flex-between"><div><span style="font-weight:700;">${sub.name}</span><span class="badge">${syllabus.length} units</span></div><button class="btn btn-sm btn-primary" onclick="addSyllabusUnit('${sub.id}')">+ Unit</button></div><div class="mt-1">${syllabus.length===0?'<div class="text-muted text-sm">No units yet.</div>':syllabus.map((unit,ui)=>`<div style="padding:0.3rem 0.5rem;background:var(--bg);border-radius:var(--radius-sm);margin-top:0.2rem;"><div class="flex-between"><span style="font-weight:600;">${unit.name}</span><div><button class="btn btn-sm btn-ghost" onclick="addSyllabusTopic('${sub.id}',${ui})">+ Topic</button><button class="btn btn-sm btn-ghost" onclick="editSyllabusUnit('${sub.id}',${ui})">✏️</button><button class="btn btn-sm btn-ghost" onclick="deleteSyllabusUnit('${sub.id}',${ui})">🗑️</button></div></div>${unit.topics&&unit.topics.length?unit.topics.map((topic,ti)=>`<div class="tree-item"><div class="node"><span>📌</span><span>${topic.name}</span><span style="font-size:0.7rem;color:var(--text-muted);">${topic.concepts?topic.concepts.length:0}</span><button class="btn btn-sm btn-ghost" onclick="addSyllabusConcept('${sub.id}',${ui},${ti})">+</button><button class="btn btn-sm btn-ghost" onclick="editSyllabusTopic('${sub.id}',${ui},${ti})">✏️</button><button class="btn btn-sm btn-ghost" onclick="deleteSyllabusTopic('${sub.id}',${ui},${ti})">🗑️</button></div>${topic.concepts&&topic.concepts.length?topic.concepts.map((concept,ci)=>`<div class="tree-item"><div class="node"><span class="mastery ${concept.mastery||'not_started'}"></span><span>${concept.name}</span><span class="pill ${concept.mastery||'not_started'}">${concept.mastery||'Not Started'}</span><button class="btn btn-sm btn-ghost" onclick="editSyllabusConcept('${sub.id}',${ui},${ti},${ci})">✏️</button><button class="btn btn-sm btn-ghost" onclick="deleteSyllabusConcept('${sub.id}',${ui},${ti},${ci})">🗑️</button></div></div>`).join(''):'<div class="text-muted text-xs" style="padding-left:1.2rem;">No concepts.</div>'}</div>`).join(''):'<div class="text-muted text-xs" style="padding-left:0.8rem;">No topics.</div>'}</div>`).join('')}</div></div>`;
            });
            return html;
        }

        function getSyllabus(subId) { if (!data.syllabus[subId]) data.syllabus[subId] = []; return data.syllabus[subId]; }

        function addSyllabusUnit(subId) {
            openModal(
                `<div class="modal-title">📂 Add Unit</div><div class="form-group"><label>Unit Name</label><input id="sylUnitName" /></div><div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveSyllabusUnit('${subId}')">Add</button></div>`
                );
        }

        function saveSyllabusUnit(subId) {
            const name = document.getElementById('sylUnitName').value.trim();
            if (!name) { toast('Name required.', 'error'); return; }
            const syllabus = getSyllabus(subId);
            syllabus.push({ id: genId(), name, topics: [] });
            data.syllabus[subId] = syllabus;
            if (saveData()) { closeModal();
                toast('✅ Unit added', 'success');
                renderPage('syllabus'); }
        }

        function editSyllabusUnit(subId, ui) {
            const syllabus = getSyllabus(subId);
            const unit = syllabus[ui];
            if (!unit) return;
            openModal(
                `<div class="modal-title">✏️ Edit Unit</div><div class="form-group"><label>Unit Name</label><input id="editSylUnit" value="${unit.name}" /></div><div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditSyllabusUnit('${subId}',${ui})">Save</button></div>`
                );
        }

        function saveEditSyllabusUnit(subId, ui) {
            const syllabus = getSyllabus(subId);
            const name = document.getElementById('editSylUnit').value.trim();
            if (!name) { toast('Name required.', 'error'); return; }
            syllabus[ui].name = name;
            data.syllabus[subId] = syllabus;
            if (saveData()) { closeModal();
                toast('✅ Unit updated', 'success');
                renderPage('syllabus'); }
        }

        function deleteSyllabusUnit(subId, ui) {
            if (!confirm('Delete this unit?')) return;
            const syllabus = getSyllabus(subId);
            syllabus.splice(ui, 1);
            data.syllabus[subId] = syllabus;

        async function downloadFile(fileId, fileName) {
            try {
                const fileData = await getFile(fileId);
                if (!fileData) { toast('File not found.', 'error'); return; }
                const blob = new Blob([Uint8Array.from(atob(fileData.fileData), c => c.charCodeAt(0))], { type: fileData
                        .metadata.type || 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName || 'download';
                a.click();
                URL.revokeObjectURL(url);
                toast('⬇️ Downloading...', 'success');
            } catch (err) { toast('Error downloading: ' + err.message, 'error'); }
        }

                            await saveFile(fileId, base64, { name: file.name, type: file.type, size: file

                            if (d.fileId) await deleteFile(d.fileId);
                            d.fileId = fileId;
                            d.fileName = file.name;

                            if (saveData()) { closeModal();
                                toast('✅ Document updated!', 'success');
                                renderPage('documents'); }
                        } catch (err) { toast('Error: ' + err.message, 'error'); }
                    };
                    reader.readAsDataURL(file);

            } else {

                    toast('✅ Document updated!', 'success');

        function renderTimer() {
            return `
            <div class="page-title">⏱️ Focus Timer</div>
            <div class="page-subtitle">Pomodoro for study sessions.</div>
            <div class="card" style="max-width:480px;margin:0 auto;">

              <div style="display:flex;gap:0.3rem;justify-content:center;flex-wrap:wrap;margin-bottom:0.8rem;">
                <button class="btn btn-sm ${timerState.mode==='pomodoro'?'btn-primary':'btn-outline'}" onclick="setTimerMode('pomodoro')">Pomodoro</button>
                <button class="btn btn-sm ${timerState.mode==='short'?'btn-primary':'btn-outline'}" onclick="setTimerMode('short')">Short Break</button>
                <button class="btn btn-sm ${timerState.mode==='long'?'btn-primary':'btn-outline'}" onclick="setTimerMode('long')">Long Break</button>
              </div>
              <div class="timer-controls">
                <button class="btn ${timerState.running?'btn-gold':'btn-primary'}" onclick="toggleTimer()">${timerState.running?'⏸️ Pause':'▶️ Start'}</button>
                <button class="btn btn-outline" onclick="resetTimer()">↺ Reset</button>
              </div>
            </div>
          `;
        }

        function setTimerMode(mode) {
            if (timerState.running) toggleTimer();
            const durations = { pomodoro: 25 * 60, short: 5 * 60, long: 15 * 60 };
            timerState.mode = mode;
            timerState.timeLeft = durations[mode] || 25 * 60;
            timerState.total = timerState.timeLeft;
            updateTimerDisplay();
            renderPage('timer');
        }

        function toggleTimer() {
            if (timerState.running) { clearInterval(timerState.interval);
                timerState.running = false;
                renderPage('timer'); return; }
            timerState.running = true;
            timerState.interval = setInterval(() => {
                timerState.timeLeft--;
                updateTimerDisplay();
                if (timerState.timeLeft <= 0) {
                    clearInterval(timerState.interval);
                    timerState.running = false;
                    toast('⏰ Timer finished!', 'success');
                    renderPage('timer');
                }
            }, 1000);
            renderPage('timer');
        }

        function resetTimer() {
            clearInterval(timerState.interval);
            timerState.running = false;
            const durations = { pomodoro: 25 * 60, short: 5 * 60, long: 15 * 60 };
            timerState.timeLeft = durations[timerState.mode] || 25 * 60;
            timerState.total = timerState.timeLeft;
            updateTimerDisplay();
            renderPage('timer');
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timerDisplay');
            if (el) {
                const mins = Math.floor(timerState.timeLeft / 60);
                const secs = timerState.timeLeft % 60;
                el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }
        }

        function initTimer() { updateTimerDisplay(); }

            pendingEvidenceUpload = null;
            openModal(`

            <div class="form-group"><label>Category</label><input id="evCategory" /></div>

            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addEvidence()">Upload</button></div>
          `);
            const fileInput = document.getElementById('evFile');

                            this.files[0] : null; }; }

        async function addEvidence() {
            const title = document.getElementById('evTitle').value.trim() || 'Untitled';
            const category = document.getElementById('evCategory').value.trim() || 'General';
            let file = pendingEvidenceUpload || document.getElementById('evFile').files[0];
            if (!file) { toast('Please select a file.', 'error'); return; }
            try {
                const fileId = genId();
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const base64 = e.target.result.split(',')[1];
                        await saveFile(fileId, base64, { name: file.name, type: file.type, size: file.size });
                        data.evidence.push({ id: genId(), title, category, fileName: file.name, fileId,
                            uploadedAt: new Date().toISOString() });
                        if (saveData()) { closeModal();
                            toast('✅ Evidence uploaded!', 'success');
                            renderPage('evidence'); }
                    } catch (err) { toast('Error: ' + err.message, 'error'); }
                };
                reader.readAsDataURL(file);
            } catch (err) { toast('Error: ' + err.message, 'error'); }
        }

        function editEvidence(id) {
            const e = data.evidence.find(e => e.id === id);
            if (!e) return;
            pendingEvidenceUpload = null;
            openModal(`
            <div class="modal-title">✏️ Edit Evidence</div>
            <div class="form-group"><label>Title</label><input id="editEvTitle" value="${e.title||''}" /></div>
            <div class="form-group"><label>Category</label><input id="editEvCategory" value="${e.category||''}" /></div>
            <div class="form-group"><label>Replace File</label><input id="editEvFile" type="file" accept=".pdf,.png,.jpg,.jpeg,.doc,.docx,.txt" /><div class="text-xs text-muted">Current: ${e.fileName||'None'}</div></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditEvidence('${id}')">Save</button></div>
          `);
            const fileInput = document.getElementById('editEvFile');
            if (fileInput) { fileInput.onchange = function() { pendingEvidenceUpload = this.files && this.files.length > 0 ?
                            this.files[0] : null; }; }
        }

        async function saveEditEvidence(id) {
            const e = data.evidence.find(e => e.id === id);
            if (!e) return;
            e.title = document.getElementById('editEvTitle').value.trim() || 'Untitled';
            e.category = document.getElementById('editEvCategory').value.trim() || 'General';
            let file = pendingEvidenceUpload || document.getElementById('editEvFile').files[0];
            if (file) {
                try {
                    const fileId = genId();
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        try {
                            const base64 = e.target.result.split(',')[1];
                            await saveFile(fileId, base64, { name: file.name, type: file.type, size: file
                                    .size });
                            if (e.fileId) await deleteFile(e.fileId);
                            e.fileId = fileId;
                            e.fileName = file.name;
                            if (saveData()) { closeModal();
                                toast('✅ Evidence updated!', 'success');
                                renderPage('evidence'); }
                        } catch (err) { toast('Error: ' + err.message, 'error'); }
                    };
                    reader.readAsDataURL(file);
                } catch (err) { toast('Error: ' + err.message, 'error'); }
            } else {
                if (saveData()) { closeModal();
                    toast('✅ Evidence updated!', 'success');
                    renderPage('evidence'); }
            }
        }

        async function deleteEvidence(id) {
            if (!confirm('Delete this evidence?')) return;
            const e = data.evidence.find(e => e.id === id);
            if (e && e.fileId) { await deleteFile(e.fileId); }
            data.evidence = data.evidence.filter(e => e.id !== id);
            if (saveData()) { toast('🗑️ Evidence deleted.', 'info');
                renderPage('evidence'); }
        }

        // ================================================================
        //  FAB — Quick Add
        // ================================================================

        document.getElementById('fabButton').addEventListener('click', () => {
            const options = [
                { label: '📝 New Note', action: 'showAddNote()' },
                { label: '✅ New Task', action: 'showAddTask()' },
                { label: '❌ New Mistake', action: 'showAddMistake()' },
                { label: '🃏 New Flashcard', action: 'showAddFlashcard()' },
                { label: '📄 New Past Paper', action: 'showAddPastPaper()' },
                { label: '🎥 New Video', action: 'showAddVideo()' },
                { label: '📁 New Document', action: 'showAddDocument()' },
                { label: '🏆 New Activity', action: 'showAddActivity()' },
                { label: '🚀 New Project', action: 'showAddProject()' },
                { label: '🧠 New Skill', action: 'showAddSkill()' },
                { label: '🎯 New Goal', action: 'showAddGoal()' },
                { label: '📖 New Story', action: 'showAddStory()' },
                { label: '🏛️ New University', action: 'showAddUniversity()' },
                { label: '✍️ New Essay', action: 'showAddEssay()' },
                { label: '📋 New Recommender', action: 'showAddRecommendation()' },
                { label: '💰 New Scholarship', action: 'showAddScholarship()' },
                { label: '📦 New Evidence', action: 'showAddEvidence()' },
                { label: '📅 New Timetable Slot', action: 'showAddTimetableSlot()' },
                { label: '🔄 New Habit', action: 'showAddHabit()' },
                { label: '😊 Log Mood', action: 'showAddMood()' },
                { label: '🔖 New Bookmark', action: 'showAddBookmark()' },
            ];
            let html =
                `<div class="modal-title">✨ Quick Add</div><div class="modal-sub">Choose what to create.</div><div style="display:flex;flex-direction:column;gap:0.3rem;max-height:300px;overflow-y:auto;">`;
            options.forEach(opt => {
                html +=
                    `<button class="btn btn-ghost" style="justify-content:flex-start;padding:0.4rem 0.8rem;font-size:0.85rem;" onclick="closeModal();${opt.action}">${opt.label}</button>`;
            });
            html += `</div><div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button></div>`;
            openModal(html);
        });

        // ================================================================
        //  INIT
        // ================================================================

        renderNav();
        renderPage('dashboard');

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'D') { e.preventDefault();
                navigate('dashboard'); }
            if (e.ctrlKey && e.key === 'k') { e.preventDefault();
                showGlobalSearch(); }
        });

        console.log('🚀 O‑LEVEL COMMAND CENTER — ULTIMATE EDITION');
        console.log('📊 All features loaded with unlimited file storage (IndexedDB).');
    </script>
</body>
</html>
