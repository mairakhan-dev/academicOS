<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O‑LEVEL COMMAND CENTER — ULTIMATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
    <style>
        /* ===== Clean, Premium Theme ===== */
        :root {
            --primary: #6c3b9a;
            --primary-light: #8a5fc4;
            --primary-dark: #4a2c6e;
            --primary-gradient: linear-gradient(135deg, #6c3b9a, #9b6fd4);
            --gold: #c9a84c;
            --gold-light: #f3edd6;
            --bg: #f5f3fa;
            --card-bg: #ffffff;
            --card-border: #e8e3f0;
            --text: #1d1b2a;
            --text-secondary: #4f4a6b;
            --text-muted: #8f8aa8;
            --shadow: 0 4px 20px rgba(108, 59, 154, 0.08);
            --shadow-hover: 0 8px 32px rgba(108, 59, 154, 0.15);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.2, 0, 0, 1);
            --sidebar-width: 250px;
            --font: 'Inter', -apple-system, system-ui, sans-serif;
            --font-serif: 'Playfair Display', serif;
        }
        .dark {
            --bg: #171524;
            --card-bg: #24203a;
            --card-border: #3d3560;
            --text: #ece8f5;
            --text-secondary: #b8b0d0;
            --text-muted: #8f8aa8;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --shadow-hover: 0 8px 32px rgba(0,0,0,0.5);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html { font-size: 16px; scroll-behavior: smooth; }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary-light); border-radius: 8px; }

        /* ----- Sidebar ----- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card-bg);
            border-right: 1px solid var(--card-border);
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            padding: 1.6rem 0.8rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: background 0.3s, border-color 0.3s;
        }
        .sidebar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary);
            padding: 0 0.8rem 1.8rem 0.8rem;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-serif);
            font-style: italic;
        }
        .sidebar-brand span {
            background: var(--primary-gradient);
            color: #fff;
            font-size: 0.6rem;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            letter-spacing: 0.3px;
            font-style: normal;
            font-family: var(--font);
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav .nav-item:hover {
            background: rgba(108, 59, 154, 0.08);
            color: var(--primary);
        }
        .sidebar-nav .nav-item.active {
            background: var(--primary-gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(108, 59, 154, 0.25);
        }
        .sidebar-nav .nav-item .icon { font-size: 1.15rem; width: 1.6rem; text-align: center; flex-shrink: 0; }
        .sidebar-nav .nav-item .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sidebar-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--card-border);
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0.8rem;
            display: flex;
            justify-content: space-between;
        }

        /* ----- Main ----- */
        .main {
            flex: 1;
            min-width: 0;
            padding: 1.8rem 2.4rem 3rem 2.4rem;
            max-width: calc(100vw - var(--sidebar-width));
            overflow-y: auto;
            position: relative;
        }
        .page {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .page.active { display: block; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(12px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .page-title {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--primary);
        }
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }

        /* ----- Cards ----- */
        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 1.2rem 1.4rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--card-border);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }
        .card-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-value.normal { -webkit-text-fill-color: var(--text); }

        /* ----- Buttons ----- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            border: 1px solid transparent;
            background: var(--bg);
            color: var(--text-secondary);
            cursor: pointer;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(108, 59, 154, 0.15);
        }
        .btn-primary {
            background: var(--primary-gradient);
            color: #fff;
            border: none;
        }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(108, 59, 154, 0.3); }
        .btn-outline {
            background: transparent;
            border-color: var(--card-border);
        }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }
        .btn-gold {
            background: linear-gradient(135deg, #b89430, #e8c95a);
            color: #fff;
        }
        .btn-gold:hover { box-shadow: 0 6px 20px rgba(184, 148, 48, 0.3); }
        .btn-danger { background: #e74c4c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .btn-sm { padding: 0.25rem 0.8rem; font-size: 0.75rem; }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: none;
        }
        .btn-ghost:hover { background: rgba(108, 59, 154, 0.08); transform: none; }

        /* ----- Filter Bar ----- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            background: var(--card-bg);
            padding: 0.8rem 1.2rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            margin-bottom: 1.2rem;
            box-shadow: var(--shadow);
        }
        .filter-bar .filter-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .filter-bar .filter-group label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .filter-bar select, .filter-bar input {
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            background: var(--bg);
            font-size: 0.8rem;
            min-width: 120px;
            color: var(--text);
        }
        .filter-bar select:focus, .filter-bar input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(108,59,154,0.1);
        }
        .filter-bar .btn-clear { margin-left: auto; }

        /* ----- Grids ----- */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 0.85rem; }
        .text-xs { font-size: 0.75rem; }
        .pill {
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .pill.purple { background: rgba(108,59,154,0.12); color: var(--primary); }
        .pill.green { background: rgba(39,174,96,0.12); color: #1f6e2f; }
        .pill.red { background: rgba(231,76,60,0.12); color: #b13a3a; }
        .pill.gold { background: var(--gold-light); color: #8a7020; }
        .pill.blue { background: rgba(52,152,219,0.12); color: #1f4f8a; }

        /* ----- Tables ----- */
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
            background: var(--card-bg);
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th {
            text-align: left;
            padding: 0.6rem 1rem;
            background: var(--bg);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--card-border);
        }
        td { padding: 0.6rem 1rem; border-bottom: 1px solid var(--card-border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }

        /* ----- Empty state ----- */
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
        }
        .empty-state .icon { font-size: 2.8rem; margin-bottom: 0.5rem; }
        .empty-state .title { font-weight: 600; font-size: 1.1rem; color: var(--text-secondary); }
        .empty-state .desc { font-size: 0.9rem; margin-top: 0.2rem; }

        /* ----- Modal ----- */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--card-bg);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.8rem 2rem;
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--card-border);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn { 0% { opacity: 0; transform: scale(0.96) translateY(12px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        .modal .modal-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.2rem; font-family: var(--font-serif); font-style: italic; color: var(--primary); }
        .modal .modal-sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.2rem; }
        .modal .form-group { margin-bottom: 1rem; }
        .modal .form-group label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 0.2rem; color: var(--text-secondary); }
        .modal .form-actions { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.2rem; padding-top: 0.8rem; border-top: 1px solid var(--card-border); }
        input, textarea, select {
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.9rem;
            width: 100%;
            transition: var(--transition);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(108,59,154,0.1);
        }

        /* ----- Toast ----- */
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1.2rem;
            box-shadow: var(--shadow-hover);
            border-left: 4px solid var(--primary);
            animation: slideIn 0.25s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            border: 1px solid var(--card-border);
        }
        .toast.success { border-left-color: #27ae60; }
        .toast.error { border-left-color: #e74c4c; }
        .toast.warning { border-left-color: #f1c40f; }
        @keyframes slideIn { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }
        .toast .close { margin-left: auto; cursor: pointer; opacity: 0.5; font-size: 1.1rem; }

        /* ----- FAB ----- */
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--primary-gradient);
            color: #fff;
            font-size: 2rem;
            box-shadow: 0 6px 24px rgba(108, 59, 154, 0.3);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .fab:hover { transform: scale(1.08); box-shadow: 0 8px 32px rgba(108, 59, 154, 0.4); }

        /* ----- Video wrapper ----- */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: var(--radius-sm);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* ----- File card ----- */
        .file-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
        }
        .file-card .file-icon { font-size: 1.8rem; color: var(--primary); }
        .file-card .file-info { flex: 1; }
        .file-card .file-info .name { font-weight: 600; }
        .file-card .file-info .meta { font-size: 0.75rem; color: var(--text-muted); }
        .file-card .file-actions { display: flex; gap: 0.4rem; }

        /* ----- Attendance heatmap ----- */
        .attendance-heatmap {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 3px;
            max-width: 400px;
        }
        .attendance-heatmap .day {
            aspect-ratio: 1;
            border-radius: 4px;
            background: var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            color: var(--text-muted);
        }
        .attendance-heatmap .day.present { background: #27ae60; color: #fff; }
        .attendance-heatmap .day.absent { background: #e74c4c; color: #fff; }

        /* ----- Timetable ----- */
        .timetable-grid {
            display: grid;
            grid-template-columns: 80px repeat(7, 1fr);
            gap: 2px;
            font-size: 0.85rem;
        }
        .timetable-grid .slot {
            padding: 0.3rem 0.2rem;
            background: var(--bg);
            border-radius: 4px;
            text-align: center;
            font-size: 0.7rem;
            border: 1px solid var(--card-border);
        }
        .timetable-grid .slot.header {
            font-weight: 600;
            background: var(--primary);
            color: #fff;
            border: none;
        }
        .timetable-grid .slot.time { font-weight: 600; background: var(--card-bg); }
        .timetable-grid .slot.done { background: #27ae60; color: #fff; }
        .timetable-grid .slot.today { border-color: var(--gold); }

        /* ----- Drag & drop ----- */
        .draggable-item { cursor: grab; transition: transform 0.2s; }
        .draggable-item:active { cursor: grabbing; }
        .draggable-item.dragging { opacity: 0.4; }
        .drop-zone {
            border: 2px dashed var(--primary);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            margin: 0.2rem 0;
            background: rgba(108,59,154,0.04);
            transition: background 0.2s;
        }
        .drop-zone.drag-over { background: rgba(108,59,154,0.12); }

        /* ----- Quote box ----- */
        .quote-box {
            background: var(--gold-light);
            border-radius: var(--radius-sm);
            padding: 1rem 1.2rem;
            font-style: italic;
            border-left: 4px solid var(--gold);
            margin-bottom: 1rem;
        }
        .dark .quote-box { background: #2d241a; border-left-color: var(--gold); }

        /* ----- Responsive ----- */
        @media (max-width: 820px) {
            .sidebar { width: 68px; padding: 1rem 0.4rem; }
            .sidebar-brand span { display: none; }
            .sidebar-brand { font-size: 0.9rem; justify-content: center; padding: 0 0 1.2rem 0; }
            .sidebar-nav .nav-item .label { display: none; }
            .sidebar-nav .nav-item { justify-content: center; padding: 0.6rem; }
            .sidebar-nav .nav-item .icon { font-size: 1.3rem; width: auto; }
            .sidebar-footer { display: none; }
            .main { padding: 1.2rem 1.2rem 2rem 1.2rem; max-width: calc(100vw - 68px); }
            .grid-2 { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr 1fr; }
            .grid-4 { grid-template-columns: 1fr 1fr; }
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            .fab { bottom: 1.2rem; right: 1.2rem; width: 48px; height: 48px; font-size: 1.6rem; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar .btn-clear { margin-left: 0; }
            .timetable-grid { font-size: 0.6rem; grid-template-columns: 50px repeat(7, 1fr); }
        }
        @media (max-width: 480px) {
            .sidebar { width: 56px; padding: 0.6rem 0.2rem; }
            .sidebar-brand { font-size: 0.7rem; padding: 0 0 0.8rem 0; }
            .sidebar-nav .nav-item { padding: 0.5rem 0.3rem; }
            .sidebar-nav .nav-item .icon { font-size: 1.1rem; }
            .main { padding: 0.8rem 0.8rem 1.5rem 0.8rem; max-width: calc(100vw - 56px); }
            .page-title { font-size: 1.3rem; }
            .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
            .stat-grid { grid-template-columns: 1fr 1fr; }
            .modal { padding: 1.2rem; }
            .subject-grid { grid-template-columns: 1fr 1fr; }
            .fab { bottom: 1rem; right: 1rem; width: 44px; height: 44px; font-size: 1.4rem; }
            .timetable-grid { font-size: 0.5rem; grid-template-columns: 35px repeat(7, 1fr); }
        }

        /* ----- Stats grid on dashboard ----- */
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.8rem;
        }
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 0.9rem 1.2rem;
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
        }
        .stat-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-card .value { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.3px; }

        .mission-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm);
            background: var(--bg);
            border-left: 4px solid var(--primary);
            margin-bottom: 0.5rem;
            transition: var(--transition);
        }
        .mission-item:hover { background: rgba(108,59,154,0.05); }
        .mission-item .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
        .mission-item .dot.red { background: #e74c4c; }
        .mission-item .dot.yellow { background: #f1c40f; }
        .mission-item .dot.green { background: #27ae60; }
        .mission-item .info { flex: 1; }
        .mission-item .info .title { font-weight: 600; font-size: 0.9rem; }
        .mission-item .info .sub { font-size: 0.75rem; color: var(--text-muted); }
        .mission-item .actions { display: flex; gap: 0.3rem; flex-wrap: wrap; }
        .mission-item .actions .tag {
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 500;

    <script>
        // ================================================================

        // ================================================================

        const DB_KEY = 'olevel_cc_v10';

        let data = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const def = getDefaultData();
                    for (const k in def) {
                        if (!(k in parsed)) parsed[k] = def[k];
                    }
                    ['subjects','notes','tasks','mistakes','flashcards','pastPapers','videos','documents',
                        'projects','skills','recommendations','scholarships','evidence','activities','goals',
                        'stories','universities','essays','events','studySessions','timetable','habits',
                        'moodLog','bookmarks'
                    ].forEach(arr => {
                        if (!Array.isArray(parsed[arr])) parsed[arr] = [];
                    });
                    if (!parsed.attendance) parsed.attendance = {};
                    if (!parsed.gradeCalculator) parsed.gradeCalculator = { courses: [] };
                    if (!parsed.settings) parsed.settings = { darkMode: false, accentColor: '#6c3b9a', fontSize: 16 };
                    if (!parsed.profile) parsed.profile = { interests: '', passions: '', values: '', motivations: '',
                        strengths: '', weaknesses: '', curiosities: '', beliefs: '', goals: '', problems: '',
                        changedMind: '', experiences: '' };
                    return parsed;
                }
            } catch (e) { console.warn('Load error, using defaults', e); }
            return getDefaultData();
        }

        function saveData() {
            try {
                localStorage.setItem(DB_KEY, JSON.stringify(data));
                applyTheme();
                return true;
            } catch (e) {
                toast('Error saving: ' + e.message, 'error');
                return false;
            }

        function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

        function getSubject(id) { return data.subjects.find(s => s.id === id); }
        function getSubjectName(id) { const s = getSubject(id); return s ? s.name : 'Unknown'; }

        // ----- IndexedDB for files -----
        const DB_NAME = 'olevel_files_db';
        const STORE_NAME = 'files';

        function openFileDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveFile(id, fileData, metadata) {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ id, fileData, metadata, uploadedAt: new Date().toISOString() });
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getFile(id) {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteFile(id) {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        // ================================================================
        //  SOUND EFFECTS (optional, toggle in settings)
        // ================================================================

        let audioCtx = null;
        let soundEnabled = true;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playSound(type = 'click') {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                gain.gain.value = 0.06;
                if (type === 'click') {
                    osc.frequency.value = 600;
                    osc.type = 'sine';
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(523, ctx.currentTime);
                    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
                    osc.type = 'sine';
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'error') {
                    osc.frequency.value = 200;
                    osc.type = 'sawtooth';
                    gain.gain.value = 0.04;
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.2);
                }
            } catch (e) { /* ignore */ }
        }

            container.appendChild(el);
            setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
            if (type === 'success') playSound('success');
            else playSound('click');
        }

        // ================================================================
        //  NAVIGATION
        // ================================================================

        const NAV_ITEMS = [
            { id: 'dashboard', icon: '🏠', label: 'Dashboard' },
            { id: 'attendance', icon: '📋', label: 'Attendance' },
            { id: 'timetable', icon: '📅', label: 'Timetable' },

        // ================================================================
        //  DRAG AND DROP (notes & tasks)
        // ================================================================

        function initDragAndDrop() {
            const items = document.querySelectorAll('.draggable-item');
            items.forEach(item => {
                item.setAttribute('draggable', 'true');
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragend', handleDragEnd);
            });
            const zones = document.querySelectorAll('.drop-zone');
            zones.forEach(zone => {
                zone.addEventListener('dragover', handleDragOver);
                zone.addEventListener('dragenter', handleDragEnter);
                zone.addEventListener('dragleave', handleDragLeave);
                zone.addEventListener('drop', handleDrop);
            });
        }

        let draggedItem = null;

        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const id = e.dataTransfer.getData('text/plain');
            if (!id || !draggedItem) return;
            const dropTarget = this.closest('.draggable-item');
            if (!dropTarget || dropTarget === draggedItem) return;
            const container = draggedItem.parentNode;
            const items = Array.from(container.querySelectorAll('.draggable-item'));
            const draggedIndex = items.indexOf(draggedItem);
            const dropIndex = items.indexOf(dropTarget);
            if (draggedIndex < dropIndex) {
                container.insertBefore(draggedItem, dropTarget.nextSibling);
            } else {
                container.insertBefore(draggedItem, dropTarget);
            }
            // Determine which list
            const listId = container.dataset.listId;
            if (listId === 'notes') {
                const noteIds = Array.from(container.querySelectorAll('.draggable-item')).map(el => el.dataset.id);
                const newNotes = [];
                noteIds.forEach(id => {
                    const note = data.notes.find(n => n.id === id);
                    if (note) newNotes.push(note);
                });
                data.notes.forEach(n => {
                    if (!newNotes.find(nn => nn.id === n.id)) newNotes.push(n);
                });
                data.notes = newNotes;
            } else if (listId === 'tasks') {
                const taskIds = Array.from(container.querySelectorAll('.draggable-item')).map(el => el.dataset.id);
                const newTasks = [];
                taskIds.forEach(id => {
                    const task = data.tasks.find(t => t.id === id);
                    if (task) newTasks.push(task);
                });
                data.tasks.forEach(t => {
                    if (!newTasks.find(tt => tt.id === t.id)) newTasks.push(t);
                });
                data.tasks = newTasks;
            }
            saveData();
            toast('✅ Reordered!', 'success');
            renderPage(currentPage);
        }

        // ================================================================
        //  THEME
        // ================================================================

        function applyTheme() {
            const settings = data.settings || {};
            if (settings.darkMode) document.body.classList.add('dark');
            else document.body.classList.remove('dark');
            if (settings.accentColor) {
                document.documentElement.style.setProperty('--primary', settings.accentColor);
                const lighter = adjustColor(settings.accentColor, 30);
                document.documentElement.style.setProperty('--primary-gradient', `linear-gradient(135deg, ${settings.accentColor}, ${lighter})`);
            }
            if (settings.fontSize) {
                document.documentElement.style.fontSize = settings.fontSize + 'px';
            }
        }

        function adjustColor(hex, percent) {
            let r = parseInt(hex.slice(1,3), 16);
            let g = parseInt(hex.slice(3,5), 16);
            let b = parseInt(hex.slice(5,7), 16);
            r = Math.min(255, r + percent);
            g = Math.min(255, g + percent);
            b = Math.min(255, b + percent);
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }

        // ================================================================
        //  DASHBOARD
        // ================================================================

        function renderDashboard() {
            const name = data.student.name || 'Maira';
            const grade = data.student.grade || 'Grade 9';
            const examYear = data.student.examYear || 'CIE 2027';
            const now = new Date();
            const day = now.toLocaleDateString('en-US', { weekday: 'long' });
            const dateStr = now.toISOString().split('T')[0];
            const totalSubjects = data.subjects.filter(s => !s.archived).length;
            const totalTasks = data.tasks.length;
            const pendingTasks = data.tasks.filter(t => t.status !== 'Completed').length;
            const totalPastPapers = data.pastPapers.length;
            const totalVideos = data.videos.length;
            const totalDocs = data.documents.length;
            const attendanceCount = Object.keys(data.attendance).filter(d => data.attendance[d] === true).length;
            const todayAttended = data.attendance[dateStr] || false;
            const todaySlots = data.timetable.filter(t => t.day === now.getDay());
            const todayDone = todaySlots.filter(s => s.checked && s.checked[dateStr]).length;
            const todayMood = data.moodLog.find(m => m.date === dateStr);
            const quotes = [
                "The secret of getting ahead is getting started. — Mark Twain",
                "Education is the most powerful weapon. — Nelson Mandela",
                "Success is the sum of small efforts repeated daily. — Robert Collier",
                "Believe you can and you're halfway there. — Theodore Roosevelt",
                "The future belongs to those who prepare today. — Malcolm X",
                "It does not matter how slowly you go as long as you do not stop. — Confucius",
                "The mind is not a vessel to be filled but a fire to be kindled. — Plutarch",
                "Excellence is not a skill, it's an attitude. — Ralph Marston",
            ];
            const quote = quotes[now.getDate() % quotes.length];
            const missionTasks = data.tasks.filter(t => t.status !== 'Completed')
                .sort((a,b) => ({high:0,medium:1,low:2}[a.priority]||1) - ({high:0,medium:1,low:2}[b.priority]||1))
                .slice(0,5);
            const upcomingExams = data.events.filter(e => e.type === 'exam' && new Date(e.date) >= now)
                .sort((a,b) => new Date(a.date) - new Date(b.date)).slice(0,3);
            const daysUntilExam = upcomingExams.length > 0 ? Math.ceil((new Date(upcomingExams[0].date) - now) / (1000*60*60*24)) : '—';

            return `
            <div class="flex-between" style="margin-bottom:0.5rem;">
              <div class="greeting">Good ${now.getHours()<12?'morning':now.getHours()<17?'afternoon':'evening'}, ${name} 👋</div>
              <div style="display:flex;gap:0.5rem;">
                <button class="btn btn-sm btn-ghost" onclick="toggleDarkMode()">${data.settings.darkMode?'☀️ Light':'🌙 Dark'}</button>
                <button class="btn btn-sm btn-primary" onclick="showGlobalSearch()">🔍 Search</button>
              </div>
            </div>
            <div class="greeting-sub">${day} · ${grade} · ${examYear}</div>
            <div class="quote-box">💭 ${quote}</div>
            <div class="stat-grid">
              <div class="stat-card"><div class="label">Attendance</div><div class="value">${attendanceCount}</div><div class="card-label">${todayAttended?'✅ Checked in':'⬜ Check in'}</div></div>
              <div class="stat-card"><div class="label">Days to Exam</div><div class="value">${daysUntilExam}</div></div>
              <div class="stat-card"><div class="label">Today's Progress</div><div class="value">${todayDone}/${todaySlots.length}</div><div class="card-label">Timetable done</div></div>
              <div class="stat-card"><div class="label">Mood</div><div class="value">${todayMood?todayMood.mood:'😐'}</div><div class="card-label">${todayMood?todayMood.note||'':'Log your mood'}</div></div>
            </div>
            <div class="flex-between" style="margin-bottom:0.8rem;">
              <h2 style="font-size:1.2rem;font-weight:700;">🎯 Today's Mission</h2>
              <button class="btn btn-sm btn-primary" onclick="navigate('tasks')">View All →</button>
            </div>
            ${missionTasks.length === 0 ? `<div class="empty-state"><div class="icon">✅</div><div class="title">All caught up!</div><div class="desc">No pending tasks.</div></div>` : missionTasks.map(t => {
              const color = t.priority === 'high' ? 'red' : t.priority === 'medium' ? 'yellow' : 'green';
              return `<div class="mission-item"><span class="dot ${color}"></span><div class="info"><div class="title">${t.title}</div><div class="sub">${t.subjectId?getSubjectName(t.subjectId):'General'} · ${t.priority||'medium'}</div></div><div class="actions"><span class="tag" onclick="toast('📖 Learn: ${t.title}')">Learn</span><span class="tag" onclick="toast('📝 Notes')">Notes</span><span class="tag" onclick="toast('📝 Practice')">Practice</span><span class="tag" onclick="toast('🔄 Review')">Review</span></div></div>`;
            }).join('')}
            <div class="grid-4 mt-3">
              <div class="card"><div class="card-title">📚 Subjects</div><div class="card-value normal">${totalSubjects}</div><div class="card-label">Active</div></div>
              <div class="card"><div class="card-title">✅ Tasks</div><div class="card-value normal">${pendingTasks}/${totalTasks}</div><div class="card-label">Pending / Total</div></div>
              <div class="card"><div class="card-title">📄 Past Papers</div><div class="card-value normal">${totalPastPapers}</div><div class="card-label">Uploaded</div></div>
              <div class="card"><div class="card-title">🎥 Videos</div><div class="card-value normal">${totalVideos}</div><div class="card-label">Saved</div></div>
            </div>
          `;
        }

        // ================================================================
        //  ATTENDANCE
        // ================================================================

        function renderAttendance() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const todayChecked = data.attendance[dateStr] || false;
            const days = [];
            for (let i = 29; i >= 0; i--) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const ds = d.toISOString().split('T')[0];
                days.push({ date: ds, day: d.getDate(), month: d.toLocaleString('en', { month: 'short' }), present: data.attendance[ds] || false });
            }
            const totalPresent = Object.values(data.attendance).filter(v => v === true).length;
            const totalDays = Object.keys(data.attendance).length;
            const pct = totalDays > 0 ? Math.round((totalPresent / totalDays) * 100) : 0;
            return `
            <div class="flex-between">
              <div><div class="page-title">📋 Attendance</div><div class="page-subtitle">Check in daily to track your consistency.</div></div>
              <button class="btn ${todayChecked?'btn-gold':'btn-primary'}" onclick="toggleAttendance()">${todayChecked?'✅ Checked In':'☑️ Check In Today'}</button>
            </div>
            <div class="grid-3 mt-2">
              <div class="card"><div class="card-title">Total Check-ins</div><div class="card-value normal">${totalPresent}</div><div class="card-label">Days present</div></div>
              <div class="card"><div class="card-title">Attendance Rate</div><div class="card-value normal">${pct}%</div><div class="card-label">${totalDays} total days</div></div>
              <div class="card"><div class="card-title">Current Streak</div><div class="card-value normal">🔥 ${calculateStreak()}</div><div class="card-label">Consecutive days</div></div>
            </div>
            <div class="card mt-2">
              <div style="font-weight:600;margin-bottom:0.5rem;">Last 30 Days</div>
              <div class="attendance-heatmap">
                ${days.map(d => `<div class="day ${d.present?'present':'absent'}" title="${d.date}">${d.day}</div>`).join('')}
              </div>
              <div class="text-xs text-muted mt-1">🟢 Present · 🔴 Absent</div>
            </div>
          `;
        }

        function toggleAttendance() {
            const dateStr = new Date().toISOString().split('T')[0];
            data.attendance[dateStr] = !data.attendance[dateStr];
            if (saveData()) {
                toast(data.attendance[dateStr] ? '✅ Checked in! Keep it up!' : '⏳ Check-in removed.', 'info');
                renderPage('attendance');
                if (data.attendance[dateStr]) playSound('success');
            }
        }

        function calculateStreak() {
            const now = new Date();
            let streak = 0;
            for (let i = 0; i < 365; i++) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const ds = d.toISOString().split('T')[0];
                if (data.attendance[ds]) streak++;
                else if (i > 0) break;
            }
            return streak;
        }

        // ================================================================
        //  TIMETABLE
        // ================================================================

        function renderTimetable() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            const today = now.getDay();
            let html = `
            <div class="flex-between">
              <div><div class="page-title">📅 Timetable</div><div class="page-subtitle">Customize your study schedule. Check off tasks daily!</div></div>
              <button class="btn btn-primary" onclick="showAddTimetableSlot()">+ Add Slot</button>
            </div>
            <div class="card mt-2">
              <div style="font-weight:600;margin-bottom:0.5rem;">Today — ${days[today]} (${now.toLocaleDateString()})</div>
              <div style="display:flex;gap:0.5rem;margin-bottom:0.5rem;">
                <button class="btn btn-sm btn-outline" onclick="checkAllTimetable()">✅ Check All</button>
                <button class="btn btn-sm btn-outline" onclick="uncheckAllTimetable()">⬜ Uncheck All</button>
              </div>
              ${data.timetable.filter(t => t.day === today).length === 0 ? '<div class="text-muted text-sm">No slots scheduled for today.</div>' :
                data.timetable.filter(t => t.day === today).map(t => {
                  const checked = t.checked && t.checked[dateStr];
                  return `<div class="mission-item" style="border-left-color:${checked?'#27ae60':'var(--primary)'}">
                    <input type="checkbox" ${checked?'checked':''} onchange="toggleTimetableSlot('${t.id}')" style="width:20px;height:20px;accent-color:var(--primary);" />
                    <div class="info">
                      <div class="title">${t.time} — ${t.subject}</div>
                      <div class="sub">${t.method||'Study'} ${checked?'✅ Done':'⏳ Pending'}</div>
                    </div>
                    <button class="btn btn-sm btn-ghost" onclick="editTimetableSlot('${t.id}')">✏️</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteTimetableSlot('${t.id}')">🗑️</button>
                  </div>`;
                }).join('')}
            </div>
            <div class="card mt-2">
              <div style="font-weight:600;margin-bottom:0.5rem;">Full Week</div>
              <div class="table-wrap">
                <table>
                  <thead><tr><th>Time</th>${days.map(d=>`<th>${d.slice(0,3)}</th>`).join('')}</tr></thead>
                  <tbody>
                    ${getTimetableRows().map(row => `
                      <tr>
                        <td style="font-weight:600;">${row.time}</td>
                        ${row.slots.map(s => `<td>${s ? `<div style="font-size:0.8rem;font-weight:500;">${s.subject}</div><div style="font-size:0.65rem;color:var(--text-muted);">${s.method||''}</div>` : '—'}</td>`).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          `;
            return html;
        }

        function getTimetableRows() {
            const times = [...new Set(data.timetable.map(t => t.time))].sort();
            const days = [0,1,2,3,4,5,6];
            return times.map(time => {
                const slots = days.map(day => {
                    const slot = data.timetable.find(t => t.day === day && t.time === time);
                    return slot || null;
                });
                return { time, slots };
            });
        }

        function toggleTimetableSlot(id) {
            const slot = data.timetable.find(t => t.id === id);
            if (!slot) return;
            const dateStr = new Date().toISOString().split('T')[0];
            if (!slot.checked) slot.checked = {};
            slot.checked[dateStr] = !slot.checked[dateStr];
            if (saveData()) {
                toast(slot.checked[dateStr] ? '✅ Slot done!' : '⏳ Slot unchecked', 'info');
                renderPage('timetable');
            }
        }

        function checkAllTimetable() {
            const dateStr = new Date().toISOString().split('T')[0];
            data.timetable.forEach(t => {
                if (t.day === new Date().getDay()) {
                    if (!t.checked) t.checked = {};
                    t.checked[dateStr] = true;
                }
            });
            if (saveData()) { toast('✅ All slots checked!', 'success'); renderPage('timetable'); }
        }

        function uncheckAllTimetable() {
            const dateStr = new Date().toISOString().split('T')[0];
            data.timetable.forEach(t => {
                if (t.day === new Date().getDay() && t.checked) {
                    t.checked[dateStr] = false;
                }
            });
            if (saveData()) { toast('⬜ All slots unchecked', 'info'); renderPage('timetable'); }
        }

        function showAddTimetableSlot() {
            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            openModal(`
            <div class="modal-title">📅 Add Timetable Slot</div>
            <div class="form-group"><label>Day</label><select id="ttDay">${days.map((d,i)=>`<option value="${i}" ${i===new Date().getDay()?'selected':''}>${d}</option>`).join('')}</select></div>
            <div class="form-group"><label>Time</label><input id="ttTime" placeholder="e.g. 09:00-10:00" /></div>
            <div class="form-group"><label>Subject</label><input id="ttSubject" placeholder="e.g. Mathematics" /></div>
            <div class="form-group"><label>Study Method</label><input id="ttMethod" placeholder="e.g. Past Papers, Notes" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addTimetableSlot()">Add Slot</button></div>
          `);
        }

        function addTimetableSlot() {
            const day = parseInt(document.getElementById('ttDay').value);
            const time = document.getElementById('ttTime').value.trim();
            const subject = document.getElementById('ttSubject').value.trim();
            const method = document.getElementById('ttMethod').value.trim();
            if (!time || !subject) { toast('Time and subject required.', 'error'); return; }
            data.timetable.push({ id: genId(), day, time, subject, method, checked: {} });
            if (saveData()) { closeModal(); toast('✅ Slot added', 'success'); renderPage('timetable'); }
        }

        function editTimetableSlot(id) {
            const slot = data.timetable.find(t => t.id === id);
            if (!slot) return;
            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            openModal(`
            <div class="modal-title">✏️ Edit Slot</div>
            <div class="form-group"><label>Day</label><select id="editTtDay">${days.map((d,i)=>`<option value="${i}" ${i===slot.day?'selected':''}>${d}</option>`).join('')}</select></div>
            <div class="form-group"><label>Time</label><input id="editTtTime" value="${slot.time}" /></div>
            <div class="form-group"><label>Subject</label><input id="editTtSubject" value="${slot.subject}" /></div>
            <div class="form-group"><label>Method</label><input id="editTtMethod" value="${slot.method||''}" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditTimetableSlot('${id}')">Save</button></div>
          `);
        }

        function saveEditTimetableSlot(id) {
            const slot = data.timetable.find(t => t.id === id);
            if (!slot) return;
            slot.day = parseInt(document.getElementById('editTtDay').value);
            slot.time = document.getElementById('editTtTime').value.trim();
            slot.subject = document.getElementById('editTtSubject').value.trim();
            slot.method = document.getElementById('editTtMethod').value.trim();
            if (!slot.time || !slot.subject) { toast('Time and subject required.', 'error'); return; }
            if (saveData()) { closeModal(); toast('✅ Slot updated', 'success'); renderPage('timetable'); }
        }

        function deleteTimetableSlot(id) {
            if (!confirm('Delete this slot?')) return;
            data.timetable = data.timetable.filter(t => t.id !== id);
            if (saveData()) { toast('🗑️ Slot deleted', 'info'); renderPage('timetable'); }
        }

        // ================================================================
        //  SUBJECTS
        // ================================================================

        function renderSubjects() {
            const active = data.subjects.filter(s => !s.archived);
            const archived = data.subjects.filter(s => s.archived);
            return `
            <div class="flex-between"><div><div class="page-title">📖 Subjects</div><div class="page-subtitle">Manage subjects across grades.</div></div><button class="btn btn-primary" onclick="showAddSubject()">+ Add Subject</button></div>
            <div class="mt-2"><div class="card"><div style="font-weight:600;margin-bottom:0.5rem;">Grade 9</div><div class="subject-grid">${active.filter(s=>s.grade==='9').map(s=>subjectCardHtml(s)).join('')}</div></div>
            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">Grade 10 & 11</div><div class="subject-grid">${active.filter(s=>s.grade!=='9').map(s=>subjectCardHtml(s)).join('')||'<div class="text-muted text-sm">No subjects assigned to Grade 10 or 11 yet.</div>'}</div></div>
            ${archived.length?`<div class="card mt-2" style="opacity:0.6;"><div style="font-weight:600;margin-bottom:0.5rem;">Archived</div><div class="subject-grid">${archived.map(s=>subjectCardHtml(s,true)).join('')}</div></div>`:''}
          `;
        }

        function subjectCardHtml(s, archived = false) {
            const count = data.notes.filter(n => n.subjectId === s.id).length + data.tasks.filter(t => t.subjectId === s.id).length;
            return `<div class="subject-card"><div class="color-bar" style="background:${s.color||'#6c3b9a'}"></div><div class="name">${s.name}</div><div class="meta">${s.grade?'Grade '+s.grade:''} · ${archived?'Archived':''} · ${count} items</div><div class="progress"><div class="bar" style="width:${Math.min(30+Math.random()*50,85)}%"></div></div><div style="display:flex;gap:0.3rem;margin-top:0.4rem;flex-wrap:wrap;"><button class="btn btn-sm btn-ghost" onclick="editSubject('${s.id}')">✏️</button><button class="btn btn-sm btn-ghost" onclick="archiveSubject('${s.id}')">${archived?'Unarchive':'Archive'}</button><button class="btn btn-sm btn-danger" onclick="deleteSubject('${s.id}')">🗑️</button></div></div>`;
        }

        function showAddSubject() {
            openModal(`
            <div class="modal-title">➕ Add Subject</div>
            <div class="form-group"><label>Name</label><input id="subName" placeholder="e.g. Computer Science" /></div>
            <div class="form-group"><label>Grade</label><select id="subGrade">${['9','10','11'].map(g=>`<option value="${g}">Grade ${g}</option>`).join('')}</select></div>
            <div class="form-group"><label>Color</label><input id="subColor" type="color" value="#6c3b9a" style="width:60px;height:40px;padding:2px;" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addSubject()">Add</button></div>
          `);
        }

        function addSubject() {
            const name = document.getElementById('subName').value.trim();
            if (!name) { toast('Name required.', 'error'); return; }
            data.subjects.push({ id: genId(), name, grade: document.getElementById('subGrade').value, color: document.getElementById('subColor').value, archived: false });
            if (saveData()) { closeModal(); toast('✅ Subject added', 'success'); renderPage('subjects'); }
        }

        function editSubject(id) {
            const s = getSubject(id);
            if (!s) return;
            openModal(`
            <div class="modal-title">✏️ Edit Subject</div>
            <div class="form-group"><label>Name</label><input id="editSubName" value="${s.name}" /></div>
            <div class="form-group"><label>Grade</label><select id="editSubGrade">${['9','10','11'].map(g=>`<option value="${g}" ${g===s.grade?'selected':''}>Grade ${g}</option>`).join('')}</select></div>
            <div class="form-group"><label>Color</label><input id="editSubColor" type="color" value="${s.color||'#6c3b9a'}" style="width:60px;height:40px;padding:2px;" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditSubject('${id}')">Save</button></div>
          `);
        }

        function saveEditSubject(id) {
            const s = getSubject(id);
            if (!s) return;
            s.name = document.getElementById('editSubName').value.trim() || 'Subject';
            s.grade = document.getElementById('editSubGrade').value;
            s.color = document.getElementById('editSubColor').value;
            if (saveData()) { closeModal(); toast('✅ Subject updated', 'success'); renderPage('subjects'); }
        }

        function archiveSubject(id) {
            const s = getSubject(id);
            if (s) { s.archived = !s.archived; saveData(); toast(s.archived ? '📦 Archived' : '📂 Unarchived', 'info'); renderPage('subjects'); }
        }

        function deleteSubject(id) {
            if (!confirm('Delete this subject?')) return;
            data.subjects = data.subjects.filter(s => s.id !== id);
            data.notes = data.notes.filter(n => n.subjectId !== id);
            data.tasks = data.tasks.filter(t => t.subjectId !== id);
            data.mistakes = data.mistakes.filter(m => m.subjectId !== id);
            delete data.syllabus[id];
            if (saveData()) { toast('🗑️ Subject deleted', 'info'); renderPage('subjects'); }
        }

        // ================================================================
        //  SYLLABUS (simplified, but works)
        // ================================================================

        function renderSyllabus() {
            const subjects = data.subjects.filter(s => !s.archived);
            if (!subjects.length) return `<div class="page-title">🗂️ Syllabus</div><div class="empty-state"><div class="icon">📚</div><div class="title">No subjects</div><div class="desc">Add a subject first.</div></div>`;
            let html = `<div class="page-title">🗂️ Syllabus</div><div class="page-subtitle">Break down subjects into units, topics, and concepts.</div>`;
            subjects.forEach(sub => {
                const syllabus = data.syllabus[sub.id] || [];
                html += `<div class="card mt-2"><div class="flex-between"><div><span style="font-weight:700;">${sub.name}</span><span class="badge">${syllabus.length} units</span></div><button class="btn btn-sm btn-primary" onclick="addSyllabusUnit('${sub.id}')">+ Unit</button></div><div class="mt-1">${syllabus.length===0?'<div class="text-muted text-sm">No units yet.</div>':syllabus.map((unit,ui)=>`<div style="padding:0.3rem 0.5rem;background:var(--bg);border-radius:var(--radius-sm);margin-top:0.2rem;"><div class="flex-between"><span style="font-weight:600;">${unit.name}</span><div><button class="btn btn-sm btn-ghost" onclick="addSyllabusTopic('${sub.id}',${ui})">+ Topic</button><button class="btn btn-sm btn-ghost" onclick="editSyllabusUnit('${sub.id}',${ui})">✏️</button><button class="btn btn-sm btn-ghost" onclick="deleteSyllabusUnit('${sub.id}',${ui})">🗑️</button></div></div>${unit.topics&&unit.topics.length?unit.topics.map((topic,ti)=>`<div class="tree-item"><div class="node"><span>📌</span><span>${topic.name}</span><span style="font-size:0.7rem;color:var(--text-muted);">${topic.concepts?topic.concepts.length:0}</span><button class="btn btn-sm btn-ghost" onclick="addSyllabusConcept('${sub.id}',${ui},${ti})">+</button><button class="btn btn-sm btn-ghost" onclick="editSyllabusTopic('${sub.id}',${ui},${ti})">✏️</button><button class="btn btn-sm btn-ghost" onclick="deleteSyllabusTopic('${sub.id}',${ui},${ti})">🗑️</button></div>${topic.concepts&&topic.concepts.length?topic.concepts.map((concept,ci)=>`<div class="tree-item"><div class="node"><span class="mastery ${concept.mastery||'not_started'}"></span><span>${concept.name}</span><span class="pill ${concept.mastery||'not_started'}">${concept.mastery||'Not Started'}</span><button class="btn btn-sm btn-ghost" onclick="editSyllabusConcept('${sub.id}',${ui},${ti},${ci})">✏️</button><button class="btn btn-sm btn-ghost" onclick="deleteSyllabusConcept('${sub.id}',${ui},${ti},${ci})">🗑️</button></div></div>`).join(''):'<div class="text-muted text-xs" style="padding-left:1.2rem;">No concepts.</div>'}</div>`).join(''):'<div class="text-muted text-xs" style="padding-left:0.8rem;">No topics.</div>'}</div>`).join('')}</div></div>`;
            });
