<script>
    // ================================================================
    //  🎯 ENHANCEMENT SCRIPT — Sound Effects + Fun + Interactive
    //  Paste this at the end of your HTML file
    // ================================================================

    (function() {
        'use strict';

        // ==============================================================
        //  1. SOUND EFFECTS ENGINE (Web Audio)
        // ==============================================================

        let audioCtx = null;
        let soundEnabled = true;

        function getAudioContext() {
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (_) {
                    return null;
                }
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                gain.gain.value = 0.07;

                switch (type) {
                    case 'click':
                        osc.frequency.value = 600;
                        osc.type = 'sine';
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.06);
                        break;

                    case 'success':
                        osc.frequency.setValueAtTime(523, ctx.currentTime);
                        osc.frequency.setValueAtTime(659, ctx.currentTime + 0.08);
                        osc.frequency.setValueAtTime(784, ctx.currentTime + 0.16);
                        osc.type = 'sine';
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.3);
                        break;

                    case 'achievement':
                        osc.frequency.setValueAtTime(880, ctx.currentTime);
                        osc.frequency.setValueAtTime(1108, ctx.currentTime + 0.12);
                        osc.frequency.setValueAtTime(1318, ctx.currentTime + 0.24);
                        osc.type = 'square';
                        gain.gain.value = 0.05;
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.45);
                        break;

                    case 'error':
                        osc.frequency.value = 200;
                        osc.type = 'sawtooth';
                        gain.gain.value = 0.05;
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.25);
                        break;

                    case 'pop':
                        osc.frequency.value = 800;
                        osc.type = 'sine';
                        gain.gain.value = 0.04;
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.04);
                        break;

                    case 'woosh':
                        osc.frequency.setValueAtTime(300, ctx.currentTime);
                        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.15);
                        osc.type = 'sine';
                        gain.gain.value = 0.03;
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.15);
                        break;

                    default:
                        osc.frequency.value = 500;
                        osc.type = 'sine';
                        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.05);
                }
            } catch (_) { /* ignore audio errors */ }
        }

        // ==============================================================
        //  2. FUN VISUAL EFFECTS
        // ==============================================================

        // --- Confetti ---
        function fireConfetti(count = 40) {
            const container = document.createElement('div');
            container.className = 'confetti-container';
            document.body.appendChild(container);

            const colors = ['#e74c4c', '#f1c40f', '#2ecc71', '#3498db', '#9b59b6', '#e67e22', '#1abc9c', '#ff6b6b', '#ffd93d',
                '#6bcb77'
            ];

            for (let i = 0; i < count; i++) {
                const piece = document.createElement('div');
                piece.className = 'confetti-piece';
                const color = colors[Math.floor(Math.random() * colors.length)];
                const size = 6 + Math.random() * 10;
                const left = Math.random() * 100;
                const delay = Math.random() * 1.5;
                const duration = 1.5 + Math.random() * 2;
                const rotation = Math.random() * 360;

                piece.style.cssText = `
                    left: ${left}%;
                    width: ${size}px;
                    height: ${size * (0.4 + Math.random() * 0.8)}px;
                    background: ${color};
                    border-radius: ${Math.random() > 0.5 ? '50%' : '2px'};
                    animation-delay: ${delay}s;
                    animation-duration: ${duration}s;
                    transform: rotate(${rotation}deg);
                `;
                container.appendChild(piece);
            }

            setTimeout(() => container.remove(), 4000);
            playSound('achievement');
        }

        // --- Floating Emoji ---
        function floatEmoji(emoji, x, y) {
            const el = document.createElement('div');
            el.className = 'float-emoji';
            el.textContent = emoji;
            el.style.left = (x || 50) + '%';
            el.style.top = (y || 50) + '%';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 1400);
        }

        // --- Sparkle effect on click ---
        function sparkleEffect(e) {
            const x = e.clientX || window.innerWidth / 2;
            const y = e.clientY || window.innerHeight / 2;
            const emojis = ['✨', '⭐', '🌟', '💫', '🎉', '⚡'];
            for (let i = 0; i < 5; i++) {
                const el = document.createElement('div');
                el.className = 'float-emoji';
                el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                el.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
                el.style.top = (y + (Math.random() - 0.5) * 60) + 'px';
                el.style.fontSize = (1.2 + Math.random() * 1.2) + 'rem';
                el.style.animationDuration = (0.8 + Math.random() * 0.6) + 's';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 1600);
            }
        }

        // --- Achievement Popup ---
        function showAchievement(title, subtitle, icon = '🏆') {
            const existing = document.querySelector('.achievement-popup');
            if (existing) existing.remove();

            const popup = document.createElement('div');
            popup.className = 'achievement-popup';
            popup.innerHTML = `
                <span class="icon">${icon}</span>
                <div>
                    <div class="text">${title}</div>
                    <div class="sub">${subtitle}</div>
                </div>
            `;
            document.body.appendChild(popup);
            fireConfetti(30);
            playSound('achievement');

            setTimeout(() => {
                popup.style.opacity = '0';
                popup.style.transform = 'translateX(40px) scale(0.8)';
                popup.style.transition = 'all 0.4s ease';
                setTimeout(() => popup.remove(), 500);
            }, 3500);
        }

        // ==============================================================
        //  3. INTERCEPT ACTIONS FOR SOUND + FUN
        // ==============================================================

        // --- Intercept button clicks ---
        document.addEventListener('click', function(e) {
            const target = e.target.closest('button, .btn, .nav-item, .tag, .fab');
            if (!target) return;

            // Play click sound
            playSound('click');

            // Sparkle on primary buttons
            if (target.classList.contains('btn-primary') || target.classList.contains('btn-gold')) {
                sparkleEffect(e);
            }

            // Fun emoji on FAB
            if (target.classList.contains('fab')) {
                floatEmoji('✨', 90, 85);
                playSound('pop');
            }

            // Achievement on any .btn-success click
            if (target.classList.contains('btn-success')) {
                setTimeout(() => {
                    showAchievement('🎉 Great Job!', 'You completed an action!', '🌟');
                }, 300);
            }

            // Sidebar nav click - woosh
            if (target.closest('.nav-item')) {
                playSound('woosh');
            }
        }, true);

        // --- Intercept toast for success sound ---
        const originalToast = window.toast;
        if (originalToast) {
            window.toast = function(msg, type) {
                originalToast(msg, type);
                if (type === 'success') {
                    playSound('success');
                    setTimeout(() => {
                        floatEmoji('🎉', 80, 70);
                    }, 200);
                }
                if (type === 'error') {
                    playSound('error');
                }
            };
        }

        // --- Intercept saveData for achievement tracking ---
        const originalSaveData = window.saveData;
        if (originalSaveData) {
            window.saveData = function() {
                const result = originalSaveData();
                // Track achievements based on data size
                try {
                    const data = JSON.parse(localStorage.getItem('olevel_cc_v7') || '{}');
                    const notes = data.notes ? data.notes.length : 0;
                    const tasks = data.tasks ? data.tasks.length : 0;
                    const pastPapers = data.pastPapers ? data.pastPapers.length : 0;

                    // Achievement: First note
                    if (notes === 1 && !localStorage.getItem('_ach_note')) {
                        localStorage.setItem('_ach_note', '1');
                        setTimeout(() => showAchievement('📝 First Note!', 'You wrote your first note!', '📝'), 500);
                    }
                    // Achievement: 10 notes
                    if (notes >= 10 && !localStorage.getItem('_ach_notes10')) {
                        localStorage.setItem('_ach_notes10', '1');
                        setTimeout(() => showAchievement('📚 Knowledge Builder!', 'You created 10 notes!', '📚'), 500);
                    }
                    // Achievement: First task
                    if (tasks === 1 && !localStorage.getItem('_ach_task')) {
                        localStorage.setItem('_ach_task', '1');
                        setTimeout(() => showAchievement('✅ First Task!', 'You added your first task!', '✅'), 500);
                    }
                    // Achievement: 10 tasks
                    if (tasks >= 10 && !localStorage.getItem('_ach_tasks10')) {
                        localStorage.setItem('_ach_tasks10', '1');
                        setTimeout(() => showAchievement('🚀 Task Master!', 'You created 10 tasks!', '🚀'), 500);
                    }
                    // Achievement: First past paper
                    if (pastPapers === 1 && !localStorage.getItem('_ach_paper')) {
                        localStorage.setItem('_ach_paper', '1');
                        setTimeout(() => showAchievement('📄 First Past Paper!', 'You uploaded a past paper!', '📄'),
                        500);
                    }
                } catch (_) {}
                return result;
            };
        }

        // ==============================================================
        //  4. INTERACTIVE FUN — Random Motivational Messages
        // ==============================================================

        const MOTIVATIONAL_MESSAGES = [
            '💪 You got this!',
            '🌟 You are amazing!',
            '🔥 Keep going!',
            '✨ You\'re making progress!',
            '🎯 Stay focused!',
            '🧠 You\'re getting smarter every day!',
            '📚 Knowledge is power!',
            '💡 Great minds think differently!',
            '⚡ You\'re on fire!',
            '🌟 Shine bright!',
            '💪 Keep pushing forward!',
            '🎉 Celebrate every win!',
            '🌱 Growing every day!',
            '🚀 Reaching new heights!',
            '🏆 You\'re a champion!',
        ];

        function showMotivation() {
            const msg = MOTIVATIONAL_MESSAGES[Math.floor(Math.random() * MOTIVATIONAL_MESSAGES.length)];
            const emojis = ['✨', '🌟', '💫', '⚡', '🎉', '🎊', '🔥', '💪'];
            const emoji = emojis[Math.floor(Math.random() * emojis.length)];
            const x = 10 + Math.random() * 80;
            const y = 10 + Math.random() * 80;
            floatEmoji(emoji + ' ' + msg, x, y);
            playSound('pop');
        }

        // --- Show motivation every 2-4 minutes ---
        let motivationInterval = setInterval(() => {
            // Only show if user is active (page visible)
            if (!document.hidden) {
                showMotivation();
            }
        }, 120000 + Math.random() * 120000);

        // --- Reset interval on visibility change ---
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) {
                clearInterval(motivationInterval);
                motivationInterval = setInterval(() => {
                    if (!document.hidden) {
                        showMotivation();
                    }
                }, 120000 + Math.random() * 120000);
            }
        });

        // ==============================================================
        //  5. MOUSE FOLLOW GLOW (on cards)
        // ==============================================================

        document.addEventListener('mousemove', function(e) {
            document.querySelectorAll('.card, .btn, .subject-card').forEach(el => {
                const rect = el.getBoundingClientRect();
                const x = ((e.clientX - rect.left) / rect.width) * 100;
                const y = ((e.clientY - rect.top) / rect.height) * 100;
                el.style.setProperty('--mouse-x', x + '%');
                el.style.setProperty('--mouse-y', y + '%');
            });
        });

        // ==============================================================
        //  6. PARTICLE BACKGROUND
        // ==============================================================

        function createParticles() {
            const container = document.createElement('div');
            container.className = 'particle-container';
            document.body.prepend(container);

            const colors = ['#4a2c6e', '#7a4ba8', '#c9a84c', '#8a5fc4', '#b89430'];
            for (let i = 0; i < 25; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = 2 + Math.random() * 4;
                const left = Math.random() * 100;
                const delay = Math.random() * 20;
                const duration = 20 + Math.random() * 30;
                const color = colors[Math.floor(Math.random() * colors.length)];
                particle.style.cssText = `
                    left: ${left}%;
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    animation-delay: ${delay}s;
                    animation-duration: ${duration}s;
                    opacity: ${0.02 + Math.random() * 0.04};
                `;
                container.appendChild(particle);
            }
        }
        createParticles();

        // ==============================================================
        //  7. FUN KEYBOARD SHORTCUTS
        // ==============================================================

        document.addEventListener('keydown', function(e) {
            // 'M' for motivation
            if (e.key === 'm' || e.key === 'M') {
                if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                    showMotivation();
                    e.preventDefault();
                }
            }
            // 'C' for confetti
            if (e.key === 'c' || e.key === 'C') {
                if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                    fireConfetti(60);
                    e.preventDefault();
                }
            }
            // 'S' for sound toggle
            if (e.key === 's' || e.key === 'S') {
                if (!e.ctrlKey && !e.metaKey && !e.altKey) {
                    soundEnabled = !soundEnabled;
                    toast(soundEnabled ? '🔊 Sound on' : '🔇 Sound off', 'info');
                    e.preventDefault();
                }
            }
        });

        // ==============================================================
        //  8. DOUBLE CLICK FUN — Confetti explosion
        // ==============================================================

        document.addEventListener('dblclick', function(e) {
            // Don't trigger on inputs, textareas, modals
            if (e.target.closest('input, textarea, .modal, select')) return;
            fireConfetti(80);
            floatEmoji('🎉', e.clientX / window.innerWidth * 100, e.clientY / window.innerHeight * 100);
            playSound('achievement');
        });

        // ==============================================================
        //  9. SOUND TOGGLE BUTTON — Add to settings page
        // ==============================================================

        // Add sound toggle to settings page when it renders
        const originalRenderSettings = window.renderSettings;
        if (originalRenderSettings) {
            window.renderSettings = function() {
                const html = originalRenderSettings();
                // We'll inject via DOM after render
                setTimeout(() => {
                    const settingsCards = document.querySelectorAll('#page-settings .card');
                    if (settingsCards.length > 1) {
                        const appearanceCard = settingsCards[1];
                        if (appearanceCard) {
                            const soundToggle = document.createElement('div');
                            soundToggle.className = 'flex-between mt-1';
                            soundToggle.style.marginTop = '0.8rem';
                            soundToggle.style.paddingTop = '0.8rem';
                            soundToggle.style.borderTop = '1px solid var(--border)';
                            soundToggle.innerHTML = `
                                <span>🔊 Sound Effects</span>
                                <button class="btn ${soundEnabled ? 'btn-primary' : 'btn-outline'}" 
                                        onclick="toggleSoundEnhancement()" 
                                        id="soundToggleBtn">
                                    ${soundEnabled ? '🔊 On' : '🔇 Off'}
                                </button>
                            `;
                            appearanceCard.appendChild(soundToggle);
                        }
                    }
                }, 50);
                return html;
            };
        }

        // Sound toggle function
        window.toggleSoundEnhancement = function() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('soundToggleBtn');
            if (btn) {
                btn.textContent = soundEnabled ? '🔊 On' : '🔇 Off';
                btn.className = `btn ${soundEnabled ? 'btn-primary' : 'btn-outline'}`;
            }
            toast(soundEnabled ? '🔊 Sound on' : '🔇 Sound off', 'info');
            if (soundEnabled) playSound('success');
        };

        // Also expose soundEnabled globally so settings can access it
        window.__soundEnabled = soundEnabled;
        window.__toggleSound = function() {
            soundEnabled = !soundEnabled;
            window.__soundEnabled = soundEnabled;
            toast(soundEnabled ? '🔊 Sound on' : '🔇 Sound off', 'info');
            if (soundEnabled) playSound('success');
        };

        // ==============================================================
        //  10. RANDOM EASTER EGGS
        // ==============================================================

        // Konami code (just for fun)
        let konami = [];
        const konamiCode = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft',
            'ArrowRight', 'b', 'a'
        ];

        document.addEventListener('keydown', function(e) {
            konami.push(e.key);
            if (konami.length > konamiCode.length) konami.shift();
            if (konami.join(',') === konamiCode.join(',')) {
                konami = [];
                fireConfetti(100);
                setTimeout(() => {
                    showAchievement('🎮 KONAMI CODE!', 'You found the secret! 🎉', '🎮');
                }, 300);
                playSound('achievement');
                setTimeout(() => {
                    floatEmoji('🎮', 30, 40);
                    floatEmoji('🕹️', 70, 30);
                    floatEmoji('⭐', 50, 70);
                }, 200);
            }
        });

        // ==============================================================
        //  11. FUN ON PAGE LOAD — Welcome achievement
        // ==============================================================

        setTimeout(() => {
            if (!localStorage.getItem('_ach_welcome')) {
                localStorage.setItem('_ach_welcome', '1');
                setTimeout(() => {
                    showAchievement('👋 Welcome to O-LEVEL CC!', 'Your journey starts now!', '🌟');
                }, 1500);
            }
        }, 800);

        // ==============================================================
        //  12. EXPOSE FUNCTIONS FOR CONSOLE PLAY
        // ==============================================================

        console.log('%c🎯 O-LEVEL CC — Enhancement Pack Loaded!', 'font-size:18px;font-weight:bold;color:#6c3b9a;');
        console.log('%c📌 Press M for motivation, C for confetti, S for sound toggle', 'font-size:13px;color:#8f8aa8;');
        console.log('%c🕹️ Try the Konami code: ↑↑↓↓←→←→BA', 'font-size:13px;color:#8f8aa8;');
        console.log('%c✨ Double-click anywhere for confetti!', 'font-size:13px;color:#8f8aa8;');

        window.fireConfetti = fireConfetti;
        window.showAchievement = showAchievement;
        window.floatEmoji = floatEmoji;
        window.sparkleEffect = sparkleEffect;
        window.playSound = playSound;

        console.log('✅ Enhancement pack ready! 🚀');

    })();
</script>

        //  Overrides the existing renderTimetable function
        // ================================================================

        // Backup original function if it exists
        const originalRenderTimetable = window.renderTimetable;

        // --- Helper to get timetable rows ---
        function getTimetableRows() {
            const times = [...new Set(data.timetable.map(t => t.time))].sort();
            const days = [0, 1, 2, 3, 4, 5, 6];
            return times.map(time => {
                const slots = days.map(day => {
                    const slot = data.timetable.find(t => t.day === day && t.time === time);
                    return slot || null;
                });
                return { time, slots };
            });
        }

        // --- New renderTimetable function ---
        window.renderTimetable = function() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const todayIndex = now.getDay(); // 0 = Sunday
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

            // --- If no slots, show a beautiful empty state ---
            if (data.timetable.length === 0) {

                        <div class="text-muted text-sm">No slots added yet. Build your perfect schedule!</div>

            // --- Build the table ---
            const rows = getTimetableRows();
            if (rows.length === 0) {
                return `<div class="page-title">📅 Timetable</div><div class="empty-state"><div class="icon">📅</div><div class="title">No time slots configured</div><div class="desc">Please add time entries to your timetable.</div></div>`;
            }

            let html = `
                <div class="flex-between">
                    <div>
                        <div class="page-title">📅 Timetable</div>
                        <div class="page-subtitle">Customize your study schedule. Check off tasks daily!</div>

                <!-- Today's Progress -->
                <div class="card mt-2" style="padding:0.8rem 1.2rem; display:flex; align-items:center; gap:1rem; flex-wrap:wrap;">
                    <div style="font-weight:600;">📌 Today's Progress</div>
                    ${data.timetable.filter(t => t.day === todayIndex).length === 0 ? 
                        '<span class="text-muted text-sm">No slots scheduled for today.</span>' :
                        data.timetable.filter(t => t.day === todayIndex).map(t => {
                            const checked = t.checked && t.checked[dateStr];
                            return `<div style="display:flex;align-items:center;gap:0.3rem;background:var(--bg);padding:0.1rem 0.6rem;border-radius:20px;border:1px solid ${checked?'#27ae60':'var(--border)'};">

                            </div>`;
                        }).join('')
                    }
                </div>

                <!-- Full Week Table -->
                <div class="table-wrap timetable-wrap mt-2">
                    <table class="timetable">
                        <thead>
                            <tr>
                                <th style="min-width:70px; z-index:25; background:var(--card-bg); border-right:2px solid var(--border);">⏰ Time</th>
                                ${days.map((d, i) => `
                                    <th class="${i === todayIndex ? 'col-today' : ''}" style="min-width:90px;">
                                        ${d.slice(0,3)}
                                        ${i === todayIndex ? '<span style="font-size:0.6rem;display:block;font-weight:400;opacity:0.8;">Today</span>' : ''}
                                    </th>
                                `).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${rows.map(row => `
                                <tr>
                                    <td class="time-col">${row.time}</td>
                                    ${row.slots.map((slot, idx) => {
                                        const dayIdx = idx;
                                        const isToday = dayIdx === todayIndex;
                                        const checked = slot && slot.checked && slot.checked[dateStr];
                                        const subjectColor = slot ? (data.subjects.find(s => s.id === slot.subjectId)?.color || 'var(--royal-purple)') : 'transparent';
                                        let slotHtml = '';
                                        if (slot) {
                                            slotHtml = `
                                                <div class="slot-content ${checked ? 'slot-done' : ''}">
                                                    <div class="slot-subject" style="border-left-color: ${subjectColor};">
                                                        ${slot.subject}

            `;

            return html;

        // ================================================================

        // Backup original

        // Pastel color classes
        const pastels = ['pastel-0', 'pastel-1', 'pastel-2', 'pastel-3', 'pastel-4',
            'pastel-5', 'pastel-6', 'pastel-7', 'pastel-8', 'pastel-9'
        ];
        const rotations = ['rot-1', 'rot-2', 'rot-3', 'rot-4', 'rot-5'];

        // New renderNotes function
        window.renderNotes = function() {
            const notes = data.notes.filter(n => !n.archived).sort((a, b) =>
                new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt)
            );

            let html = `
                <div class="flex-between">
                    <div>
                        <div class="page-title">📝 Notes</div>
                        <div class="page-subtitle">Your knowledge wall – click to edit, hover for actions.</div>

                </div>
                <div class="filter-bar" style="margin-bottom:1.5rem;">
                    <div class="filter-group">
                        <label>Subject</label>
                        <select id="notes-filter-subject" onchange="filterNotesWall()">
                            <option value="all">All Subjects</option>
                            ${data.subjects.filter(s => !s.archived).map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="filter-group">
                        <label>Tag</label>
                        <select id="notes-filter-extra" onchange="filterNotesWall()">
                            <option value="all">All Tags</option>
                            ${[...new Set(data.notes.flatMap(n => n.tags || []))].map(t => `<option value="${t}">${t}</option>`).join('')}
                        </select>
                    </div>
                    <div class="btn-clear">
                        <button class="btn btn-sm btn-ghost" onclick="document.getElementById('notes-filter-subject').value='all';document.getElementById('notes-filter-extra').value='all';filterNotesWall();">Clear Filters</button>
                    </div>
                </div>
                <div id="notes-wall-container"></div>
            `;

            // We'll render the wall after the container exists
            setTimeout(() => filterNotesWall(), 0);
            return html;
        };

        // Filter function for the wall
        window.filterNotesWall = function() {
            const container = document.getElementById('notes-wall-container');
            if (!container) return;

            const subject = document.getElementById('notes-filter-subject')?.value || 'all';
            const tag = document.getElementById('notes-filter-extra')?.value || 'all';

            let filtered = data.notes.filter(n => !n.archived);
            if (subject !== 'all') filtered = filtered.filter(n => n.subjectId === subject);
            if (tag !== 'all') filtered = filtered.filter(n => n.tags && n.tags.includes(tag));

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="notes-wall-empty">
                        <div class="icon">📝</div>
                        <div class="title">No notes match</div>
                        <div class="desc">Adjust filters or create a new note.</div>
                    </div>
                `;
                return;
            }

            // Build the wall
            let wallHtml = `<div class="notes-wall">`;
            filtered.forEach((n, index) => {
                // Choose pastel and rotation based on index (deterministic)
                const pastelClass = pastels[index % pastels.length];
                const rotClass = rotations[index % rotations.length];
                const subjectName = n.subjectId ? getSubjectName(n.subjectId) : 'General';
                const tagsHtml = (n.tags || []).map(t => `<span class="tag">${t}</span>`).join('');

                wallHtml += `
                    <div class="note-card ${pastelClass} ${rotClass} ${n.pinned ? 'pinned' : ''}"
                         data-id="${n.id}"
                         style="--rotation: ${((index % 5) - 2) * 0.5}deg;">
                        <div class="note-title">${n.title || 'Untitled'}</div>
                        <div class="note-content">${n.content ? n.content.slice(0, 200) + (n.content.length > 200 ? '…' : '') : ''}</div>
                        <div class="note-meta">
                            <span class="text-xs">${subjectName}</span>
                            <div class="note-tags">${tagsHtml}</div>
                            <div class="note-actions">
                                <button class="btn btn-ghost" onclick="editNote('${n.id}')" title="Edit">✏️</button>
                                <button class="btn btn-ghost" onclick="archiveNote('${n.id}')" title="Archive">📦</button>
                                <button class="btn btn-ghost" onclick="deleteNote('${n.id}')" title="Delete">🗑️</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            wallHtml += `</div>`;
            container.innerHTML = wallHtml;
        };

        // Override showAddNote to stay the same (no change needed)
        // But ensure that after adding a note, we refresh the wall.
        const originalAddNote = window.addNote;
        if (originalAddNote) {
            window.addNote = function() {
                const result = originalAddNote();
                // Re-render wall after save
                setTimeout(() => {
                    if (currentPage === 'notes') filterNotesWall();
                }, 100);
                return result;
            };
        }

        // Also override editNote save to refresh
        const originalSaveEditNote = window.saveEditNote;
        if (originalSaveEditNote) {
            window.saveEditNote = function(id) {
                const result = originalSaveEditNote(id);
                setTimeout(() => {
                    if (currentPage === 'notes') filterNotesWall();
                }, 100);
                return result;
            };
        }

        // Override deleteNote, archiveNote, unarchiveNote similarly
        const originalDeleteNote = window.deleteNote;
        if (originalDeleteNote) {
            window.deleteNote = function(id) {
                const result = originalDeleteNote(id);
                setTimeout(() => {
                    if (currentPage === 'notes') filterNotesWall();
                }, 100);
                return result;
            };
        }
        const originalArchiveNote = window.archiveNote;
        if (originalArchiveNote) {
            window.archiveNote = function(id) {
                const result = originalArchiveNote(id);
                setTimeout(() => {
                    if (currentPage === 'notes') filterNotesWall();
                }, 100);
                return result;

                const result = originalUnarchiveNote(id);
                setTimeout(() => {
                    if (currentPage === 'notes') filterNotesWall();
                }, 100);
                return result;
            };
        }

        console.log('✅ Notes Padlet Wall loaded!');

<script>
    (function() {
        'use strict';

        // ================================================================
        //  📚 BULK SYLLABUS BREAKDOWN — Parser & UI
        // ================================================================

        // --- Parse syllabus text into structured data ---
        function parseSyllabusText(text) {
            const lines = text.split('\n').filter(line => line.trim() !== '');
            const units = [];
            let currentUnit = null;
            let currentTopic = null;

            // Determine indentation level (spaces or tabs)
            function getIndentLevel(line) {
                const match = line.match(/^(\s*)/);
                return match ? match[1].length : 0;
            }

            // Remove bullet points, numbers, etc.
            function cleanText(str) {
                return str.replace(/^[\s•\-*•\d+.)]+\s*/, '').trim();
            }

            // Detect if line is a unit (level 0)
            // Assume unit if no indentation or indentation less than 2 spaces
            // Also allow explicit "Unit X:" pattern
            const unitRegex = /^unit\s+\d+[:.]/i;

            for (let i = 0; i < lines.length; i++) {
                const raw = lines[i];
                const indent = getIndentLevel(raw);
                const text = cleanText(raw);

                if (!text) continue;

                // Determine level based on indentation
                // Level 0: Unit (indent 0-1)
                // Level 1: Topic (indent 2-3)
                // Level 2: Concept (indent 4+)
                // Also handle explicit markers like "Topic:" "Concept:"
                const isUnit = unitRegex.test(raw) || indent <= 1;
                const isTopic = /^topic\s+[\d:.]/i.test(raw) || (indent >= 2 && indent <= 3);
                const isConcept = /^concept\s+[\d:.]/i.test(raw) || indent >= 4;

                if (isUnit) {
                    // Start new unit
                    const unitName = text.replace(/^unit\s+\d+[:.]\s*/i, '').trim() || text;
                    currentUnit = { id: genId(), name: unitName, topics: [] };
                    units.push(currentUnit);
                    currentTopic = null;
                } else if (isTopic && currentUnit) {
                    // Start new topic under current unit
                    const topicName = text.replace(/^topic\s+[\d:.]\s*/i, '').trim() || text;
                    currentTopic = { id: genId(), name: topicName, concepts: [] };
                    currentUnit.topics.push(currentTopic);
                } else if (isConcept && currentTopic) {
                    // Start new concept under current topic
                    const conceptName = text.replace(/^concept\s+[\d:.]\s*/i, '').trim() || text;
                    currentTopic.concepts.push({ id: genId(), name: conceptName, mastery: 'not_started', notes: '' });
                } else {
                    // If we can't classify, treat as concept if we have a topic, else topic if we have a unit
                    if (currentTopic) {
                        // Assume concept
                        const conceptName = text;
                        currentTopic.concepts.push({ id: genId(), name: conceptName, mastery: 'not_started', notes: '' });
                    } else if (currentUnit) {
                        // Assume topic
                        const topicName = text;
                        currentTopic = { id: genId(), name: topicName, concepts: [] };
                        currentUnit.topics.push(currentTopic);
                    } else {
                        // No unit yet? Treat as unit
                        currentUnit = { id: genId(), name: text, topics: [] };
                        units.push(currentUnit);
                        currentTopic = null;
                    }
                }
            }

            return units;
        }

        // --- Show Bulk Add Modal ---
        function showBulkAddSyllabus(subjectId) {
            const subjects = data.subjects.filter(s => !s.archived);
            const subjectOptions = subjects.map(s =>
                `<option value="${s.id}" ${s.id === subjectId ? 'selected' : ''}>${s.name}</option>`
            ).join('');

            const modalHtml = `
                <div class="modal-title">📚 Bulk Add Syllabus</div>
                <div class="modal-sub">Paste your syllabus outline below. The system will automatically create units, topics, and concepts.</div>

                <div class="form-group">
                    <label>Select Subject</label>
                    <select id="bulkSubject">${subjectOptions}</select>
                </div>

                <div class="form-group">
                    <label>Syllabus Outline</label>
                    <div class="format-hint">Use indentation (spaces or tabs) to indicate hierarchy:</div>
                    <div class="example-format">
                        Unit 1: Microeconomics
                          Topic 1: Elasticity
                            Concept: Price Elasticity of Demand
                            Concept: Income Elasticity
                          Topic 2: Supply and Demand
                        Unit 2: Macroeconomics
                          Topic 1: GDP
                            Concept: Calculation
                            Concept: Limitations
                    </div>
                    <textarea id="bulkSyllabusText" placeholder="Paste your syllabus outline here..."></textarea>
                </div>

                <div id="bulkParseStatus" class="parse-status"></div>

                <div class="form-actions">
                    <button class="btn" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="processBulkSyllabus()">Import Syllabus</button>
                </div>
            `;

            openModal(modalHtml);
            // Make modal larger
            document.querySelector('.modal-overlay .modal').classList.add('bulk-syllabus-modal');
        }

        // --- Process the bulk syllabus import ---
        function processBulkSyllabus() {
            const subjectId = document.getElementById('bulkSubject').value;
            const text = document.getElementById('bulkSyllabusText').value;
            const statusEl = document.getElementById('bulkParseStatus');

            if (!subjectId) {
                statusEl.className = 'parse-status error';
                statusEl.textContent = '❌ Please select a subject.';
                return;
            }

            if (!text.trim()) {
                statusEl.className = 'parse-status error';
                statusEl.textContent = '❌ Please paste your syllabus outline.';
                return;
            }

            // Parse the text
            const units = parseSyllabusText(text);

            if (units.length === 0) {
                statusEl.className = 'parse-status error';
                statusEl.textContent = '❌ No units found. Please check the format.';
                return;
            }

            // Count total items
            let totalTopics = 0,
                totalConcepts = 0;
            units.forEach(u => {
                totalTopics += u.topics.length;
                u.topics.forEach(t => totalConcepts += t.concepts.length);
            });

            // Confirm with user
            const confirmMsg =
                `📊 Found:\n• ${units.length} unit(s)\n• ${totalTopics} topic(s)\n• ${totalConcepts} concept(s)\n\nAdd to "${getSubjectName(subjectId)}"?`;
            if (!confirm(confirmMsg)) return;

            // Append to syllabus
            if (!data.syllabus[subjectId]) data.syllabus[subjectId] = [];

            // Merge: for each unit, check if it already exists by name, if so merge topics, else add new
            units.forEach(newUnit => {
                const existingUnit = data.syllabus[subjectId].find(u => u.name === newUnit.name);
                if (existingUnit) {
                    // Merge topics
                    newUnit.topics.forEach(newTopic => {
                        const existingTopic = existingUnit.topics.find(t => t.name === newTopic.name);
                        if (existingTopic) {
                            // Merge concepts
                            newTopic.concepts.forEach(newConcept => {
                                const existingConcept = existingTopic.concepts.find(c => c.name ===
                                    newConcept.name);
                                if (!existingConcept) {
                                    existingTopic.concepts.push(newConcept);
                                }
                            });
                        } else {
                            existingUnit.topics.push(newTopic);
                        }
                    });
                } else {
                    data.syllabus[subjectId].push(newUnit);
                }
            });

            // Save and close
            if (saveData()) {
                statusEl.className = 'parse-status success';
                statusEl.textContent = `✅ Successfully imported ${units.length} unit(s), ${totalTopics} topic(s), ${totalConcepts} concept(s)!`;
                setTimeout(() => {
                    closeModal();
                    renderPage('syllabus');
                }, 1500);
            } else {
                statusEl.className = 'parse-status error';
                statusEl.textContent = '❌ Failed to save data. Please try again.';
            }
        }

        // --- Override renderSyllabus to add Bulk Add button ---
        const originalRenderSyllabus = window.renderSyllabus;
        if (originalRenderSyllabus) {
            window.renderSyllabus = function() {
                const html = originalRenderSyllabus();

                // Inject the bulk add button into each subject card
                // We'll use a DOM approach: after rendering, add button to each subject card
                setTimeout(() => {
                    const subjectCards = document.querySelectorAll('#page-syllabus .card.mt-2');
                    subjectCards.forEach(card => {
                        // Find the flex-between div inside
                        const header = card.querySelector('.flex-between');
                        if (header) {
                            // Check if button already exists
                            if (header.querySelector('.bulk-add-btn')) return;
                            const bulkBtn = document.createElement('button');
                            bulkBtn.className = 'btn btn-sm btn-outline bulk-add-btn';
                            bulkBtn.textContent = '📚 Bulk Add';
                            bulkBtn.style.marginLeft = '0.5rem';
                            // Get subject id from the card (data-subject-id attribute)
                            // We need to find the subject name and look up id
                            const subName = card.querySelector('span[style*="font-weight:700;"]')?.textContent;
                            if (subName) {
                                const sub = data.subjects.find(s => s.name === subName);
                                if (sub) {
                                    bulkBtn.onclick = () => showBulkAddSyllabus(sub.id);
                                    header.appendChild(bulkBtn);
                                }
                            }
                        }
                    });
                }, 100);

                return html;
            };
        }

        // --- Add a global reference to the functions ---
        window.showBulkAddSyllabus = showBulkAddSyllabus;
        window.processBulkSyllabus = processBulkSyllabus;

        console.log('✅ Bulk Syllabus Breakdown loaded!');
    })();
</script>

<script>
    (function() {
        'use strict';

        // ================================================================
        //  📥 BULK YOUTUBE VIDEO IMPORT
        // ================================================================

        // Store fetched video data
        let bulkVideos = [];
        let bulkFetching = false;

        // --- Show bulk import modal ---
        window.showBulkAddVideos = function() {
            const subjects = data.subjects.filter(s => !s.archived);
            bulkVideos = [];

            openModal(`
                <div class="modal-title">📥 Bulk Import YouTube Videos</div>
                <div class="modal-sub">Paste multiple YouTube URLs and import them all at once.</div>

                <div class="form-group">
                    <label>YouTube URLs (one per line)</label>
                    <textarea id="bulkVideoUrls" rows="6" placeholder="https://www.youtube.com/watch?v=abc123&#10;https://youtu.be/xyz789&#10;https://www.youtube.com/watch?v=def456" style="font-family: monospace; font-size: 0.85rem;"></textarea>
                </div>

                <div class="form-group" style="display:flex; gap:0.8rem; flex-wrap:wrap;">
                    <div style="flex:1; min-width:150px;">
                        <label>Subject</label>
                        <select id="bulkVideoSubject">
                            <option value="">General</option>
                            ${subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}
                        </select>
                    </div>
                    <div style="flex:1; min-width:150px;">
                        <label>Watched Status</label>
                        <select id="bulkWatchedStatus">
                            <option value="false">Unwatched</option>
                            <option value="true">Watched</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions" style="gap:0.6rem; flex-wrap:wrap;">
                    <button class="btn btn-primary" onclick="fetchBulkVideos()" id="bulkFetchBtn">
                        🔍 Fetch Video Info
                    </button>
                    <button class="btn btn-outline" onclick="pasteFromClipboard()" id="bulkPasteBtn">
                        📋 Paste from Clipboard
                    </button>
                    <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
                </div>

                <div id="bulkProgressArea" style="display:none;">
                    <div class="bulk-progress">
                        <span id="bulkProgressText">Fetching...</span>
                        <div class="bar"><div class="fill" id="bulkProgressFill"></div></div>
                    </div>
                </div>

                <div id="bulkResultsArea" style="display:none; margin-top:0.5rem;">
                    <div class="flex-between" style="margin-bottom:0.3rem;">
                        <span style="font-weight:600;">📹 Found Videos</span>
                        <div class="bulk-stats" id="bulkStats">
                            <span>✅ <span id="bulkValidCount">0</span> valid</span>
                            <span>❌ <span id="bulkInvalidCount">0</span> invalid</span>
                        </div>
                    </div>
                    <div id="bulkVideoList" class="bulk-video-preview"></div>
                    <div class="form-actions" id="bulkImportActions" style="display:none; margin-top:0.8rem;">
                        <button class="btn btn-outline" onclick="selectAllBulkVideos()">✅ Select All</button>
                        <button class="btn btn-outline" onclick="deselectAllBulkVideos()">⬜ Deselect All</button>
                        <button class="btn btn-primary" onclick="importBulkVideos()">📥 Import Selected (<span id="bulkSelectedCount">0</span>)</button>
                    </div>
                </div>
            `);

            // Auto-focus the textarea
            setTimeout(() => {
                const ta = document.getElementById('bulkVideoUrls');
                if (ta) ta.focus();
            }, 300);
        };

        // --- Paste from clipboard ---
        window.pasteFromClipboard = async function() {
            try {
                const text = await navigator.clipboard.readText();
                const ta = document.getElementById('bulkVideoUrls');
                if (ta) {
                    // Append to existing content
                    if (ta.value.trim()) {
                        ta.value += '\n' + text;
                    } else {
                        ta.value = text;
                    }
                    ta.focus();
                    toast('📋 Pasted from clipboard!', 'success');
                }
            } catch (err) {
                toast('⚠️ Could not read clipboard. Please paste manually (Ctrl+V).', 'error');
            }
        };

        // --- Fetch video info for all URLs ---
        window.fetchBulkVideos = async function() {
            const ta = document.getElementById('bulkVideoUrls');
            const urls = ta.value.split('\n').map(s => s.trim()).filter(Boolean);
            if (urls.length === 0) {
                toast('⚠️ Please paste at least one YouTube URL.', 'error');
                return;
            }

            const progressArea = document.getElementById('bulkProgressArea');
            const progressText = document.getElementById('bulkProgressText');
            const progressFill = document.getElementById('bulkProgressFill');
            const resultsArea = document.getElementById('bulkResultsArea');

            progressArea.style.display = 'block';
            resultsArea.style.display = 'none';
            bulkFetching = true;

            const subjectId = document.getElementById('bulkVideoSubject').value || null;
            const watched = document.getElementById('bulkWatchedStatus').value === 'true';

            bulkVideos = [];
            let validCount = 0;
            let invalidCount = 0;

            for (let i = 0; i < urls.length; i++) {
                const url = urls[i];
                progressText.textContent = `Fetching ${i + 1}/${urls.length}: ${url.slice(0, 40)}...`;
                progressFill.style.width = `${((i + 1) / urls.length) * 100}%`;

                try {
                    const videoData = await fetchVideoInfo(url);
                    if (videoData) {
                        bulkVideos.push({
                            url: url,
                            title: videoData.title || 'Untitled',
                            thumbnail: videoData.thumbnail || null,
                            author: videoData.author || '',
                            valid: true,
                            selected: true,
                            subjectId: subjectId,
                            watched: watched,
                            videoId: videoData.videoId || null,
                        });
                        validCount++;
                    } else {
                        bulkVideos.push({
                            url: url,
                            title: 'Invalid URL',
                            valid: false,
                            selected: false,
                            subjectId: subjectId,
                            watched: watched,
                        });
                        invalidCount++;
                    }
                } catch (err) {
                    bulkVideos.push({
                        url: url,
                        title: 'Error fetching',
                        valid: false,
                        selected: false,
                        subjectId: subjectId,
                        watched: watched,
                    });
                    invalidCount++;
                }
            }

            bulkFetching = false;
            progressArea.style.display = 'none';
            resultsArea.style.display = 'block';

            document.getElementById('bulkValidCount').textContent = validCount;
            document.getElementById('bulkInvalidCount').textContent = invalidCount;

            renderBulkVideoList();
            updateBulkSelectedCount();

            if (validCount > 0) {
                document.getElementById('bulkImportActions').style.display = 'flex';
            }

            toast(`✅ Found ${validCount} valid videos, ${invalidCount} invalid.`, validCount > 0 ? 'success' : 'error');
        };

        // --- Fetch video info from YouTube oEmbed ---
        async function fetchVideoInfo(url) {
            // Extract video ID
            const videoId = extractYouTubeId(url);
            if (!videoId) return null;

            try {
                // Try oEmbed API first
                const oembedUrl =
                    `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`;
                const response = await fetch(oembedUrl);
                if (response.ok) {
                    const data = await response.json();
                    return {
                        title: data.title || 'Untitled',
                        thumbnail: data.thumbnail_url || `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
                        author: data.author_name || '',
                        videoId: videoId,
                    };
                }
            } catch (_) {}

            // Fallback: use thumbnail only
            return {
                title: 'Video',
                thumbnail: `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
                author: '',
                videoId: videoId,
            };
        }

        // --- Extract YouTube video ID ---
        function extractYouTubeId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /youtube\.com\/shorts\/([^&\n?#]+)/,
            ];
            for (const pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return null;
        }

        // --- Render bulk video list ---
        function renderBulkVideoList() {
            const container = document.getElementById('bulkVideoList');
            if (!container) return;

            container.innerHTML = bulkVideos.map((v, idx) => {
                const checked = v.selected ? 'checked' : '';
                const statusIcon = v.valid ? '✅' : '❌';
                const titleClass = v.valid ? '' : 'text-muted';
                const thumbHtml = v.thumbnail ?
                    `<img src="${v.thumbnail}" alt="Thumbnail" loading="lazy" />` :
                    '🎬';

                return `
                    <div class="video-item">
                        <div class="checkbox-wrap">
                            <input type="checkbox" ${checked} onchange="toggleBulkVideo(${idx})" ${v.valid ? '' : 'disabled'} />
                        </div>
                        <div class="thumb">${thumbHtml}</div>
                        <div class="info">
                            <div class="title ${titleClass}">${v.title}</div>
                            <div class="url">${v.url.slice(0, 50)}${v.url.length > 50 ? '…' : ''}</div>
                            ${v.author ? `<div style="font-size:0.6rem;color:var(--text-muted);">${v.author}</div>` : ''}
                        </div>
                        <div class="status">${statusIcon}</div>
                    </div>
                `;
            }).join('');

            updateBulkSelectedCount();
        }

        // --- Toggle individual video selection ---
        window.toggleBulkVideo = function(idx) {
            if (idx >= 0 && idx < bulkVideos.length && bulkVideos[idx].valid) {
                bulkVideos[idx].selected = !bulkVideos[idx].selected;
                renderBulkVideoList();
                updateBulkSelectedCount();
            }
        };

        // --- Select all valid videos ---
        window.selectAllBulkVideos = function() {
            bulkVideos.forEach(v => {
                if (v.valid) v.selected = true;
            });
            renderBulkVideoList();
            updateBulkSelectedCount();
            toast('✅ All valid videos selected', 'info');
        };

        // --- Deselect all videos ---
        window.deselectAllBulkVideos = function() {
            bulkVideos.forEach(v => {
                if (v.valid) v.selected = false;
            });
            renderBulkVideoList();
            updateBulkSelectedCount();
            toast('⬜ All videos deselected', 'info');
        };

        // --- Update selected count ---
        function updateBulkSelectedCount() {
            const count = bulkVideos.filter(v => v.selected).length;
            const el = document.getElementById('bulkSelectedCount');
            if (el) el.textContent = count;
        }

        // --- Import selected videos ---
        window.importBulkVideos = function() {
            const selected = bulkVideos.filter(v => v.selected && v.valid);
            if (selected.length === 0) {
                toast('⚠️ Please select at least one valid video to import.', 'error');
                return;
            }

            let imported = 0;
            selected.forEach(v => {
                const embedUrl = v.videoId ? `https://www.youtube.com/watch?v=${v.videoId}` : v.url;
                data.videos.push({
                    id: genId(),
                    title: v.title || 'Untitled',
                    url: embedUrl,
                    subjectId: v.subjectId || null,
                    watched: v.watched || false,
                    addedAt: new Date().toISOString(),
                    duration: '',
                    description: '',
                    notes: '',
                    rating: 0,
                });
                imported++;
            });

            if (saveData()) {
                toast(`✅ Imported ${imported} videos successfully!`, 'success');
                closeModal();
                if (currentPage === 'videos') {
                    renderPage('videos');
                } else {
                    navigate('videos');
                }
                playSound('success');
            }
        };

        // --- Add button to videos page ---
        const originalRenderVideos = window.renderVideos;
        if (originalRenderVideos) {
            window.renderVideos = function() {
                const html = originalRenderVideos();
                // Inject bulk import button next to "Add Video"
                // We'll do it via DOM manipulation after render
                setTimeout(() => {
                    const header = document.querySelector('#page-videos .flex-between');
                    if (header) {
                        const existing = header.querySelector('.btn-bulk-import');
                        if (!existing) {
                            const btn = document.createElement('button');
                            btn.className = 'btn btn-outline btn-bulk-import';
                            btn.innerHTML = '📥 Bulk Import';
                            btn.onclick = showBulkAddVideos;
                            btn.style.marginRight = '0.5rem';
                            header.querySelector('.btn-primary').before(btn);
                        }
                    }
                }, 50);
                return html;
            };
        }

        console.log('✅ Bulk YouTube Import loaded!');
    })();
</script>
</body>
</html>
