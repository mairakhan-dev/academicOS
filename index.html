<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O‑LEVEL COMMAND CENTER</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <style>
        /* ---------- Royal Theme ---------- */
        :root {
            --royal-purple: #4a2c6e;
            --royal-purple-light: #7a4ba8;
            --royal-purple-gradient: linear-gradient(135deg, #4a2c6e, #8a5fc4);
            --royal-gold: #c9a84c;
            --royal-gold-light: #f3edd6;
            --royal-gold-gradient: linear-gradient(135deg, #b89430, #e8c95a);
            --bg: #f8f6fc;
            --card: #ffffff;
            --text: #1d1b2a;
            --text-secondary: #4f4a6b;
            --text-muted: #8f8aa8;
            --border: #e4dfee;
            --shadow: 0 4px 24px rgba(74, 44, 110, 0.10);
            --shadow-hover: 0 8px 36px rgba(74, 44, 110, 0.18);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.2s cubic-bezier(0.2, 0, 0, 1);
            --sidebar-width: 260px;
            --font: 'Inter', -apple-system, system-ui, sans-serif;
            --font-serif: 'Playfair Display', serif;
        }
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            display: flex;
            min-height: 100vh;
        }
        a {
            color: var(--royal-purple);
            text-decoration: none;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
            background: none;
            color: inherit;
        }
        input,
        textarea,
        select {
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.9rem;
            width: 100%;
            transition: var(--transition);
        }
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--royal-purple);
            box-shadow: 0 0 0 3px rgba(74, 44, 110, 0.12);
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        select {
            appearance: auto;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: #d4c8e0;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--royal-purple-light);
        }
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            padding: 1.6rem 0.8rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
        }
        .sidebar-brand {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--royal-purple);
            padding: 0 0.8rem 1.8rem 0.8rem;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-serif);
            font-style: italic;
        }
        .sidebar-brand span {
            background: var(--royal-purple-gradient);
            color: #fff;
            font-size: 0.6rem;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            letter-spacing: 0.3px;
            font-style: normal;
            font-family: var(--font);
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .sidebar-nav .nav-item:hover {
            background: var(--royal-gold-light);
            color: var(--royal-purple);
        }
        .sidebar-nav .nav-item.active {
            background: var(--royal-purple-gradient);
            color: #fff;
            box-shadow: 0 2px 12px rgba(74, 44, 110, 0.3);
        }
        .sidebar-nav .nav-item .icon {
            font-size: 1.15rem;
            width: 1.6rem;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav .nav-item .label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0.8rem;
            display: flex;
            justify-content: space-between;
        }
        .main {
            flex: 1;
            min-width: 0;
            padding: 1.8rem 2.4rem 3rem 2.4rem;
            max-width: calc(100vw - var(--sidebar-width));
            overflow-y: auto;
            position: relative;
        }
        .page {
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(12px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .page-title {
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--royal-purple);
        }
        .page-subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.8rem;
        }
        .badge {
            display: inline-block;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: var(--royal-gold-light);
            color: #8a7020;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.2rem;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.2rem;
        }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1.2rem 1.4rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }
        .card-value {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .card-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .flex-between {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .mt-1 {
            margin-top: 0.5rem;
        }
        .mt-2 {
            margin-top: 1rem;
        }
        .mt-3 {
            margin-top: 1.5rem;
        }
        .text-muted {
            color: var(--text-muted);
        }
        .text-sm {
            font-size: 0.85rem;
        }
        .text-xs {
            font-size: 0.75rem;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            border: 1.5px solid transparent;
            background: var(--bg);
            color: var(--text-secondary);
        }
        .btn:hover {
            background: var(--border);
        }
        .btn-primary {
            background: var(--royal-purple-gradient);
            color: #fff;
            border-color: transparent;
        }
        .btn-primary:hover {
            box-shadow: 0 4px 16px rgba(74, 44, 110, 0.35);
            transform: translateY(-1px);
        }
        .btn-outline {
            background: transparent;
            border-color: var(--border);
            color: var(--text-secondary);
        }
        .btn-outline:hover {
            border-color: var(--royal-purple);
            color: var(--royal-purple);
        }
        .btn-gold {
            background: var(--royal-gold-gradient);
            color: #fff;
            border-color: transparent;
        }
        .btn-sm {
            padding: 0.25rem 0.8rem;
            font-size: 0.75rem;
        }
        .btn-danger {
            background: #e74c4c;
            color: #fff;
            border-color: #e74c4c;
        }
        .btn-danger:hover {
            background: #c0392b;
            border-color: #c0392b;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
        }
        .btn-ghost:hover {
            background: var(--bg);
        }
        .greeting {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.1rem;
        }
        .greeting-sub {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.4rem;
        }
        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 1rem;
            margin-bottom: 1.8rem;
        }
        .stat-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 0.9rem 1.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .stat-card .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: var(--text-muted);
            font-weight: 600;
        }
        .stat-card .value {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        .mission-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm);
            background: var(--bg);
            border-left: 4px solid var(--royal-purple);
            margin-bottom: 0.5rem;
            transition: var(--transition);
        }
        .mission-item:hover {
            background: var(--royal-gold-light);
        }
        .mission-item .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .mission-item .dot.red {
            background: #e74c4c;
        }
        .mission-item .dot.yellow {
            background: #f1c40f;
        }
        .mission-item .dot.green {
            background: #27ae60;
        }
        .mission-item .info {
            flex: 1;
        }
        .mission-item .info .title {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .mission-item .info .sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .mission-item .actions {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
        }
        .mission-item .actions .tag {
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            font-size: 0.65rem;
            font-weight: 500;
            background: var(--border);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .mission-item .actions .tag:hover {
            background: var(--royal-purple);
            color: #fff;
        }
        .subject-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }
        .subject-card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 1rem 1.2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }
        .subject-card:hover {
            border-color: var(--royal-purple);
            box-shadow: var(--shadow-hover);
        }
        .subject-card .color-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }
        .subject-card .name {
            font-weight: 600;
            font-size: 1rem;
            margin-top: 4px;
        }
        .subject-card .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.2rem;
        }
        .subject-card .progress {
            margin-top: 0.5rem;
            height: 4px;
            background: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }
        .subject-card .progress .bar {
            height: 100%;
            background: var(--royal-purple-gradient);
            border-radius: 4px;
            transition: width 0.6s ease;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal {
            background: var(--card);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.8rem 2rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            animation: modalIn 0.25s ease;
        }
        @keyframes modalIn {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal .modal-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--royal-purple);
        }
        .modal .modal-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1.2rem;
        }
        .modal .form-group {
            margin-bottom: 1rem;
        }
        .modal .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.8rem;
            margin-bottom: 0.2rem;
            color: var(--text-secondary);
        }
        .modal .form-actions {
            display: flex;
            gap: 0.6rem;
            justify-content: flex-end;
            margin-top: 1.2rem;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border);
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            background: var(--card);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        th {
            text-align: left;
            padding: 0.6rem 1rem;
            background: var(--bg);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: 0.6rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        .empty-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted);
        }
        .empty-state .icon {
            font-size: 2.8rem;
            margin-bottom: 0.5rem;
        }
        .empty-state .title {
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--text-secondary);
        }
        .empty-state .desc {
            font-size: 0.9rem;
            margin-top: 0.2rem;
        }
        .pill {
            display: inline-block;
            padding: 0.1rem 0.7rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 500;
        }
        .pill.purple {
            background: #ede6f6;
            color: var(--royal-purple);
        }
        .pill.green {
            background: #dff0e0;
            color: #1f6e2f;
        }
        .pill.red {
            background: #fce8e8;
            color: #b13a3a;
        }
        .pill.gold {
            background: var(--royal-gold-light);
            color: #8a7020;
        }
        .timer-display {
            font-size: 4rem;
            font-weight: 700;
            letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            text-align: center;
            padding: 0.5rem 0;
            color: var(--royal-purple);
        }
        .timer-controls {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tree-item {
            padding: 0.3rem 0 0.3rem 1.2rem;
            border-left: 2px solid var(--border);
            margin-left: 0.8rem;
        }
        .tree-item .node {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
        }
        .tree-item .node:hover {
            background: var(--bg);
        }
        .tree-item .node .mastery {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .tree-item .node .mastery.not_started {
            background: #e74c4c;
        }
        .tree-item .node .mastery.learning {
            background: #e67e22;
        }
        .tree-item .node .mastery.understanding {
            background: #f1c40f;
        }
        .tree-item .node .mastery.exam_ready {
            background: #3498db;
        }
        .tree-item .node .mastery.mastered {
            background: #27ae60;
        }
        .cal-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            text-align: center;
            font-size: 0.8rem;
        }
        .cal-grid .cal-header {
            font-weight: 600;
            color: var(--text-muted);
            padding: 0.2rem 0;
            font-size: 0.7rem;
        }
        .cal-grid .cal-day {
            padding: 0.3rem 0;
            border-radius: 4px;
            background: var(--bg);
            cursor: default;
        }
        .cal-grid .cal-day.has-event {
            background: var(--royal-gold-light);
            color: #8a7020;
            font-weight: 600;
        }
        .cal-grid .cal-day.other {
            color: var(--text-muted);
            opacity: 0.4;
        }
        .cal-grid .cal-day.today {
            background: var(--royal-purple);
            color: #fff;
            font-weight: 700;
        }
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--royal-purple-gradient);
            color: #fff;
            font-size: 2rem;
            box-shadow: 0 6px 24px rgba(74, 44, 110, 0.4);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .fab:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 32px rgba(74, 44, 110, 0.5);
        }
        .file-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            background: var(--bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }
        .file-card .file-icon {
            font-size: 1.8rem;
            color: var(--royal-purple);
        }
        .file-card .file-info {
            flex: 1;
        }
        .file-card .file-info .name {
            font-weight: 600;
        }
        .file-card .file-info .meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .file-card .file-actions {
            display: flex;
            gap: 0.4rem;
        }
        .toast-container {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: var(--card);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1.2rem;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            border-left: 4px solid var(--royal-purple);
            animation: slideIn 0.25s ease;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .toast.success {
            border-left-color: #27ae60;
        }
        .toast.error {
            border-left-color: #e74c4c;
        }
        @keyframes slideIn {
            0% {
                opacity: 0;
                transform: translateX(20px);
            }
            100% {
                opacity: 1;
                transform: translateX(0);
            }
        }
        .toast .close {
            margin-left: auto;
            cursor: pointer;
            opacity: 0.5;
            font-size: 1.1rem;
        }
        @media (max-width: 820px) {
            .sidebar {
                width: 68px;
                padding: 1rem 0.4rem;
            }
            .sidebar-brand span {
                display: none;
            }
            .sidebar-brand {
                font-size: 0.9rem;
                justify-content: center;
                padding: 0 0 1.2rem 0;
            }
            .sidebar-nav .nav-item .label {
                display: none;
            }
            .sidebar-nav .nav-item {
                justify-content: center;
                padding: 0.6rem;
            }
            .sidebar-nav .nav-item .icon {
                font-size: 1.3rem;
                width: auto;
            }
            .sidebar-footer {
                display: none;
            }
            .main {
                padding: 1.2rem 1.2rem 2rem 1.2rem;
                max-width: calc(100vw - 68px);
            }
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .grid-3 {
                grid-template-columns: 1fr 1fr;
            }
            .stat-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .fab {
                bottom: 1.2rem;
                right: 1.2rem;
                width: 48px;
                height: 48px;
                font-size: 1.6rem;
            }
        }
        @media (max-width: 480px) {
            .sidebar {
                width: 56px;
                padding: 0.6rem 0.2rem;
            }
            .sidebar-brand {
                font-size: 0.7rem;
                padding: 0 0 0.8rem 0;
            }
            .sidebar-nav .nav-item {
                padding: 0.5rem 0.3rem;
            }
            .sidebar-nav .nav-item .icon {
                font-size: 1.1rem;
            }
            .main {
                padding: 0.8rem 0.8rem 1.5rem 0.8rem;
                max-width: calc(100vw - 56px);
            }
            .page-title {
                font-size: 1.3rem;
            }
            .grid-3 {
                grid-template-columns: 1fr 1fr;
            }
            .stat-grid {
                grid-template-columns: 1fr 1fr;
            }
            .modal {
                padding: 1.2rem;
            }
            .subject-grid {
                grid-template-columns: 1fr 1fr;
            }
            .fab {
                bottom: 1rem;
                right: 1rem;
                width: 44px;
                height: 44px;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== SIDEBAR ===== -->
    <nav class="sidebar" id="sidebar" role="navigation">
        <div class="sidebar-brand">⚡ O-LEVEL <span>CC</span></div>
        <div class="sidebar-nav" id="navContainer"></div>
        <div class="sidebar-footer">
            <span id="sidebarUser">Maira</span>
            <span id="sidebarGrade">Grade 9</span>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="main" id="mainContent"></main>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- ===== FLOATING ADD BUTTON ===== -->
    <button class="fab" id="fabButton">+</button>

    <!-- ===== TOAST ===== -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ================================================================
        //  DATA LAYER
        // ================================================================

        const DB_KEY = 'olevel_cc_v5';

        function getDefaultData() {
            return {
                student: { name: 'Maira', grade: 'Grade 9', currentYear: '2026-2027', examYear: 'CIE 2027' },
                subjects: [
                    { id: 'subj1', name: 'Economics', grade: '9', color: '#6c3b9a', archived: false },
                    { id: 'subj2', name: 'Business', grade: '9', color: '#c9a84c', archived: false },
                    { id: 'subj3', name: 'Accounting', grade: '9', color: '#2d7d6f', archived: false },
                    { id: 'subj4', name: 'English', grade: '9', color: '#4a6fa5', archived: false },
                    { id: 'subj5', name: 'Mathematics', grade: '9', color: '#c0392b', archived: false },
                    { id: 'subj6', name: 'Urdu', grade: '9', color: '#8e44ad', archived: false },
                    { id: 'subj7', name: 'Islamiat', grade: '9', color: '#1a7a5a', archived: false },
                    { id: 'subj8', name: 'Pakistan Studies', grade: '9', color: '#2c3e50', archived: false },
                    { id: 'subj9', name: 'Global Perspectives', grade: '9', color: '#d35400', archived: false },
                    { id: 'subj10', name: 'Chemistry', grade: '10', color: '#1f7a8c', archived: false },
                    { id: 'subj11', name: 'Physics', grade: '10', color: '#b85c3a', archived: false },
                    { id: 'subj12', name: 'Computer Science', grade: '10', color: '#2d7d6f', archived: false },
                    { id: 'subj13', name: 'Additional Mathematics', grade: '11', color: '#8e44ad', archived: false },
                ],
                syllabus: {
                    'subj1': [{ id: 'u1', name: 'Microeconomics', topics: [{ id: 't1', name: 'Elasticity', concepts: [
                                { id: 'c1', name: 'Price Elasticity of Demand', mastery: 'understanding',
                                    notes: 'PED = %ΔQd / %ΔP' },
                            ] }] }]
                },
                notes: [],
                tasks: [],
                mistakes: [],
                flashcards: [],
                pastPapers: [],
                mockExams: [],
                activities: [],
                goals: [],
                stories: [],
                universities: [],
                essays: [],
                events: [],
                studySessions: [],
                settings: { theme: 'light', notifications: true },
                version: 5,
            };
        }

        let data = loadData();

        function loadData() {
            try {
                const raw = localStorage.getItem(DB_KEY);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    const def = getDefaultData();
                    for (const k in def) {
                        if (!(k in parsed)) parsed[k] = def[k];
                    }
                    if (!Array.isArray(parsed.pastPapers)) parsed.pastPapers = [];
                    return parsed;
                }
            } catch (_) {}
            return getDefaultData();
        }

        function saveData() {
            localStorage.setItem(DB_KEY, JSON.stringify(data));
        }

        function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

        function getSubject(id) { return data.subjects.find(s => s.id === id); }

        function getSubjectName(id) { const s = getSubject(id); return s ? s.name : 'Unknown'; }

        // ================================================================
        //  TOAST & MODAL
        // ================================================================

        function toast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.innerHTML =
                `<span>${msg}</span><span class="close" onclick="this.parentElement.remove()">✕</span>`;
            container.appendChild(el);
            setTimeout(() => { if (el.parentElement) el.remove(); }, 4000);
        }

        function openModal(html) {
            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('modalOverlay').classList.add('open');
        }

        function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        // ================================================================
        //  NAVIGATION
        // ================================================================

        const NAV_ITEMS = [
            { id: 'dashboard', icon: '🏠', label: 'Dashboard' },
            { id: 'subjects', icon: '📖', label: 'Subjects' },
            { id: 'syllabus', icon: '🗂️', label: 'Syllabus' },
            { id: 'notes', icon: '📝', label: 'Notes' },
            { id: 'tasks', icon: '✅', label: 'Tasks' },
            { id: 'mistakes', icon: '❌', label: 'Mistake Bank' },
            { id: 'flashcards', icon: '🃏', label: 'Flashcards' },
            { id: 'pastpapers', icon: '📄', label: 'Past Papers' },
            { id: 'timer', icon: '⏱️', label: 'Focus Timer' },
            { id: 'calendar', icon: '📅', label: 'Calendar' },
            { id: 'activities', icon: '🏆', label: 'Activities' },
            { id: 'goals', icon: '🎯', label: 'Goals' },
            { id: 'stories', icon: '📖', label: 'Story Bank' },
            { id: 'universities', icon: '🏛️', label: 'Universities' },
            { id: 'essays', icon: '✍️', label: 'Essays' },
            { id: 'settings', icon: '⚙️', label: 'Settings' },
        ];

        let currentPage = 'dashboard';

        function renderNav() {
            const container = document.getElementById('navContainer');
            container.innerHTML = NAV_ITEMS.map(item =>
                `<button class="nav-item ${item.id === currentPage ? 'active' : ''}" data-page="${item.id}">
              <span class="icon">${item.icon}</span>
              <span class="label">${item.label}</span>
            </button>`
            ).join('');
            container.querySelectorAll('.nav-item').forEach(btn => {
                btn.addEventListener('click', () => navigate(btn.dataset.page));
            });
            document.getElementById('sidebarUser').textContent = data.student.name || 'Maira';
            document.getElementById('sidebarGrade').textContent = data.student.grade || 'Grade 9';
        }

        function navigate(page) {
            currentPage = page;
            renderNav();
            renderPage(page);
            document.getElementById('mainContent').scrollTop = 0;
        }

        // ================================================================
        //  PAGE RENDERER
        // ================================================================

        function renderPage(page) {
            const main = document.getElementById('mainContent');
            main.querySelectorAll('.page').forEach(p => p.remove());
            const container = document.createElement('div');
            container.className = 'page active';
            container.id = `page-${page}`;
            switch (page) {
                case 'dashboard':
                    container.innerHTML = renderDashboard();
                    break;
                case 'subjects':
                    container.innerHTML = renderSubjects();
                    break;
                case 'syllabus':
                    container.innerHTML = renderSyllabus();
                    break;
                case 'notes':
                    container.innerHTML = renderNotes();
                    break;
                case 'tasks':
                    container.innerHTML = renderTasks();
                    break;
                case 'mistakes':
                    container.innerHTML = renderMistakes();
                    break;
                case 'flashcards':
                    container.innerHTML = renderFlashcards();
                    break;
                case 'pastpapers':
                    container.innerHTML = renderPastPapers();
                    break;
                case 'timer':
                    container.innerHTML = renderTimer();
                    break;
                case 'calendar':
                    container.innerHTML = renderCalendar();
                    break;
                case 'activities':
                    container.innerHTML = renderActivities();
                    break;
                case 'goals':
                    container.innerHTML = renderGoals();
                    break;
                case 'stories':
                    container.innerHTML = renderStories();
                    break;
                case 'universities':
                    container.innerHTML = renderUniversities();
                    break;
                case 'essays':
                    container.innerHTML = renderEssays();
                    break;
                case 'settings':
                    container.innerHTML = renderSettings();
                    break;
                default:
                    container.innerHTML = `<div class="page-title">${page}</div><p class="text-muted">Coming soon.</p>`;
            }
            main.appendChild(container);
            if (page === 'timer') initTimer();
            if (page === 'calendar') initCalendar();
        }

        // ================================================================
        //  DASHBOARD
        // ================================================================

        function renderDashboard() {
            const name = data.student.name || 'Maira';
            const grade = data.student.grade || 'Grade 9';
            const examYear = data.student.examYear || 'CIE 2027';
            const now = new Date();
            const day = now.toLocaleDateString('en-US', { weekday: 'long' });
            const totalSubjects = data.subjects.filter(s => !s.archived).length;
            const totalTasks = data.tasks.length;
            const pendingTasks = data.tasks.filter(t => t.status !== 'Completed').length;
            const totalPastPapers = data.pastPapers.length;
            const sessions = data.studySessions || [];
            const streak = sessions.length > 0 ? Math.min(sessions.length, 30) : 4;
            const missionTasks = data.tasks.filter(t => t.status !== 'Completed')
                .sort((a, b) => ({ high: 0, medium: 1, low: 2 } [a.priority] || 1) - ({ high: 0, medium: 1,
                    low: 2 } [b.priority] || 1))
                .slice(0, 5);
            const upcomingExams = data.events.filter(e => e.type === 'exam' && new Date(e.date) >= now)
                .sort((a, b) => new Date(a.date) - new Date(b.date)).slice(0, 3);
            const daysUntilExam = upcomingExams.length > 0 ? Math.ceil((new Date(upcomingExams[0].date) - now) / (1000 *
                60 * 60 * 24)) : '—';
            const recentMistakes = data.mistakes.slice(-3).reverse();

            return `
            <div class="greeting">Good ${now.getHours()<12?'morning':now.getHours()<17?'afternoon':'evening'}, ${name} 👋</div>
            <div class="greeting-sub">${day} · ${grade} · ${examYear}</div>
            <div class="stat-grid">
              <div class="stat-card"><div class="label">Grade</div><div class="value">${grade}</div></div>
              <div class="stat-card"><div class="label">Exam Year</div><div class="value">${examYear}</div></div>
              <div class="stat-card"><div class="label">Days to Next Exam</div><div class="value">${daysUntilExam}</div></div>
              <div class="stat-card"><div class="label">Study Streak</div><div class="value">🔥 ${streak} days</div></div>
            </div>
            <div class="flex-between" style="margin-bottom:0.8rem;">
              <h2 style="font-size:1.2rem;font-weight:700;">🎯 Today's Mission</h2>
              <button class="btn btn-sm btn-primary" onclick="navigate('tasks')">View All →</button>
            </div>
            ${missionTasks.length === 0 ? `<div class="empty-state"><div class="icon">✅</div><div class="title">All caught up!</div><div class="desc">No pending tasks.</div></div>` : missionTasks.map(t => {
              const color = t.priority === 'high' ? 'red' : t.priority === 'medium' ? 'yellow' : 'green';
              return `<div class="mission-item"><span class="dot ${color}"></span><div class="info"><div class="title">${t.title}</div><div class="sub">${t.subjectId?getSubjectName(t.subjectId):'General'} · ${t.priority||'medium'}</div></div><div class="actions"><span class="tag" onclick="toast('📖 Learn: ${t.title}')">Learn</span><span class="tag" onclick="toast('📝 Notes')">Notes</span><span class="tag" onclick="toast('📝 Practice')">Practice</span><span class="tag" onclick="toast('🔄 Review')">Review</span></div></div>`;
            }).join('')}
            <div class="grid-3 mt-3">
              <div class="card"><div class="card-title">📚 Subjects</div><div class="card-value">${totalSubjects}</div><div class="card-label">Active</div></div>
              <div class="card"><div class="card-title">✅ Tasks</div><div class="card-value">${pendingTasks}/${totalTasks}</div><div class="card-label">Pending / Total</div></div>
              <div class="card"><div class="card-title">📄 Past Papers</div><div class="card-value">${totalPastPapers}</div><div class="card-label">Uploaded</div></div>
            </div>
            ${recentMistakes.length>0?`<div class="mt-3"><h3 style="font-weight:600;font-size:1rem;margin-bottom:0.4rem;">⚠️ Recent Mistakes</h3>${recentMistakes.map(m=>`<div class="mission-item" style="border-left-color:#e74c4c;"><span class="dot red"></span><div class="info"><div class="title">${m.question||'Mistake'}</div><div class="sub">${m.subjectId?getSubjectName(m.subjectId):'General'} · ${m.type||'Other'} · ${new Date(m.date).toLocaleDateString()}</div></div><span class="pill red">${m.type||'Other'}</span></div>`).join('')}</div>`:''}
          `;
        }

        // ================================================================
        //  SUBJECTS (compact)
        // ================================================================

        function renderSubjects() {
            const active = data.subjects.filter(s => !s.archived);
            const archived = data.subjects.filter(s => s.archived);
            return `
            <div class="flex-between"><div><div class="page-title">📖 Subjects</div><div class="page-subtitle">Manage subjects across grades.</div></div><button class="btn btn-primary" onclick="showAddSubject()">+ Add Subject</button></div>
            <div class="mt-2"><div class="card"><div style="font-weight:600;margin-bottom:0.5rem;">Grade 9</div><div class="subject-grid">${active.filter(s=>s.grade==='9').map(s=>subjectCardHtml(s)).join('')}</div></div>
            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">Grade 10 & 11</div><div class="subject-grid">${active.filter(s=>s.grade!=='9').map(s=>subjectCardHtml(s)).join('')||'<div class="text-muted text-sm">No subjects assigned to Grade 10 or 11 yet.</div>'}</div></div>
            ${archived.length?`<div class="card mt-2" style="opacity:0.6;"><div style="font-weight:600;margin-bottom:0.5rem;">Archived</div><div class="subject-grid">${archived.map(s=>subjectCardHtml(s,true)).join('')}</div></div>`:''}
          `;
        }

        function subjectCardHtml(s, archived = false) {
            const count = data.notes.filter(n => n.subjectId === s.id).length + data.tasks.filter(t => t.subjectId === s.id)
                .length;
            return `<div class="subject-card"><div class="color-bar" style="background:${s.color||'#6c3b9a'}"></div><div class="name">${s.name}</div><div class="meta">${s.grade?'Grade '+s.grade:''} · ${archived?'Archived':''} · ${count} items</div><div class="progress"><div class="bar" style="width:${Math.min(30+Math.random()*50,85)}%"></div></div><div style="display:flex;gap:0.3rem;margin-top:0.4rem;flex-wrap:wrap;"><button class="btn btn-sm btn-ghost" onclick="editSubject('${s.id}')">✏️</button><button class="btn btn-sm btn-ghost" onclick="archiveSubject('${s.id}')">${archived?'Unarchive':'Archive'}</button><button class="btn btn-sm btn-danger" onclick="deleteSubject('${s.id}')">🗑️</button></div></div>`;
        }

        function showAddSubject() {
            openModal(`
            <div class="modal-title">➕ Add Subject</div>
            <div class="form-group"><label>Name</label><input id="subName" placeholder="e.g. Computer Science" /></div>
            <div class="form-group"><label>Grade</label><select id="subGrade">${['9','10','11'].map(g=>`<option value="${g}">Grade ${g}</option>`).join('')}</select></div>
            <div class="form-group"><label>Color</label><input id="subColor" type="color" value="#6c3b9a" style="width:60px;height:40px;padding:2px;" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addSubject()">Add</button></div>
          `);
        }

        function addSubject() {
            const name = document.getElementById('subName').value.trim();
            if (!name) { toast('Name required.', 'error'); return; }
            data.subjects.push({ id: genId(), name, grade: document.getElementById('subGrade').value, color: document
                    .getElementById('subColor').value, archived: false });
            saveData();
            closeModal();
            toast('✅ Subject added', 'success');
            renderPage('subjects');
        }

        function editSubject(id) {
            const s = getSubject(id);
            if (!s) return;
            openModal(`
            <div class="modal-title">✏️ Edit Subject</div>
            <div class="form-group"><label>Name</label><input id="editSubName" value="${s.name}" /></div>
            <div class="form-group"><label>Grade</label><select id="editSubGrade">${['9','10','11'].map(g=>`<option value="${g}" ${g===s.grade?'selected':''}>Grade ${g}</option>`).join('')}</select></div>
            <div class="form-group"><label>Color</label><input id="editSubColor" type="color" value="${s.color||'#6c3b9a'}" style="width:60px;height:40px;padding:2px;" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditSubject('${id}')">Save</button></div>
          `);
        }

        function saveEditSubject(id) {
            const s = getSubject(id);
            if (!s) return;
            const name = document.getElementById('editSubName').value.trim();
            if (!name) { toast('Name required.', 'error'); return; }
            s.name = name;
            s.grade = document.getElementById('editSubGrade').value;
            s.color = document.getElementById('editSubColor').value;
            saveData();
            closeModal();
            toast('✅ Subject updated', 'success');
            renderPage('subjects');
        }

        function archiveSubject(id) {
            const s = getSubject(id);
            if (s) { s.archived = !s.archived;
                saveData();
                toast(s.archived ? '📦 Archived' : '📂 Unarchived', 'info');
                renderPage('subjects'); }
        }

        function deleteSubject(id) {
            if (!confirm('Delete this subject and all related data?')) return;
            data.subjects = data.subjects.filter(s => s.id !== id);
            data.notes = data.notes.filter(n => n.subjectId !== id);
            data.tasks = data.tasks.filter(t => t.subjectId !== id);
            data.mistakes = data.mistakes.filter(m => m.subjectId !== id);
            delete data.syllabus[id];
            saveData();
            toast('🗑️ Subject deleted', 'info');
            renderPage('subjects');
        }

        // ================================================================
        //  SYLLABUS (compact)
        // ================================================================

        function renderSyllabus() {
            const subjects = data.subjects.filter(s => !s.archived);
            if (!subjects.length) return `<div class="page-title">🗂️ Syllabus</div><div class="empty-state"><div class="icon">📚</div><div class="title">No subjects</div><div class="desc">Add a subject first.</div></div>`;
            let html = `<div class="page-title">🗂️ Syllabus</div><div class="page-subtitle">Break down subjects into units, topics, and concepts.</div>`;
            subjects.forEach(sub => {
                const syllabus = data.syllabus[sub.id] || [];
                const totalConcepts = syllabus.reduce((acc, u) => acc + u.topics.reduce((a, t) => a + (t.concepts ? t
                    .concepts.length : 0), 0), 0);
                const mastered = syllabus.reduce((acc, u) => acc + u.topics.reduce((a, t) => a + (t.concepts ? t
                    .concepts.filter(c => c.mastery === 'mastered').length : 0), 0), 0);
                const pct = totalConcepts > 0 ? Math.round(mastered / totalConcepts * 100) : 0;
                html += `<div class="card mt-2"><div class="flex-between"><div><span style="font-weight:700;">${sub.name}</span><span class="badge">${pct}% complete</span></div><button class="btn btn-sm btn-primary" onclick="addSyllabusUnit('${sub.id}')">+ Unit</button></div><div class="mt-1">${syllabus.length===0?'<div class="text-muted text-sm">No units yet.</div>':''}${syllabus.map((unit,ui)=>`<div style="margin-top:0.3rem;padding:0.3rem 0.5rem;background:var(--bg);border-radius:var(--radius-sm);"><div class="flex-between"><span style="font-weight:600;">${unit.name}</span><div><button class="btn btn-sm btn-ghost" onclick="addSyllabusTopic('${sub.id}',${ui})">+ Topic</button><button class="btn btn-sm btn-ghost" onclick="editSyllabusUnit('${sub.id}',${ui})">✏️</button><button class="btn btn-sm btn-ghost" onclick="deleteSyllabusUnit('${sub.id}',${ui})">🗑️</button></div></div>${unit.topics&&unit.topics.length?unit.topics.map((topic,ti)=>`<div class="tree-item"><div class="node"><span>📌</span><span style="font-weight:500;">${topic.name}</span><span style="font-size:0.7rem;color:var(--text-muted);">${topic.concepts?topic.concepts.length:0} concepts</span><button class="btn btn-sm btn-ghost" onclick="addSyllabusConcept('${sub.id}',${ui},${ti})" style="margin-left:auto;">+ Concept</button><button class="btn btn-sm btn-ghost" onclick="editSyllabusTopic('${sub.id}',${ui},${ti})">✏️</button><button class="btn btn-sm btn-ghost" onclick="deleteSyllabusTopic('${sub.id}',${ui},${ti})">🗑️</button></div>${topic.concepts&&topic.concepts.length?topic.concepts.map((concept,ci)=>`<div class="tree-item"><div class="node"><span class="mastery ${concept.mastery||'not_started'}"></span><span>${concept.name}</span><span class="pill ${concept.mastery||'not_started'}">${concept.mastery||'Not Started'}</span><button class="btn btn-sm btn-ghost" onclick="editSyllabusConcept('${sub.id}',${ui},${ti},${ci})" style="margin-left:auto;">✏️</button><button class="btn btn-sm btn-ghost" onclick="deleteSyllabusConcept('${sub.id}',${ui},${ti},${ci})">🗑️</button></div></div>`).join(''):'<div class="text-muted text-xs" style="padding-left:1.2rem;">No concepts.</div>'}</div>`).join(''):'<div class="text-muted text-xs" style="padding-left:0.8rem;">No topics.</div>'}</div>`).join('')}</div></div>`;
            });
            return html;
        }

        function getSyllabus(subId) { if (!data.syllabus[subId]) data.syllabus[subId] = []; return data.syllabus[subId]; }

            openModal(`
            <div class="modal-title">📄 Upload Past Paper</div>

            const fileInput = document.getElementById('ppFile');

                fileInput.onchange = function(e) {

                        pendingFileUpload = this.files[0];
                    } else {
                        pendingFileUpload = null;
                    }
                };
                // If the user has already selected a file before the listener is attached, check it.
                if (fileInput.files && fileInput.files.length > 0) {
                    pendingFileUpload = fileInput.files[0];
                }
            }

        function addPastPaper() {
            const title = document.getElementById('ppTitle').value.trim() || 'Untitled';
            const subjectId = document.getElementById('ppSubject').value || null;
            const year = document.getElementById('ppYear').value.trim() || null;
            const session = document.getElementById('ppSession').value.trim() || null;
            const paperNumber = document.getElementById('ppPaperNumber').value.trim() || null;
            const notes = document.getElementById('ppNotes').value.trim() || '';

            // Use the stored file reference, or get it fresh from the DOM
            let file = pendingFileUpload;
            if (!file) {
                const fileInput = document.getElementById('ppFile');
                if (fileInput && fileInput.files && fileInput.files.length > 0) {
                    file = fileInput.files[0];
                }
            }

            if (!file) {
                toast('Please select a file to upload.', 'error');
                return;
            }

            // Disable the upload button to prevent double-clicks
            const uploadBtn = document.getElementById('uploadBtn');
            if (uploadBtn) { uploadBtn.disabled = true;
                uploadBtn.textContent = 'Uploading...'; }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const base64 = e.target.result.split(',')[1];
                    data.pastPapers.push({
                        id: genId(),
                        title,
                        subjectId,
                        year,
                        session,
                        paperNumber,
                        fileName: file.name,
                        fileType: file.type,
                        fileSize: file.size,
                        fileData: base64,
                        notes,
                        uploadedAt: new Date().toISOString(),
                    });
                    saveData();
                    closeModal();
                    toast('✅ Past paper uploaded!', 'success');
                    renderPage('pastpapers');
                } catch (err) {
                    toast('Error processing file: ' + err.message, 'error');
                    if (uploadBtn) { uploadBtn.disabled = false;
                        uploadBtn.textContent = 'Upload'; }
                }
            };
            reader.onerror = function() {
                toast('Error reading file.', 'error');
                if (uploadBtn) { uploadBtn.disabled = false;
                    uploadBtn.textContent = 'Upload'; }
            };
            reader.readAsDataURL(file);
        }

        let timerState = { running: false, mode: 'pomodoro', timeLeft: 25 * 60, total: 25 * 60, interval: null };

        function renderTimer() {
            return `
            <div class="page-title">⏱️ Focus Timer</div>
            <div class="page-subtitle">Pomodoro for study sessions.</div>
            <div class="card" style="max-width:480px;margin:0 auto;">
              <div class="timer-display" id="timerDisplay">25:00</div>
              <div style="display:flex;gap:0.3rem;justify-content:center;flex-wrap:wrap;margin-bottom:0.8rem;">
                <button class="btn btn-sm ${timerState.mode==='pomodoro'?'btn-primary':'btn-outline'}" onclick="setTimerMode('pomodoro')">Pomodoro</button>
                <button class="btn btn-sm ${timerState.mode==='short'?'btn-primary':'btn-outline'}" onclick="setTimerMode('short')">Short Break</button>
                <button class="btn btn-sm ${timerState.mode==='long'?'btn-primary':'btn-outline'}" onclick="setTimerMode('long')">Long Break</button>
              </div>
              <div class="timer-controls">
                <button class="btn ${timerState.running?'btn-gold':'btn-primary'}" onclick="toggleTimer()">${timerState.running?'⏸️ Pause':'▶️ Start'}</button>
                <button class="btn btn-outline" onclick="resetTimer()">↺ Reset</button>
              </div>
              <div class="mt-2 text-sm text-muted text-center">${timerState.running?'Focus...':'Ready'}</div>
            </div>
            <div class="mt-3"><div class="card"><div style="font-weight:600;">📊 Today's Study Time</div><div style="font-size:1.2rem;">${Math.floor((data.studySessions||[]).reduce((a,s)=>a+(s.duration||0),0)/60)}h ${(data.studySessions||[]).reduce((a,s)=>a+(s.duration||0),0)%60}m</div><div class="text-muted text-sm">${(data.studySessions||[]).length} sessions</div></div></div>
          `;
        }

        function setTimerMode(mode) {
            if (timerState.running) toggleTimer();
            const durations = { pomodoro: 25 * 60, short: 5 * 60, long: 15 * 60 };
            timerState.mode = mode;
            timerState.timeLeft = durations[mode] || 25 * 60;
            timerState.total = timerState.timeLeft;
            updateTimerDisplay();
            renderPage('timer');
        }

        function toggleTimer() {
            if (timerState.running) { clearInterval(timerState.interval);
                timerState.running = false;
                renderPage('timer'); return; }
            timerState.running = true;
            timerState.interval = setInterval(() => {
                timerState.timeLeft--;
                updateTimerDisplay();
                if (timerState.timeLeft <= 0) {
                    clearInterval(timerState.interval);
                    timerState.running = false;
                    toast('⏰ Timer finished!', 'success');
                    const duration = timerState.total - timerState.timeLeft;
                    if (!data.studySessions) data.studySessions = [];
                    data.studySessions.push({ id: genId(), subject: null, topic: null, date: new Date()
                            .toISOString(), duration: Math.round(duration / 60), pomodoros: 1 });
                    saveData();
                    renderPage('timer');
                }
            }, 1000);
            renderPage('timer');
        }

        function resetTimer() {
            clearInterval(timerState.interval);
            timerState.running = false;
            const durations = { pomodoro: 25 * 60, short: 5 * 60, long: 15 * 60 };
            timerState.timeLeft = durations[timerState.mode] || 25 * 60;
            timerState.total = timerState.timeLeft;
            updateTimerDisplay();
            renderPage('timer');
        }

        function updateTimerDisplay() {
            const el = document.getElementById('timerDisplay');
            if (el) {
                const mins = Math.floor(timerState.timeLeft / 60);
                const secs = timerState.timeLeft % 60;
                el.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
            }
        }

        function initTimer() { updateTimerDisplay(); }

        function renderCalendar() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const events = data.events.filter(e => { const d = new Date(e.date); return d.getMonth() === month && d
                    .getFullYear() === year; });
            const eventDates = new Set(events.map(e => new Date(e.date).getDate()));
            let daysHtml = '';
            for (let i = 0; i < firstDay; i++) daysHtml += `<div class="cal-day other"></div>`;
            for (let d = 1; d <= daysInMonth; d++) {
                const isToday = d === now.getDate();
                const hasEvent = eventDates.has(d);
                daysHtml +=
                    `<div class="cal-day ${isToday?'today':''} ${hasEvent?'has-event':''}">${d}</div>`;
            }
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September',
                'October', 'November', 'December'
            ];
            return `
            <div class="page-title">📅 Calendar</div>
            <div class="page-subtitle">Exams, deadlines, and events.</div>
            <div class="card" style="max-width:600px;">
              <div style="font-weight:600;font-size:1.1rem;text-align:center;margin-bottom:0.5rem;">${monthNames[month]} ${year}</div>
              <div class="cal-grid"><div class="cal-header">Sun</div><div class="cal-header">Mon</div><div class="cal-header">Tue</div><div class="cal-header">Wed</div><div class="cal-header">Thu</div><div class="cal-header">Fri</div><div class="cal-header">Sat</div>${daysHtml}</div>
            </div>
            <div class="mt-2">
              <div class="flex-between"><span style="font-weight:600;">📌 Upcoming</span><button class="btn btn-sm btn-primary" onclick="showAddEvent()">+ Add Event</button></div>
              ${data.events.filter(e=>new Date(e.date)>=now).sort((a,b)=>new Date(a.date)-new Date(b.date)).slice(0,6).map(e=>`<div class="mission-item" style="border-left-color:${e.type==='exam'?'#e74c4c':e.type==='deadline'?'#f1c40f':'#6c3b9a'};"><span class="dot ${e.type==='exam'?'red':e.type==='deadline'?'yellow':'green'}"></span><div class="info"><div class="title">${e.title}</div><div class="sub">${new Date(e.date).toLocaleDateString()} · ${e.type||'event'}</div></div><button class="btn btn-sm btn-ghost" onclick="deleteEvent('${e.id}')">🗑️</button></div>`).join('')}
              ${data.events.filter(e=>new Date(e.date)>=now).length===0?'<div class="text-muted text-sm mt-1">No upcoming events.</div>':''}
            </div>
          `;
        }

        function showAddEvent() {

                essays.forEach(e => {
                    html +=
                        `<div class="card"><div style="font-weight:600;font-size:1.05rem;">${e.title}</div><div class="text-sm text-muted">${e.type||'Essay'} · ${e.wordLimit||'—'} words · ${e.deadline?new Date(e.deadline).toLocaleDateString():'No deadline'}</div><div class="text-sm mt-1">${e.prompt?e.prompt.slice(0,100)+(e.prompt.length>100?'...':''):''}</div><div style="display:flex;gap:0.3rem;margin-top:0.4rem;"><span class="badge">${e.drafts?e.drafts.length:0} drafts</span><button class="btn btn-sm btn-ghost" onclick="editEssay('${e.id}')">✏️</button><button class="btn btn-sm btn-danger" onclick="deleteEssay('${e.id}')">🗑️</button></div></div>`;
                });
                html += `</div>`;
            }
            return html;
        }

        function showAddEssay() {
            openModal(`
            <div class="modal-title">✍️ New Essay</div>
            <div class="form-group"><label>Title</label><input id="essayTitle" /></div>
            <div class="form-group"><label>Type</label><select id="essayType"><option value="Personal Statement">Personal Statement</option><option value="Supplemental">Supplemental</option><option value="Why Major">Why Major</option><option value="Why University">Why University</option><option value="Community">Community/Identity</option><option value="Short Answer">Short Answer</option><option value="Other">Other</option></select></div>
            <div class="form-group"><label>Prompt</label><textarea id="essayPrompt" rows="2"></textarea></div>
            <div class="form-group"><label>Word Limit</label><input id="essayWordLimit" type="number" /></div>
            <div class="form-group"><label>Deadline</label><input id="essayDeadline" type="date" /></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addEssay()">Create</button></div>
          `);
        }

        function addEssay() {
            const title = document.getElementById('essayTitle').value.trim();
            if (!title) { toast('Title required.', 'error'); return; }
            data.essays.push({ id: genId(), title, type: document.getElementById('essayType').value, prompt: document
                    .getElementById('essayPrompt').value || '', wordLimit: parseInt(document.getElementById(
                    'essayWordLimit').value) || null, deadline: document.getElementById('essayDeadline').value ||
                    null, drafts: [''], notes: '', feedback: '', finalVersion: null, universityId: null,
                createdAt: new Date().toISOString() });
            saveData();
            closeModal();
            toast('✅ Essay created', 'success');
            renderPage('essays');
        }

        function editEssay(id) {
            const e = data.essays.find(e => e.id === id);
            if (!e) return;
            openModal(`
            <div class="modal-title">✍️ Edit Essay</div>
            <div class="form-group"><label>Title</label><input id="editEssayTitle" value="${e.title}" /></div>
            <div class="form-group"><label>Type</label><select id="editEssayType">${['Personal Statement','Supplemental','Why Major','Why University','Community/Identity','Short Answer','Other'].map(t=>`<option value="${t}" ${t===e.type?'selected':''}>${t}</option>`).join('')}</select></div>
            <div class="form-group"><label>Prompt</label><textarea id="editEssayPrompt" rows="2">${e.prompt||''}</textarea></div>
            <div class="form-group"><label>Word Limit</label><input id="editEssayWordLimit" type="number" value="${e.wordLimit||''}" /></div>
            <div class="form-group"><label>Deadline</label><input id="editEssayDeadline" type="date" value="${e.deadline||''}" /></div>
            <div class="form-group"><label>Latest Draft</label><textarea id="editEssayDraft" rows="4">${e.drafts&&e.drafts.length?e.drafts[e.drafts.length-1]:''}</textarea></div>
            <div class="form-group"><label>Notes</label><textarea id="editEssayNotes" rows="2">${e.notes||''}</textarea></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="saveEditEssay('${id}')">Save</button></div>
          `);
        }

        function saveEditEssay(id) {
            const e = data.essays.find(e => e.id === id);
            if (!e) return;
            e.title = document.getElementById('editEssayTitle').value.trim() || 'Essay';
            e.type = document.getElementById('editEssayType').value;
            e.prompt = document.getElementById('editEssayPrompt').value || '';
            e.wordLimit = parseInt(document.getElementById('editEssayWordLimit').value) || null;
            e.deadline = document.getElementById('editEssayDeadline').value || null;
            const draft = document.getElementById('editEssayDraft').value;
            if (draft) { if (!e.drafts) e.drafts = [];
                e.drafts.push(draft); if (e.drafts.length > 20) e.drafts.shift(); }
            e.notes = document.getElementById('editEssayNotes').value || '';
            saveData();
            closeModal();
            toast('✅ Essay updated', 'success');
            renderPage('essays');
        }

        function deleteEssay(id) { if (!confirm('Delete this essay?')) return; data.essays = data.essays.filter(e => e.id !==
                id);
            saveData();
            toast('🗑️ Deleted', 'info');
            renderPage('essays'); }

        // ================================================================
        //  SETTINGS
        // ================================================================

        function renderSettings() {
            return `
            <div class="page-title">⚙️ Settings</div>
            <div class="page-subtitle">Manage profile, data, and preferences.</div>
            <div class="card"><div style="font-weight:600;margin-bottom:0.5rem;">👤 Student Profile</div>
              <div class="form-group"><label>Name</label><input id="settingsName" value="${data.student.name||'Maira'}" /></div>
              <div class="form-group"><label>Grade</label><input id="settingsGrade" value="${data.student.grade||'Grade 9'}" /></div>
              <div class="form-group"><label>Academic Year</label><input id="settingsYear" value="${data.student.currentYear||'2026-2027'}" /></div>
              <div class="form-group"><label>Exam Year</label><input id="settingsExamYear" value="${data.student.examYear||'CIE 2027'}" /></div>
              <button class="btn btn-primary" onclick="saveSettings()">Save Profile</button>
            </div>
            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">💾 Data Management</div>
              <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
                <button class="btn btn-outline" onclick="exportData()">📤 Export</button>
                <button class="btn btn-outline" onclick="document.getElementById('importInput').click()">📥 Import</button>
                <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importData(event)" />
                <button class="btn btn-danger" onclick="resetData()">⚠️ Reset All</button>
              </div>
            </div>
            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">📊 Stats</div>
              <div class="text-sm text-muted">Subjects: ${data.subjects.length} · Notes: ${data.notes.length} · Tasks: ${data.tasks.length} · Mistakes: ${data.mistakes.length} · Flashcards: ${data.flashcards.length} · Activities: ${data.activities.length} · Goals: ${data.goals.length} · Stories: ${data.stories.length} · Universities: ${data.universities.length} · Essays: ${data.essays.length} · Past Papers: ${data.pastPapers.length}</div>
              <div class="text-xs text-muted mt-1">Data version: v${data.version||1} · Last saved: ${new Date().toLocaleString()}</div>
            </div>
          `;
        }

        function saveSettings() {
            data.student.name = document.getElementById('settingsName').value.trim() || 'Maira';
            data.student.grade = document.getElementById('settingsGrade').value.trim() || 'Grade 9';
            data.student.currentYear = document.getElementById('settingsYear').value.trim() || '2026-2027';
            data.student.examYear = document.getElementById('settingsExamYear').value.trim() || 'CIE 2027';
            saveData();
            toast('✅ Settings saved', 'success');
            renderPage('settings');
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `olevel_cc_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            toast('📤 Exported', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => { try { const imported = JSON.parse(e.target.result); if (imported.subjects) { data =
                        imported;
                    saveData();
                    toast('✅ Imported', 'success');
                    renderPage('settings');
                    navigate('dashboard'); } else { toast('Invalid file.', 'error'); } } catch (_) { toast(
                        'Error reading file.', 'error'); } };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetData() {
            if (!confirm('⚠️ Erase ALL data? This is irreversible.')) return;
            data = getDefaultData();
            saveData();
            toast('🗑️ Reset to defaults', 'info');
            renderPage('settings');
            navigate('dashboard');
        }

        // ================================================================
        //  FLOATING ADD BUTTON
        // ================================================================

        document.getElementById('fabButton').addEventListener('click', () => {
            const options = [
                { label: 'New Note', action: 'showAddNote()' },
                { label: 'New Task', action: 'showAddTask()' },
                { label: 'New Mistake', action: 'showAddMistake()' },
                { label: 'New Flashcard', action: 'showAddFlashcard()' },
                { label: 'New Past Paper', action: 'showAddPastPaper()' },
                { label: 'New Activity', action: 'showAddActivity()' },
                { label: 'New Goal', action: 'showAddGoal()' },
                { label: 'New Story', action: 'showAddStory()' },
                { label: 'New University', action: 'showAddUniversity()' },
                { label: 'New Essay', action: 'showAddEssay()' },
                { label: 'New Event', action: 'showAddEvent()' },
            ];
            let html =
                `<div class="modal-title">✨ Quick Add</div><div class="modal-sub">Choose what to create.</div><div style="display:flex;flex-direction:column;gap:0.4rem;">`;
            options.forEach(opt => {
                html +=
                    `<button class="btn btn-ghost" style="justify-content:flex-start;padding:0.6rem 0.8rem;" onclick="closeModal();${opt.action}">${opt.label}</button>`;
            });
            html += `</div><div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button></div>`;
            openModal(html);
        });

        // ================================================================
        //  INIT
        // ================================================================

        renderNav();
        renderPage('dashboard');
        saveData();

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'D') { e.preventDefault();
                navigate('dashboard'); }
        });

        console.log('🚀 O‑LEVEL COMMAND CENTER — Royal Edition (fixed upload)');
        console.log(`📊 ${data.subjects.length} subjects, ${data.notes.length} notes, ${data.tasks.length} tasks, ${data.pastPapers.length} past papers.`);
    </script>

</body>
</html>
