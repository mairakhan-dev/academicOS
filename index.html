<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>O‑LEVEL COMMAND CENTER — ULTIMATE</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet" />
    <style>
        /* ==============================================================
           ULTIMATE THEME — Glassmorphism + Royal + Customizable
           ============================================================== */
        :root {
            --royal-purple: #6c3b9a;
            --royal-purple-light: #8a5fc4;
            --royal-purple-gradient: linear-gradient(135deg, #6c3b9a, #9b6fd4);
            --royal-gold: #c9a84c;
            --royal-gold-light: #f3edd6;
            --royal-gold-gradient: linear-gradient(135deg, #b89430, #e8c95a);
            --bg: #f0edf8;
            --card-bg: rgba(255, 255, 255, 0.75);
            --card-border: rgba(255, 255, 255, 0.3);
            --text: #1d1b2a;
            --text-secondary: #4f4a6b;
            --text-muted: #8f8aa8;
            --shadow: 0 8px 32px rgba(108, 59, 154, 0.12);
            --shadow-hover: 0 12px 48px rgba(108, 59, 154, 0.20);
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.2, 0, 0, 1);
            --sidebar-width: 260px;
            --font: 'Inter', -apple-system, system-ui, sans-serif;
            --font-serif: 'Playfair Display', serif;
            --accent: #6c3b9a;
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(255, 255, 255, 0.4);
        }
        .dark {
            --bg: #181625;
            --card-bg: rgba(30, 26, 50, 0.8);
            --card-border: rgba(255, 255, 255, 0.08);
            --text: #ece8f5;
            --text-secondary: #b8b0d0;
            --text-muted: #8f8aa8;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 48px rgba(0, 0, 0, 0.6);
            --glass-bg: rgba(20, 18, 35, 0.7);
            --glass-border: rgba(255, 255, 255, 0.05);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            min-height: 100vh;
            transition: background 0.4s, color 0.3s;
            backdrop-filter: blur(2px);
        }
        /* scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 8px;
            opacity: 0.6;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--royal-purple-light);
        }

        /* ----- Sidebar with glass effect ----- */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            border-right: 1px solid var(--glass-border);
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            padding: 1.6rem 0.8rem;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            transition: background 0.3s, border-color 0.3s;
        }
        .sidebar-brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            padding: 0 0.8rem 1.8rem 0.8rem;
            letter-spacing: -0.4px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: var(--font-serif);
            font-style: italic;
        }
        .sidebar-brand span {
            background: var(--royal-purple-gradient);
            color: #fff;
            font-size: 0.6rem;
            padding: 0.15rem 0.7rem;
            border-radius: 20px;
            letter-spacing: 0.3px;
            font-style: normal;
            font-family: var(--font);
        }
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.15rem;
        }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.6rem 0.9rem;
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            backdrop-filter: blur(4px);
        }
        .sidebar-nav .nav-item:hover {
            background: rgba(108, 59, 154, 0.10);
            color: var(--accent);
            transform: translateX(4px);
        }
        .sidebar-nav .nav-item.active {
            background: var(--royal-purple-gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(108, 59, 154, 0.3);
        }
        .sidebar-nav .nav-item .icon {
            font-size: 1.15rem;
            width: 1.6rem;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-nav .nav-item .label {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .sidebar-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--glass-border);
            font-size: 0.75rem;
            color: var(--text-muted);
            padding: 0.8rem;
            display: flex;
            justify-content: space-between;
            backdrop-filter: blur(4px);
        }

        /* ----- Main content ----- */
        .main {
            flex: 1;
            min-width: 0;
            padding: 1.8rem 2.4rem 3rem 2.4rem;
            max-width: calc(100vw - var(--sidebar-width));
            overflow-y: auto;
            position: relative;
        }
        .page {
            display: none;
            animation: fadeSlide 0.4s ease;
        }
        .page.active {
            display: block;
        }
        @keyframes fadeSlide {
            0% { opacity: 0; transform: translateY(16px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        /* ----- Glass cards ----- */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px) saturate(180%);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 1.2rem 1.4rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-4px);
            border-color: rgba(108, 59, 154, 0.2);
        }
        .card-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 0.2rem;
        }
        .card-value {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: var(--royal-purple-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .card-value.normal {
            -webkit-text-fill-color: var(--text);
        }

        /* ----- Buttons with glass ----- */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1.2rem;
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            border: 1px solid transparent;
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
            color: var(--text-secondary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(108, 59, 154, 0.15);
        }
        .btn-primary {
            background: var(--royal-purple-gradient);
            color: #fff;
            border: none;
        }
        .btn-primary:hover {
            box-shadow: 0 8px 28px rgba(108, 59, 154, 0.35);
        }
        .btn-outline {
            background: transparent;
            border-color: var(--card-border);
        }
        .btn-outline:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .btn-gold {
            background: var(--royal-gold-gradient);
            color: #fff;
        }
        .btn-gold:hover {
            box-shadow: 0 8px 28px rgba(184, 148, 48, 0.35);
        }
        .btn-danger {
            background: #e74c4c;
            color: #fff;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-sm {
            padding: 0.25rem 0.8rem;
            font-size: 0.75rem;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text-secondary);
            border: none;
            backdrop-filter: none;
            box-shadow: none;
        }
        .btn-ghost:hover {
            background: rgba(108, 59, 154, 0.08);
            transform: translateY(0);
        }

        /* ----- Filter bar (glass) ----- */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: center;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            padding: 0.8rem 1.2rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            margin-bottom: 1.2rem;
            box-shadow: var(--shadow);
        }
        .filter-bar .filter-group {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .filter-bar .filter-group label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .filter-bar select, .filter-bar input {
            padding: 0.3rem 0.6rem;
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            font-size: 0.8rem;
            min-width: 120px;
            color: var(--text);
        }
        .filter-bar select:focus, .filter-bar input:focus {
            border-color: var(--accent);
            outline: none;
            box-shadow: 0 0 0 3px rgba(108,59,154,0.15);
        }
        .filter-bar .btn-clear {
            margin-left: auto;
        }

        /* ----- Drag & Drop styling ----- */
        .draggable-item {
            cursor: grab;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .draggable-item:active {
            cursor: grabbing;
        }
        .draggable-item.dragging {
            opacity: 0.5;
            transform: scale(0.95);
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }
        .drop-zone {
            border: 2px dashed var(--accent);
            border-radius: var(--radius-sm);
            padding: 0.5rem;
            margin: 0.3rem 0;
            background: rgba(108, 59, 154, 0.05);
            transition: background 0.2s;
        }
        .drop-zone.drag-over {
            background: rgba(108, 59, 154, 0.15);
        }

        /* ----- Misc ----- */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2rem; }
        .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.2rem; }
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        .mt-1 { margin-top: 0.5rem; }
        .mt-2 { margin-top: 1rem; }
        .mt-3 { margin-top: 1.5rem; }
        .text-muted { color: var(--text-muted); }
        .text-sm { font-size: 0.85rem; }
        .text-xs { font-size: 0.75rem; }
        .pill { display: inline-block; padding: 0.1rem 0.7rem; border-radius: 20px; font-size: 0.7rem; font-weight: 500; }
        .pill.purple { background: rgba(108,59,154,0.15); color: var(--accent); }
        .pill.green { background: rgba(39,174,96,0.15); color: #1f6e2f; }
        .pill.red { background: rgba(231,76,60,0.15); color: #b13a3a; }
        .pill.gold { background: var(--royal-gold-light); color: #8a7020; }
        .pill.blue { background: rgba(52,152,219,0.15); color: #1f4f8a; }

        /* ----- Toast ----- */
        .toast-container { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 2000; display: flex; flex-direction: column; gap: 0.6rem; max-width: 380px; width: 100%; }
        .toast { background: var(--card-bg); backdrop-filter: blur(12px); border-radius: var(--radius-sm); padding: 0.8rem 1.2rem; box-shadow: var(--shadow-hover); border-left: 4px solid var(--accent); animation: slideIn 0.25s ease; font-size: 0.9rem; display: flex; align-items: center; gap: 0.6rem; }
        .toast.success { border-left-color: #27ae60; }
        .toast.error { border-left-color: #e74c4c; }
        .toast.warning { border-left-color: #f1c40f; }
        @keyframes slideIn { 0% { opacity: 0; transform: translateX(20px); } 100% { opacity: 1; transform: translateX(0); } }
        .toast .close { margin-left: auto; cursor: pointer; opacity: 0.5; font-size: 1.1rem; }

        /* ----- FAB ----- */
        .fab {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--royal-purple-gradient);
            color: #fff;
            font-size: 2.2rem;
            box-shadow: 0 8px 32px rgba(108, 59, 154, 0.4);
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 12px 48px rgba(108, 59, 154, 0.5); }

        /* ----- Responsive ----- */
        @media (max-width: 820px) {
            .sidebar { width: 68px; padding: 1rem 0.4rem; }
            .sidebar-brand span { display: none; }
            .sidebar-brand { font-size: 0.9rem; justify-content: center; padding: 0 0 1.2rem 0; }
            .sidebar-nav .nav-item .label { display: none; }
            .sidebar-nav .nav-item { justify-content: center; padding: 0.6rem; }
            .sidebar-nav .nav-item .icon { font-size: 1.3rem; width: auto; }
            .sidebar-footer { display: none; }
            .main { padding: 1.2rem 1.2rem 2rem 1.2rem; max-width: calc(100vw - 68px); }
            .grid-2 { grid-template-columns: 1fr; }
            .grid-3 { grid-template-columns: 1fr 1fr; }
            .grid-4 { grid-template-columns: 1fr 1fr; }
            .stat-grid { grid-template-columns: repeat(2, 1fr); }
            .fab { bottom: 1.2rem; right: 1.2rem; width: 48px; height: 48px; font-size: 1.6rem; }
            .filter-bar { flex-direction: column; align-items: stretch; }
            .filter-bar .btn-clear { margin-left: 0; }
        }
        @media (max-width: 480px) {
            .sidebar { width: 56px; padding: 0.6rem 0.2rem; }
            .sidebar-brand { font-size: 0.7rem; padding: 0 0 0.8rem 0; }
            .sidebar-nav .nav-item { padding: 0.5rem 0.3rem; }
            .sidebar-nav .nav-item .icon { font-size: 1.1rem; }
            .main { padding: 0.8rem 0.8rem 1.5rem 0.8rem; max-width: calc(100vw - 56px); }
            .page-title { font-size: 1.3rem; }
            .grid-3, .grid-4 { grid-template-columns: 1fr 1fr; }
            .stat-grid { grid-template-columns: 1fr 1fr; }
            .modal { padding: 1.2rem; }
            .subject-grid { grid-template-columns: 1fr 1fr; }
            .fab { bottom: 1rem; right: 1rem; width: 44px; height: 44px; font-size: 1.4rem; }
        }

        /* ----- Additional polish ----- */
        .glow-text {
            text-shadow: 0 0 40px rgba(108, 59, 154, 0.15);
        }
        .stat-card .value {
            font-size: 2rem;
        }
        .quote-box {
            background: var(--glass-bg);
            backdrop-filter: blur(8px);
            border-radius: var(--radius-sm);
            padding: 1rem 1.4rem;
            font-style: italic;
            border-left: 4px solid var(--accent);
            margin-bottom: 1rem;
            border: 1px solid var(--card-border);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            max-width: 100%;
            background: #000;
            border-radius: var(--radius-sm);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .file-card {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            background: var(--glass-bg);
            border-radius: var(--radius-sm);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(4px);
        }
        .file-card .file-icon { font-size: 1.8rem; color: var(--accent); }
        .file-card .file-info { flex: 1; }
        .file-card .file-info .name { font-weight: 600; }
        .file-card .file-info .meta { font-size: 0.75rem; color: var(--text-muted); }
        .file-card .file-actions { display: flex; gap: 0.4rem; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .modal-overlay.open { display: flex; }
        .modal {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.8rem 2rem;
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--card-border);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn { 0% { opacity: 0; transform: scale(0.96) translateY(12px); } 100% { opacity: 1; transform: scale(1) translateY(0); } }
        .modal .modal-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.2rem; font-family: var(--font-serif); font-style: italic; color: var(--accent); }
        .modal .modal-sub { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.2rem; }
        .modal .form-group { margin-bottom: 1rem; }
        .modal .form-group label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 0.2rem; color: var(--text-secondary); }
        .modal .form-actions { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.2rem; padding-top: 0.8rem; border-top: 1px solid var(--card-border); }
        input, textarea, select {
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(4px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-sm);
            padding: 0.65rem 0.9rem;
            width: 100%;
            transition: var(--transition);
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108,59,154,0.15);
        }
        .table-wrap {
            overflow-x: auto;
            border-radius: var(--radius);
            border: 1px solid var(--card-border);
            background: var(--glass-bg);
            backdrop-filter: blur(4px);
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 0.6rem 1rem; background: rgba(0,0,0,0.03); font-weight: 600; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.3px; color: var(--text-muted); border-bottom: 1px solid var(--card-border); }
        td { padding: 0.6rem 1rem; border-bottom: 1px solid var(--card-border); vertical-align: middle; }
        tr:last-child td { border-bottom: none; }
        .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--text-muted); }
        .empty-state .icon { font-size: 2.8rem; margin-bottom: 0.5rem; }
        .empty-state .title { font-weight: 600; font-size: 1.1rem; color: var(--text-secondary); }
        .empty-state .desc { font-size: 0.9rem; margin-top: 0.2rem; }

        /* ----- Custom color picker ----- */
        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .color-picker-wrapper input[type="color"] {
            width: 50px;
            height: 50px;
            padding: 2px;
            border-radius: 50%;
            border: 2px solid var(--card-border);
            cursor: pointer;
            background: transparent;
        }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: none;
            border-radius: 50%;
        }

        /* ----- Animations for achievements ----- */
        .achievement-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--royal-gold);
            border-radius: var(--radius-sm);
            padding: 1rem 1.5rem;
            box-shadow: var(--shadow-hover);
            z-index: 3000;
            animation: slideDown 0.5s ease;
            display: flex;
            align-items: center;
            gap: 1rem;
            max-width: 350px;
        }
        @keyframes slideDown {
            0% { opacity: 0; transform: translateY(-40px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .achievement-popup .icon { font-size: 2rem; }
        .achievement-popup .text { font-weight: 600; }
        .achievement-popup .sub { font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>
    <!-- ===== SIDEBAR ===== -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">⚡ O-LEVEL <span>CC</span></div>
        <div class="sidebar-nav" id="navContainer"></div>
        <div class="sidebar-footer">
            <span id="sidebarUser">Maira</span>
            <span id="sidebarGrade">Grade 9</span>
        </div>
    </nav>

    <!-- ===== MAIN ===== -->
    <main class="main" id="mainContent"></main>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalContent"></div>
    </div>

    <!-- ===== FAB ===== -->
    <button class="fab" id="fabButton">+</button>

    <!-- ===== TOAST ===== -->

        // ----- IndexedDB for files -----
        const DB_NAME = 'olevel_files_db';
        const STORE_NAME = 'files';

        function openFileDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id' });
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveFile(id, fileData, metadata) {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put({ id, fileData, metadata, uploadedAt: new Date().toISOString() });
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        async function getFile(id) {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function deleteFile(id) {
            const db = await openFileDB();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(id);
                tx.oncomplete = () => resolve();
                tx.onerror = () => reject(tx.error);
            });
        }

        // ================================================================
        //  SOUND EFFECTS (Web Audio)
        // ================================================================

        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playSound(type = 'click') {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                gain.gain.value = 0.08;
                if (type === 'click') {
                    osc.frequency.value = 600;
                    osc.type = 'sine';
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'success') {
                    osc.frequency.setValueAtTime(523, ctx.currentTime);
                    osc.frequency.setValueAtTime(659, ctx.currentTime + 0.1);
                    osc.frequency.setValueAtTime(784, ctx.currentTime + 0.2);
                    osc.type = 'sine';
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'achievement') {
                    osc.frequency.setValueAtTime(880, ctx.currentTime);
                    osc.frequency.setValueAtTime(1108, ctx.currentTime + 0.15);
                    osc.type = 'square';
                    gain.gain.value = 0.04;
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'error') {
                    osc.frequency.value = 200;
                    osc.type = 'sawtooth';
                    gain.gain.value = 0.06;
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.2);
                } else if (type === 'drag') {
                    osc.frequency.value = 400;
                    osc.type = 'sine';
                    gain.gain.value = 0.03;
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.05);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.05);
                }
            } catch (e) { /* ignore audio errors */ }
        }

        // ================================================================
        //  DRAG AND DROP (for notes and tasks)
        // ================================================================

        function initDragAndDrop() {
            // We'll attach drag events to draggable items on the current page
            const items = document.querySelectorAll('.draggable-item');
            items.forEach(item => {
                item.setAttribute('draggable', 'true');
                item.addEventListener('dragstart', handleDragStart);
                item.addEventListener('dragend', handleDragEnd);
            });
            const dropZones = document.querySelectorAll('.drop-zone');
            dropZones.forEach(zone => {
                zone.addEventListener('dragover', handleDragOver);
                zone.addEventListener('dragenter', handleDragEnter);
                zone.addEventListener('dragleave', handleDragLeave);
                zone.addEventListener('drop', handleDrop);
            });
        }

        let draggedItem = null;

        function handleDragStart(e) {
            draggedItem = this;
            this.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', this.dataset.id);
            playSound('drag');
        }

        function handleDragEnd(e) {
            this.classList.remove('dragging');
            document.querySelectorAll('.drop-zone').forEach(z => z.classList.remove('drag-over'));
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
        }

        function handleDragEnter(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            this.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            const id = e.dataTransfer.getData('text/plain');
            if (!id || !draggedItem) return;
            // Determine which list we're in
            const parentList = this.closest('.drop-zone') || this;
            const targetId = parentList.dataset.listId;
            if (!targetId) return;
            // Reorder logic: we need to know if we're reordering notes or tasks
            // We'll implement a generic reorder: move the item before the drop target
            const dropTarget = this.closest('.draggable-item');
            if (!dropTarget || dropTarget === draggedItem) return;
            // Get the container
            const container = draggedItem.parentNode;
            const items = Array.from(container.querySelectorAll('.draggable-item'));
            const draggedIndex = items.indexOf(draggedItem);
            const dropIndex = items.indexOf(dropTarget);
            if (draggedIndex < dropIndex) {
                container.insertBefore(draggedItem, dropTarget.nextSibling);
            } else {
                container.insertBefore(draggedItem, dropTarget);
            }
            // Update data order (assume tasks or notes)
            const listId = container.dataset.listId; // 'notes' or 'tasks'
            if (listId === 'notes') {
                const noteIds = Array.from(container.querySelectorAll('.draggable-item')).map(el => el.dataset.id);
                // Reorder data.notes based on this order
                const newNotes = [];
                noteIds.forEach(id => {
                    const note = data.notes.find(n => n.id === id);
                    if (note) newNotes.push(note);
                });
                // Add any remaining notes not in the list (shouldn't happen)
                data.notes.forEach(n => {
                    if (!newNotes.find(nn => nn.id === n.id)) newNotes.push(n);
                });
                data.notes = newNotes;
            } else if (listId === 'tasks') {
                const taskIds = Array.from(container.querySelectorAll('.draggable-item')).map(el => el.dataset.id);
                const newTasks = [];
                taskIds.forEach(id => {
                    const task = data.tasks.find(t => t.id === id);
                    if (task) newTasks.push(task);
                });
                data.tasks.forEach(t => {
                    if (!newTasks.find(tt => tt.id === t.id)) newTasks.push(t);
                });
                data.tasks = newTasks;
            }
            saveData();
            toast('✅ Reordered!', 'success');
            // Re-render the page to reflect order
            renderPage(currentPage);
        }

        function applyTheme() {
            const settings = data.settings || { darkMode: false, accentColor: '#6c3b9a', fontSize: 16 };
            if (settings.darkMode) {
                document.body.classList.add('dark');
            } else {
                document.body.classList.remove('dark');
            }
            if (settings.accentColor) {
                document.documentElement.style.setProperty('--accent', settings.accentColor);
                document.documentElement.style.setProperty('--royal-purple', settings.accentColor);
                // Update gradients
                const color = settings.accentColor;
                const lighter = adjustColor(color, 30);
                document.documentElement.style.setProperty('--royal-purple-gradient', `linear-gradient(135deg, ${color}, ${lighter})`);
            }
            if (settings.fontSize) {
                document.documentElement.style.fontSize = settings.fontSize + 'px';
            }
        }

        function adjustColor(hex, percent) {
            // Simple lighten/darken
            let r = parseInt(hex.slice(1,3), 16);
            let g = parseInt(hex.slice(3,5), 16);
            let b = parseInt(hex.slice(5,7), 16);
            r = Math.min(255, r + percent);
            g = Math.min(255, g + percent);
            b = Math.min(255, b + percent);
            return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
        }

            ${missionTasks.length === 0 ? `<div class="empty-state"><div class="icon">✅</div><div class="title">All caught up!</div><div class="desc">No pending tasks.</div></div>` : missionTasks.map(t => {
              const color = t.priority === 'high' ? 'red' : t.priority === 'medium' ? 'yellow' : 'green';
              return `<div class="mission-item"><span class="dot ${color}"></span><div class="info"><div class="title">${t.title}</div><div class="sub">${t.subjectId?getSubjectName(t.subjectId):'General'} · ${t.priority||'medium'}</div></div><div class="actions"><span class="tag" onclick="toast('📖 Learn: ${t.title}')">Learn</span><span class="tag" onclick="toast('📝 Notes')">Notes</span><span class="tag" onclick="toast('📝 Practice')">Practice</span><span class="tag" onclick="toast('🔄 Review')">Review</span></div></div>`;
            }).join('')}
            <div class="grid-4 mt-3">
              <div class="card"><div class="card-title">📚 Subjects</div><div class="card-value normal">${totalSubjects}</div><div class="card-label">Active</div></div>
              <div class="card"><div class="card-title">✅ Tasks</div><div class="card-value normal">${pendingTasks}/${totalTasks}</div><div class="card-label">Pending / Total</div></div>
              <div class="card"><div class="card-title">📄 Past Papers</div><div class="card-value normal">${totalPastPapers}</div><div class="card-label">Uploaded</div></div>
              <div class="card"><div class="card-title">🎥 Videos</div><div class="card-value normal">${totalVideos}</div><div class="card-label">Saved</div></div>
            </div>
          `;
        }

        // ================================================================
        //  ATTENDANCE (unchanged from previous, but with glass)
        // ================================================================

        function renderAttendance() {
            const now = new Date();
            const dateStr = now.toISOString().split('T')[0];
            const todayChecked = data.attendance[dateStr] || false;
            const days = [];
            for (let i = 29; i >= 0; i--) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const ds = d.toISOString().split('T')[0];
                days.push({ date: ds, day: d.getDate(), month: d.toLocaleString('en', { month: 'short' }), present: data.attendance[ds] || false });
            }
            const totalPresent = Object.values(data.attendance).filter(v => v === true).length;
            const totalDays = Object.keys(data.attendance).length;
            const pct = totalDays > 0 ? Math.round((totalPresent / totalDays) * 100) : 0;
            return `
            <div class="flex-between">
              <div><div class="page-title">📋 Attendance</div><div class="page-subtitle">Check in daily to track your consistency.</div></div>
              <button class="btn ${todayChecked?'btn-gold':'btn-primary'}" onclick="toggleAttendance()">${todayChecked?'✅ Checked In':'☑️ Check In Today'}</button>
            </div>
            <div class="grid-3 mt-2">
              <div class="card"><div class="card-title">Total Check-ins</div><div class="card-value normal">${totalPresent}</div><div class="card-label">Days present</div></div>
              <div class="card"><div class="card-title">Attendance Rate</div><div class="card-value normal">${pct}%</div><div class="card-label">${totalDays} total days</div></div>
              <div class="card"><div class="card-title">Current Streak</div><div class="card-value normal">🔥 ${calculateStreak()}</div><div class="card-label">Consecutive days</div></div>
            </div>
            <div class="card mt-2">
              <div style="font-weight:600;margin-bottom:0.5rem;">Last 30 Days</div>
              <div class="attendance-heatmap">
                ${days.map(d => `<div class="day ${d.present?'present':'absent'}" title="${d.date}">${d.day}</div>`).join('')}
              </div>
              <div class="text-xs text-muted mt-1">🟢 Present · 🔴 Absent</div>
            </div>
          `;
        }

        function toggleAttendance() {
            const dateStr = new Date().toISOString().split('T')[0];
            data.attendance[dateStr] = !data.attendance[dateStr];
            if (saveData()) {
                toast(data.attendance[dateStr] ? '✅ Checked in! Keep it up!' : '⏳ Check-in removed.', 'info');
                renderPage('attendance');
                if (data.attendance[dateStr]) playSound('success');
            }
        }

        function calculateStreak() {
            const now = new Date();
            let streak = 0;
            for (let i = 0; i < 365; i++) {
                const d = new Date(now);
                d.setDate(d.getDate() - i);
                const ds = d.toISOString().split('T')[0];
                if (data.attendance[ds]) streak++;
                else if (i > 0) break;
            }
            return streak;
        }

        // ================================================================

        // The following functions are included but not fully displayed here due to space.

        // ================================================================
        //  GLOBAL SEARCH
        // ================================================================

        function showGlobalSearch() {
            openModal(`
            <div class="modal-title">🔍 Global Search</div>
            <div class="modal-sub">Search across all your data.</div>
            <div class="form-group"><input id="globalSearchInput" placeholder="Type to search..." oninput="performGlobalSearch()" autofocus /></div>
            <div id="globalSearchResults" class="search-results"></div>
            <div class="form-actions"><button class="btn" onclick="closeModal()">Close</button></div>
          `);
            document.getElementById('globalSearchInput').focus();
        }

        function performGlobalSearch() {
            const query = document.getElementById('globalSearchInput').value.toLowerCase().trim();
            const results = document.getElementById('globalSearchResults');
            if (!query) { results.innerHTML = '<div class="text-muted text-sm">Start typing...</div>'; return; }
            const items = [];
            data.notes.forEach(n => { if (n.title.toLowerCase().includes(query) || (n.content||'').toLowerCase().includes(query)) items.push({ type: 'Note', title: n.title||'Untitled', id: n.id, page: 'notes' }); });
            data.tasks.forEach(t => { if (t.title.toLowerCase().includes(query)) items.push({ type: 'Task', title: t.title, id: t.id, page: 'tasks' }); });
            data.mistakes.forEach(m => { if ((m.question||'').toLowerCase().includes(query)) items.push({ type: 'Mistake', title: m.question||'Mistake', id: m.id, page: 'mistakes' }); });
            data.flashcards.forEach(f => { if ((f.front||'').toLowerCase().includes(query) || (f.back||'').toLowerCase().includes(query)) items.push({ type: 'Flashcard', title: f.front||'Card', id: f.id, page: 'flashcards' }); });
            data.pastPapers.forEach(p => { if ((p.title||'').toLowerCase().includes(query) || (p.fileName||'').toLowerCase().includes(query)) items.push({ type: 'Past Paper', title: p.title||p.fileName||'Paper', id: p.id, page: 'pastpapers' }); });
            data.videos.forEach(v => { if ((v.title||'').toLowerCase().includes(query)) items.push({ type: 'Video', title: v.title||'Video', id: v.id, page: 'videos' }); });
            data.documents.forEach(d => { if ((d.title||'').toLowerCase().includes(query) || (d.fileName||'').toLowerCase().includes(query)) items.push({ type: 'Document', title: d.title||d.fileName||'Doc', id: d.id, page: 'documents' }); });
            data.activities.forEach(a => { if ((a.name||'').toLowerCase().includes(query)) items.push({ type: 'Activity', title: a.name, id: a.id, page: 'activities' }); });
            data.projects.forEach(p => { if ((p.name||'').toLowerCase().includes(query)) items.push({ type: 'Project', title: p.name, id: p.id, page: 'projects' }); });
            data.universities.forEach(u => { if ((u.name||'').toLowerCase().includes(query)) items.push({ type: 'University', title: u.name, id: u.id, page: 'universities' }); });
            data.essays.forEach(e => { if ((e.title||'').toLowerCase().includes(query)) items.push({ type: 'Essay', title: e.title, id: e.id, page: 'essays' }); });
            data.bookmarks.forEach(b => { if ((b.title||'').toLowerCase().includes(query) || (b.tags||'').toLowerCase().includes(query)) items.push({ type: 'Bookmark', title: b.title, id: b.id, page: 'bookmarks' }); });
            if (items.length === 0) { results.innerHTML = '<div class="text-muted text-sm">No results found.</div>'; return; }
            results.innerHTML = items.map(item =>
                `<div class="search-result-item" onclick="closeModal();navigate('${item.page}')">
              <div class="result-title">${item.type}: ${item.title}</div>
              <div class="result-meta">${item.page}</div>
            </div>`
            ).join('');
        }

        // ================================================================
        //  DARK MODE TOGGLE
        // ================================================================

        function toggleDarkMode() {
            data.settings.darkMode = !data.settings.darkMode;
            saveData();
            applyTheme();
            toast(data.settings.darkMode ? '🌙 Dark mode on' : '☀️ Light mode on', 'info');
            renderPage(currentPage);
        }

        // ================================================================
        //  SETTINGS
        // ================================================================

        function renderSettings() {
            const settings = data.settings || {};
            return `
            <div class="page-title">⚙️ Settings</div>
            <div class="page-subtitle">Customize your experience.</div>
            <div class="card"><div style="font-weight:600;margin-bottom:0.5rem;">👤 Student Profile</div>
              <div class="form-group"><label>Name</label><input id="settingsName" value="${data.student.name||'Maira'}" /></div>
              <div class="form-group"><label>Grade</label><input id="settingsGrade" value="${data.student.grade||'Grade 9'}" /></div>
              <div class="form-group"><label>Academic Year</label><input id="settingsYear" value="${data.student.currentYear||'2026-2027'}" /></div>
              <div class="form-group"><label>Exam Year</label><input id="settingsExamYear" value="${data.student.examYear||'CIE 2027'}" /></div>
              <button class="btn btn-primary" onclick="saveSettings()">Save Profile</button>
            </div>
            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">🎨 Appearance</div>
              <div class="flex-between"><span>Dark Mode</span>
                <button class="btn ${settings.darkMode?'btn-gold':'btn-primary'}" onclick="toggleDarkMode()">${settings.darkMode?'☀️ Light':'🌙 Dark'}</button>
              </div>
              <div class="form-group mt-1">
                <label>Accent Color</label>
                <div class="color-picker-wrapper">
                  <input type="color" id="accentColorPicker" value="${settings.accentColor||'#6c3b9a'}" onchange="changeAccentColor(this.value)" />
                  <span class="text-sm">Click to choose</span>
                </div>
              </div>
              <div class="form-group mt-1">
                <label>Font Size: <span id="fontSizeLabel">${settings.fontSize||16}px</span></label>
                <input type="range" min="12" max="24" value="${settings.fontSize||16}" id="fontSizeSlider" oninput="changeFontSize(this.value)" />
              </div>
            </div>
            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">💾 Data Management</div>
              <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
                <button class="btn btn-outline" onclick="exportData()">📤 Export</button>
                <button class="btn btn-outline" onclick="document.getElementById('importInput').click()">📥 Import</button>
                <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importData(event)" />
                <button class="btn btn-danger" onclick="resetData()">⚠️ Reset All</button>
              </div>
            </div>
            <div class="card mt-2"><div style="font-weight:600;margin-bottom:0.5rem;">📊 Stats</div>
              <div class="text-sm text-muted">Subjects: ${data.subjects.length} · Notes: ${data.notes.length} · Tasks: ${data.tasks.length} · Mistakes: ${data.mistakes.length} · Flashcards: ${data.flashcards.length} · Past Papers: ${data.pastPapers.length} · Videos: ${data.videos.length} · Documents: ${data.documents.length} · Projects: ${data.projects.length} · Skills: ${data.skills.length} · Activities: ${data.activities.length} · Goals: ${data.goals.length} · Stories: ${data.stories.length} · Universities: ${data.universities.length} · Essays: ${data.essays.length} · Recommendations: ${data.recommendations.length} · Scholarships: ${data.scholarships.length} · Evidence: ${data.evidence.length} · Habits: ${data.habits.length} · Bookmarks: ${data.bookmarks.length}</div>
              <div class="text-xs text-muted mt-1">Last saved: ${new Date().toLocaleString()}</div>
            </div>
          `;
        }

        function saveSettings() {
            data.student.name = document.getElementById('settingsName').value.trim() || 'Maira';
            data.student.grade = document.getElementById('settingsGrade').value.trim() || 'Grade 9';
            data.student.currentYear = document.getElementById('settingsYear').value.trim() || '2026-2027';
            data.student.examYear = document.getElementById('settingsExamYear').value.trim() || 'CIE 2027';
            saveData();
            toast('✅ Settings saved', 'success');
            renderPage('settings');
        }

        function changeAccentColor(color) {
            data.settings.accentColor = color;
            saveData();
            applyTheme();
            toast('🎨 Accent color updated', 'info');
        }

        function changeFontSize(size) {
            data.settings.fontSize = parseInt(size);
            document.getElementById('fontSizeLabel').textContent = size + 'px';
            saveData();
            applyTheme();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `olevel_cc_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            toast('📤 Exported', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.subjects) {
                        data = imported;
                        saveData();
                        toast('✅ Imported', 'success');
                        renderPage('settings');
                        navigate('dashboard');
                    } else {
                        toast('Invalid file.', 'error');
                    }
                } catch (_) { toast('Error reading file.', 'error'); }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetData() {
            if (!confirm('⚠️ Erase ALL data? This is irreversible.')) return;
            data = getDefaultData();
            saveData();
            toast('🗑️ Reset to defaults', 'info');
            renderPage('settings');
            navigate('dashboard');
        }

        // ================================================================
        //  QUICK ADD (FAB)
        // ================================================================

        document.getElementById('fabButton').addEventListener('click', () => {
            const options = [
                { label: '📝 New Note', action: 'showAddNote()' },
                { label: '✅ New Task', action: 'showAddTask()' },
                { label: '❌ New Mistake', action: 'showAddMistake()' },
                { label: '🃏 New Flashcard', action: 'showAddFlashcard()' },
                { label: '📄 New Past Paper', action: 'showAddPastPaper()' },
                { label: '🎥 New Video', action: 'showAddVideo()' },
                { label: '📁 New Document', action: 'showAddDocument()' },
                { label: '🏆 New Activity', action: 'showAddActivity()' },
                { label: '🚀 New Project', action: 'showAddProject()' },
                { label: '🧠 New Skill', action: 'showAddSkill()' },
                { label: '🎯 New Goal', action: 'showAddGoal()' },
                { label: '📖 New Story', action: 'showAddStory()' },
                { label: '🏛️ New University', action: 'showAddUniversity()' },
                { label: '✍️ New Essay', action: 'showAddEssay()' },
                { label: '📋 New Recommender', action: 'showAddRecommendation()' },
                { label: '💰 New Scholarship', action: 'showAddScholarship()' },
                { label: '📦 New Evidence', action: 'showAddEvidence()' },
                { label: '📅 New Timetable Slot', action: 'showAddTimetableSlot()' },
                { label: '🔄 New Habit', action: 'showAddHabit()' },
                { label: '😊 Log Mood', action: 'showAddMood()' },
                { label: '🔖 New Bookmark', action: 'showAddBookmark()' },
            ];
            let html = `<div class="modal-title">✨ Quick Add</div><div class="modal-sub">Choose what to create.</div><div style="display:flex;flex-direction:column;gap:0.3rem;max-height:300px;overflow-y:auto;">`;
            options.forEach(opt => {
                html += `<button class="btn btn-ghost" style="justify-content:flex-start;padding:0.4rem 0.8rem;font-size:0.85rem;" onclick="closeModal();${opt.action}">${opt.label}</button>`;
            });
            html += `</div><div class="form-actions"><button class="btn" onclick="closeModal()">Cancel</button></div>`;
            openModal(html);
        });

        // ================================================================
        //  INIT
        // ================================================================

        renderNav();
        renderPage('dashboard');

        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'D') { e.preventDefault(); navigate('dashboard'); }
            if (e.ctrlKey && e.key === 'k') { e.preventDefault(); showGlobalSearch(); }
        });

        console.log('🚀 O‑LEVEL COMMAND CENTER — ULTIMATE EDITION');
        console.log('✨ Drag & drop, sound effects, custom themes, and glassmorphism.');
        console.log('💾 All data persists in localStorage + IndexedDB for files.');
        console.log('🎨 Customize accent color and font size in Settings.');
    </script>
