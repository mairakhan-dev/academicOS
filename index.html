        function addEssay() {
            const title = document.getElementById('essayTitle').value.trim();
            if (!title) { toast('Essay title is required.', 'error'); return; }
            data.essays.push({
                id: genId(),
                title,
                type: document.getElementById('essayType').value,
                prompt: document.getElementById('essayPrompt').value || '',
                wordLimit: parseInt(document.getElementById('essayWordLimit').value) || null,
                deadline: document.getElementById('essayDeadline').value || null,
                drafts: [''],
                notes: '',
                feedback: '',
                finalVersion: null,
                universityId: null,
                createdAt: new Date().toISOString(),
            });
            saveData();
            closeModal();
            toast('✅ Essay created', 'success');
            renderPage('essays');
        }

        function editEssay(id) {
            const e = data.essays.find(e => e.id === id);
            if (!e) return;
            openModal(`
            <div class="modal-title">✍️ Edit Essay</div>
            <div class="form-group">
              <label>Title</label>
              <input id="editEssayTitle" value="${e.title}" />
            </div>
            <div class="form-group">
              <label>Type</label>
              <select id="editEssayType">
                ${['Personal Statement','Supplemental','Why Major','Why University','Community/Identity','Short Answer','Other'].map(t => `<option value="${t}" ${t===e.type?'selected':''}>${t}</option>`).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>Prompt</label>
              <textarea id="editEssayPrompt" rows="2">${e.prompt || ''}</textarea>
            </div>
            <div class="form-group">
              <label>Word Limit</label>
              <input id="editEssayWordLimit" type="number" value="${e.wordLimit || ''}" />
            </div>
            <div class="form-group">
              <label>Deadline</label>
              <input id="editEssayDeadline" type="date" value="${e.deadline || ''}" />
            </div>
            <div class="form-group">
              <label>Latest Draft</label>
              <textarea id="editEssayDraft" rows="4">${e.drafts && e.drafts.length > 0 ? e.drafts[e.drafts.length-1] : ''}</textarea>
            </div>
            <div class="form-group">
              <label>Notes / Feedback</label>
              <textarea id="editEssayNotes" rows="2">${e.notes || ''}</textarea>
            </div>
            <div class="form-actions">
              <button class="btn" onclick="closeModal()">Cancel</button>
              <button class="btn btn-primary" onclick="saveEditEssay('${id}')">Save</button>
            </div>
          `);
        }

        function saveEditEssay(id) {
            const e = data.essays.find(e => e.id === id);
            if (!e) return;
            e.title = document.getElementById('editEssayTitle').value.trim() || 'Essay';
            e.type = document.getElementById('editEssayType').value;
            e.prompt = document.getElementById('editEssayPrompt').value || '';
            e.wordLimit = parseInt(document.getElementById('editEssayWordLimit').value) || null;
            e.deadline = document.getElementById('editEssayDeadline').value || null;
            const draft = document.getElementById('editEssayDraft').value;
            if (draft) {
                if (!e.drafts) e.drafts = [];
                e.drafts.push(draft);
                if (e.drafts.length > 20) e.drafts.shift();
            }
            e.notes = document.getElementById('editEssayNotes').value || '';
            saveData();
            closeModal();
            toast('✅ Essay updated', 'success');
            renderPage('essays');
        }

        function deleteEssay(id) {
            if (!confirm('Delete this essay?')) return;
            data.essays = data.essays.filter(e => e.id !== id);
            saveData();
            toast('🗑️ Essay deleted', 'info');
            renderPage('essays');
        }

        // ================================================================
        //  SETTINGS
        // ================================================================

        function renderSettings() {
            return `
            <div class="page-title">⚙️ Settings</div>
            <div class="page-subtitle">Manage your profile, data, and preferences.</div>

            <div class="card">
              <div style="font-weight:600;margin-bottom:0.5rem;">👤 Student Profile</div>
              <div class="form-group">
                <label>Name</label>
                <input id="settingsName" value="${data.student.name || 'Maira'}" />
              </div>
              <div class="form-group">
                <label>Grade</label>
                <input id="settingsGrade" value="${data.student.grade || 'Grade 9'}" />
              </div>
              <div class="form-group">
                <label>Current Academic Year</label>
                <input id="settingsYear" value="${data.student.currentYear || '2026-2027'}" />
              </div>
              <div class="form-group">
                <label>Exam Year</label>
                <input id="settingsExamYear" value="${data.student.examYear || 'CIE 2027'}" />
              </div>
              <button class="btn btn-primary" onclick="saveSettings()">Save Profile</button>
            </div>

            <div class="card mt-2">
              <div style="font-weight:600;margin-bottom:0.5rem;">💾 Data Management</div>
              <div style="display:flex;gap:0.6rem;flex-wrap:wrap;">
                <button class="btn btn-outline" onclick="exportData()">📤 Export Data</button>
                <button class="btn btn-outline" onclick="document.getElementById('importInput').click()">📥 Import Data</button>
                <input type="file" id="importInput" accept=".json" style="display:none;" onchange="importData(event)" />
                <button class="btn btn-danger" onclick="resetData()">⚠️ Reset All Data</button>
              </div>
            </div>

            <div class="card mt-2">
              <div style="font-weight:600;margin-bottom:0.5rem;">📊 Stats</div>
              <div class="text-sm text-muted">
                Subjects: ${data.subjects.length} ·
                Notes: ${data.notes.length} ·
                Tasks: ${data.tasks.length} ·
                Mistakes: ${data.mistakes.length} ·
                Flashcards: ${data.flashcards.length} ·
                Activities: ${data.activities.length} ·
                Goals: ${data.goals.length} ·
                Stories: ${data.stories.length} ·
                Universities: ${data.universities.length} ·
                Essays: ${data.essays.length}
              </div>
              <div class="text-xs text-muted mt-1">Data version: v${data.version || 1} · Last saved: ${new Date().toLocaleString()}</div>
            </div>
          `;
        }

        function saveSettings() {
            data.student.name = document.getElementById('settingsName').value.trim() || 'Maira';
            data.student.grade = document.getElementById('settingsGrade').value.trim() || 'Grade 9';
            data.student.currentYear = document.getElementById('settingsYear').value.trim() || '2026-2027';
            data.student.examYear = document.getElementById('settingsExamYear').value.trim() || 'CIE 2027';
            saveData();
            toast('✅ Settings saved', 'success');
            renderPage('settings');
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `olevel_cc_backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
            toast('📤 Data exported', 'success');
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (imported.subjects && imported.notes) {
                        data = imported;
                        saveData();
                        toast('✅ Data imported successfully', 'success');
                        renderPage('settings');
                        navigate('dashboard');
                    } else {
                        toast('Invalid data file.', 'error');
                    }
                } catch (_) {
                    toast('Error reading file.', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

        function resetData() {
            if (!confirm('⚠️ This will erase ALL your data. Are you sure?')) return;
            if (!confirm('Really? This is irreversible.')) return;
            data = getDefaultData();
            saveData();
            toast('🗑️ Data reset to defaults', 'info');
            renderPage('settings');
            navigate('dashboard');
        }

        // ================================================================
        //  INIT
        // ================================================================

        renderNav();
        renderPage('dashboard');
        saveData();

        // keyboard shortcut: Ctrl+Shift+D for dashboard
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                e.preventDefault();
                navigate('dashboard');
            }
        });

        console.log('🚀 O-LEVEL COMMAND CENTER loaded');
        console.log(`📊 ${data.subjects.length} subjects, ${data.notes.length} notes, ${data.tasks.length} tasks`);
    </script>
